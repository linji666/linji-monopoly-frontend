<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1140">
<title>四叶草许愿海</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1140;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
  #sky,#field{position:fixed;inset:0;width:100%;height:100%;display:block}
  #field{touch-action:none}

  #hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;
    color:#f0e2ff;font-size:13px;letter-spacing:1.5px;opacity:.92;
    text-shadow:0 0 12px rgba(180,140,255,.8);
    pointer-events:none;transition:opacity .5s}
  #hint.gone{opacity:0}

  #modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(14,8,34,.72);backdrop-filter:blur(4px);z-index:20}
  #modal.on{display:flex}
  .card{width:min(88vw,380px);border-radius:20px;padding:24px 18px 16px;
    background:linear-gradient(160deg,#2a1b52,#3d2a6b 55%,#4a2f66);
    border:1px solid rgba(214,180,255,.42);
    box-shadow:0 0 60px rgba(150,110,255,.45),0 18px 50px rgba(0,0,0,.55)}
  .card h2{margin:0 0 6px;font-size:17px;color:#f6ecff;font-weight:600;
    letter-spacing:8px;text-align:center;text-shadow:0 0 16px rgba(200,160,255,.9)}
  .card p{margin:0 0 16px;font-size:12px;color:#c2a8ee;text-align:center;letter-spacing:1px}
  #wish{width:100%;height:92px;background:rgba(15,9,38,.72);
    border:1px solid rgba(180,145,255,.42);border-radius:13px;color:#f4ecff;
    font-size:15px;line-height:1.65;padding:11px 12px;resize:none;outline:none;
    font-family:inherit}
  #wish::placeholder{color:#7d69b0}
  #sign{width:100%;margin-top:9px;background:rgba(15,9,38,.72);
    border:1px solid rgba(180,145,255,.42);border-radius:13px;color:#f4ecff;
    font-size:14px;padding:10px 12px;outline:none;font-family:inherit}
  #sign::placeholder{color:#7d69b0}
  .row{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;padding:12px 0;border-radius:13px;font-size:15px;
    font-family:inherit;font-weight:600;cursor:pointer;transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .ok{background:linear-gradient(135deg,#a8f0d0,#8fd8ff);color:#1a1040;border:none;
    box-shadow:0 0 26px rgba(150,230,255,.5)}
  .no{background:transparent;color:#c2a8ee;border:1px solid rgba(180,145,255,.42)}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="field"></canvas>
<div id="hint">点一朵四叶草，摘掉四片叶子许个愿</div>

<div id="modal"><div class="card">
  <h2>许 愿</h2>
  <p>一行不超过十个字，写完挂上去</p>
  <textarea id="wish" maxlength="40" placeholder="写下你的愿望…"></textarea>
  <input id="sign" maxlength="8" placeholder="署名">
  <div class="row">
    <button class="btn no" id="cancel">再想想</button>
    <button class="btn ok" id="submit">挂上去</button>
  </div>
</div></div>

<script>
(function(){
'use strict';

var DPR = Math.min(window.devicePixelRatio||1, 2);
var W = 0, H = 0;
var skyC = document.getElementById('sky');
var fldC = document.getElementById('field');
var skg = skyC.getContext('2d');
var fg  = fldC.getContext('2d');
var hint = document.getElementById('hint');

/* ===== 梦幻配色 ===== */
var C = {
  sky0 : '#120a2e',   /* 天顶 深紫蓝 */
  sky1 : '#241354',   /* 中上 紫 */
  sky2 : '#3d2069',   /* 中下 紫 */
  sky3 : '#5c2f70',   /* 低空 紫红 */
  sky4 : '#7a4a7d',   /* 地平线 柔紫粉 */
  haze : '#c39bff',   /* 雾光 */

  grassFar : '#5ec9a8',
  grassMid : '#7ee8bd',
  grassNear: '#a9f5cf',
  grassLip : 'rgba(230,255,245,.72)',

  leafEdge : '#2f8f7a',
  leafFill : '#8fe3b8',
  leafVein : '#4bbf96',
  bloom    : '#ffe98a',
  bloomHi  : '#fffbd4',
  petal    : '#fff6c8',
  stem     : '#37a184'
};

function rnd(a,b){ return a + Math.random()*(b-a); }

/* ============ 四叶草精灵 ============ */
function makeClover(px, kind){
  var cv = document.createElement('canvas');
  cv.width = px; cv.height = px;
  var g = cv.getContext('2d');
  g.translate(px*0.5, px*0.60);

  var s = px / 100;
  var edge = kind===2 ? '#1f6b58' : C.leafEdge;
  var fill = kind===2 ? '#4d8f7c' : C.leafFill;
  if(kind===1) fill = '#b3f0d6';

  /* 辉光底 */
  if(kind!==1){
    g.save();
    var gr = g.createRadialGradient(0,-12*s,2*s, 0,-12*s, 46*s);
    gr.addColorStop(0,'rgba(180,255,225,.30)');
    gr.addColorStop(1,'rgba(180,255,225,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(0,-12*s,46*s,0,Math.PI*2); g.fill();
    g.restore();
  }

  /* 茎 */
  g.save();
  g.strokeStyle = kind===2 ? '#1f6b58' : C.stem;
  g.lineWidth = 4.2*s;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(0,-2*s);
  g.quadraticCurveTo(-7*s,20*s, -15*s,39*s);
  g.stroke();
  g.restore();

  /* 四片心形叶 */
  var R = 25*s;
  for(var i=0;i<4;i++){
    g.save();
    g.rotate(i*Math.PI/2);

    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(-R*1.18,-R*0.42, -R*1.02,-R*1.42, 0,-R*1.52);
    g.bezierCurveTo( R*1.02,-R*1.42,  R*1.18,-R*0.42, 0,0);
    g.closePath();

    if(kind===0){
      g.shadowColor = 'rgba(150,255,215,.55)';
      g.shadowBlur = 10*s;
    }
    g.fillStyle = fill;
    g.fill();
    g.shadowBlur = 0;

    g.lineWidth = 6*s;
    g.strokeStyle = edge;
    g.stroke();

    /* 叶脉 */
    g.beginPath();
    g.moveTo(0,-5*s);
    g.lineTo(0,-30*s);
    g.lineWidth = 1.9*s;
    g.strokeStyle = kind===2 ? '#357a68' : C.leafVein;
    g.stroke();

    g.restore();
  }

  /* 中间小黄花 */
  g.save();
  var pr = 7.4*s;
  g.shadowColor = 'rgba(255,240,150,.9)';
  g.shadowBlur = kind===0 ? 9*s : 0;
  for(var p=0;p<5;p++){
    g.save();
    g.rotate(p*Math.PI*2/5);
    g.beginPath();
    g.ellipse(0,-pr*0.85, pr*0.62, pr*0.95, 0, 0, Math.PI*2);
    g.fillStyle = C.petal;
    g.fill();
    g.restore();
  }
  g.beginPath();
  g.arc(0,0, pr*0.72, 0, Math.PI*2);
  g.fillStyle = kind===2 ? '#d8c96a' : C.bloom;
  g.fill();
  g.beginPath();
  g.arc(-pr*0.18,-pr*0.18, pr*0.3, 0, Math.PI*2);
  g.fillStyle = kind===2 ? '#e8dc90' : C.bloomHi;
  g.fill();
  g.restore();

  return cv;
}

var SPR = [];
function buildSprites(){
  SPR = [];
  var base = 96;
  for(var k=0;k<3;k++){
    var row = [];
    for(var a=0;a<4;a++){
      var cv = makeClover(base, k);
      var rot = document.createElement('canvas');
      rot.width = rot.height = base;
      var rg = rot.getContext('2d');
      rg.translate(base/2, base/2);
      rg.rotate(a*0.09 - 0.13);
      rg.drawImage(cv, -base/2, -base/2);
      row.push(rot);
    }
    SPR.push(row);
  }
}

/* ============ 星星 ============ */
var stars = [];
var fireflies = [];
var PAL = ['255,255,255', '214,190,255', '255,205,235', '190,225,255'];

function buildStars(){
  stars = [];
  var n = Math.round(W*H/6500);
  for(var i=0;i<n;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.66,
      r: rnd(0.55, 1.75),
      a: rnd(0.30, 0.98),
      tw: rnd(0.5, 2.6),
      ph: Math.random()*Math.PI*2,
      col: PAL[Math.floor(Math.random()*PAL.length)]
    });
  }
  /* 萤火虫 */
  fireflies = [];
  var fn = 26;
  for(var j=0;j<fn;j++){
    fireflies.push({
      x: Math.random()*W,
      y: H*0.30 + Math.random()*H*0.62,
      r: rnd(1.4, 2.9),
      sp: rnd(0.10, 0.34),
      ph: Math.random()*Math.PI*2,
      amp: rnd(10, 34),
      a: rnd(0.35, 0.95)
    });
  }
}

function drawSky(t){
  skg.clearRect(0,0,W,H);

  var horizon = H*0.80;
  var grad = skg.createLinearGradient(0,0,0,horizon);
  grad.addColorStop(0,    C.sky0);
  grad.addColorStop(0.34, C.sky1);
  grad.addColorStop(0.62, C.sky2);
  grad.addColorStop(0.85, C.sky3);
  grad.addColorStop(1,    C.sky4);
  skg.fillStyle = grad;
  skg.fillRect(0,0,W,horizon);

  /* 柔紫雾光（地平线附近） */
  var hz = skg.createRadialGradient(W*0.42, H*0.80, 10, W*0.42, H*0.80, Math.max(W,H)*0.62);
  hz.addColorStop(0,   'rgba(200,160,255,.34)');
  hz.addColorStop(0.45,'rgba(160,120,220,.15)');
  hz.addColorStop(1,   'rgba(120,90,190,0)');
  skg.fillStyle = hz;
  skg.fillRect(0,0,W,horizon+40);

  /* 两团云雾 */
  var cloud = function(cx, cy, rx, ry, a){
    var g2 = skg.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
    g2.addColorStop(0,'rgba(190,160,255,'+a+')');
    g2.addColorStop(0.55,'rgba(150,120,220,'+(a*0.45)+')');
    g2.addColorStop(1,'rgba(120,95,190,0)');
    skg.save();
    skg.translate(cx,cy);
    skg.scale(1, ry/rx);
    skg.beginPath(); skg.arc(0,0,rx,0,Math.PI*2);
    skg.fillStyle = g2;
    skg.fill();
    skg.restore();
  };
  cloud(W*0.18, H*0.60, W*0.46, H*0.11, '0.16');
  cloud(W*0.86, H*0.50, W*0.40, H*0.09, '0.13');

  /* 星星 */
  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var a = s.a * (0.55 + 0.45*Math.sin(t*0.0012*s.tw + s.ph));
    skg.beginPath();
    skg.arc(s.x, s.y, s.r, 0, Math.PI*2);
    skg.fillStyle = 'rgba('+s.col+','+a.toFixed(3)+')';
    skg.fill();

    if(s.r > 1.32){
      var g3 = skg.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*8);
      g3.addColorStop(0,'rgba('+s.col+','+(a*0.34).toFixed(3)+')');
      g3.addColorStop(1,'rgba('+s.col+',0)');
      skg.beginPath(); skg.arc(s.x,s.y,s.r*8,0,Math.PI*2);
      skg.fillStyle = g3;
      skg.fill();
    }
  }

  /* 萤火虫 */
  for(var j=0;j<fireflies.length;j++){
    var f = fireflies[j];
    var fx = f.x + Math.sin(t*0.00042*f.sp + f.ph)*f.amp;
    var fy = f.y + Math.cos(t*0.00031*f.sp + f.ph*1.7)*f.amp*0.62;
    var fa = f.a * (0.30 + 0.70*Math.abs(Math.sin(t*0.0011*f.sp + f.ph)));
    var g4 = skg.createRadialGradient(fx,fy,0,fx,fy,f.r*11);
    g4.addColorStop(0,'rgba(235,255,170,'+(fa*0.95).toFixed(3)+')');
    g4.addColorStop(0.24,'rgba(200,255,140,'+(fa*0.42).toFixed(3)+')');
    g4.addColorStop(1,'rgba(180,255,120,0)');
    skg.beginPath(); skg.arc(fx,fy,f.r*11,0,Math.PI*2);
    skg.fillStyle = g4;
    skg.fill();

    skg.beginPath();
    skg.arc(fx,fy,f.r*0.85,0,Math.PI*2);
    skg.fillStyle = 'rgba(255,255,215,'+fa.toFixed(3)+')';
    skg.fill();
  }
}

/* ============ 草坡 ============ */
function ridgeY(x){
  var u = x / W;
  var base = H*0.76 - u*H*0.31;
  if(u > 0.58) base -= (u-0.58)*H*0.17;
  base += Math.sin(u*Math.PI*2.1)*H*0.028;
  base += Math.sin(u*Math.PI*5.3+1.3)*H*0.013;
  return base;
}

var clovers = [];

function buildField(){
  clovers = [];
  var target = Math.round(W*H/6200);
  target = Math.max(90, Math.min(target, 460));

  for(var i=0;i<target;i++){
    var x = Math.random()*W;
    var top = ridgeY(x);
    var v = Math.pow(Math.random(), 0.72);
    var y = top + v*(H - top)*0.92;

    var depth = v;
    var scale = 0.34 + (1-depth)*0.72;
    var alpha = 0.52 + (1-depth)*0.48;
    var kind  = depth > 0.62 ? 1 : 0;

    clovers.push({
      x:x, y:y, depth:depth,
      sc: scale * rnd(0.86,1.14),
      al: alpha, kind: kind,
      angle: Math.floor(Math.random()*4),
      sway: rnd(0.4,1.5),
      ph: Math.random()*Math.PI*2,
      used:false, wish:''
    });
  }
  clovers.sort(function(a,b){ return a.y - b.y; });
}

function drawField(t, skip){
  fg.clearRect(0,0,W,H);

  /* 坡面：薄荷青绿，越近越亮 */
  fg.save();
  fg.beginPath();
  fg.moveTo(0, H);
  fg.lineTo(0, ridgeY(0));
  for(var x=0;x<=W;x+=6){ fg.lineTo(x, ridgeY(x)); }
  fg.lineTo(W, H);
  fg.closePath();

  var gg = fg.createLinearGradient(0, ridgeY(W*0.6), 0, H);
  gg.addColorStop(0,   C.grassFar);
  gg.addColorStop(0.42,C.grassMid);
  gg.addColorStop(1,   C.grassNear);
  fg.fillStyle = gg;
  fg.fill();

  /* 坡面上的柔光 */
  var sg = fg.createLinearGradient(0, ridgeY(W*0.5), 0, H);
  sg.addColorStop(0,'rgba(210,255,240,.28)');
  sg.addColorStop(0.6,'rgba(190,255,225,.06)');
  sg.addColorStop(1,'rgba(255,230,255,.14)');
  fg.fillStyle = sg;
  fg.fill();
  fg.restore();

  /* 坡顶描边：发亮的边 */
  fg.save();
  fg.beginPath();
  fg.moveTo(0, ridgeY(0));
  for(var x2=0;x2<=W;x2+=4){ fg.lineTo(x2, ridgeY(x2)); }
  fg.lineWidth = 2.6;
  fg.strokeStyle = C.grassLip;
  fg.shadowColor = 'rgba(200,255,235,.9)';
  fg.shadowBlur = 12;
  fg.stroke();
  fg.restore();

  /* 叶尖白点 */
  fg.save();
  for(var d=0; d<Math.round(W*H/16000); d++){
    var dx = Math.random()*W;
    var dtop = ridgeY(dx);
    var dy = dtop + Math.random()*(H-dtop)*0.9;
    var dv = (dy-dtop)/Math.max(1,(H-dtop));
    fg.beginPath();
    fg.arc(dx, dy, rnd(0.7,1.6), 0, Math.PI*2);
    fg.fillStyle = 'rgba(255,255,250,'+(0.34-dv*0.24).toFixed(3)+')';
    fg.fill();
  }
  fg.restore();

  for(var i=0;i<clovers.length;i++){
    var c = clovers[i];
    if(skip && skip === c) continue;
    drawOne(c, t);
  }
}

function drawOne(c, t){
  var px = 96 * c.sc * (Math.min(W,H)/420);
  if(px < 6) px = 6;
  if(px > 200) px = 200;

  var sway = Math.sin(t*0.0009*c.sway + c.ph) * (px*0.035);
  var img = SPR[ c.used ? 2 : c.kind ][ c.angle ];
  if(!img) return;

  var alpha = c.al;
  if(c.depth < 0.2) alpha = Math.min(1, alpha + 0.06);

  fg.save();
  fg.globalAlpha = alpha;
  fg.translate(c.x + sway, c.y);
  fg.drawImage(img, -px/2, -px*0.62, px, px);

  if(c.used){
    var g = fg.createRadialGradient(0,-px*0.12,0,0,-px*0.12,px*0.5);
    g.addColorStop(0,'rgba(255,240,170,.22)');
    g.addColorStop(1,'rgba(255,240,170,0)');
    fg.beginPath(); fg.arc(0,-px*0.12,px*0.5,0,Math.PI*2);
    fg.fillStyle = g;
    fg.fill();
  }
  fg.restore();
}

/* ============ 交互 ============ */
var picked = null;
var picking = false;
var anim = null;
var petals = 4;

function hitTest(mx,my){
  var best = null, bestD = 1e9;
  for(var i=clovers.length-1;i>=0;i--){
    var c = clovers[i];
    if(c.used) continue;
    if(c.depth > 0.72) continue;
    var px = 96 * c.sc * (Math.min(W,H)/420);
    var rx = Math.max(24, px*0.52), ry = Math.max(24, px*0.58);
    var dx = (mx-c.x)/rx, dy = (my-(c.y-px*0.12))/ry;
    var d = dx*dx + dy*dy;
    if(d < 1 && d < bestD){ bestD = d; best = c; }
  }
  return best;
}

fldC.addEventListener('pointerdown', function(e){
  if(picking){
    /* 摘叶 */
    petals--;
    if(petals > 0){
      if(petals === 1) showHint('最后一片了');
      return;
    }
    picking = false;
    var target = picked;
    picked = null; anim = null;
    showHint('');
    openModal(target);
    return;
  }
  if(picked) return;

  var r = fldC.getBoundingClientRect();
  var mx = (e.clientX - r.left) * W / r.width;
  var my = (e.clientY - r.top)  * H / r.height;
  var c = hitTest(mx,my);
  if(!c) return;

  picked = c; petals = 4;
  showHint('点一下，摘掉一片叶子');
  flyIn(c);
});

function flyIn(c){
  picking = true;
  anim = { t0: performance.now(), dur: 640,
           x0:c.x, y0:c.y, x1:W*0.5, y1:H*0.44,
           s0:c.sc, s1:2.35 };
  (function tick(now){
    var k = Math.min(1,(now-anim.t0)/anim.dur);
    var e = 1-Math.pow(1-k,3);
    anim.x = anim.x0 + (anim.x1-anim.x0)*e;
    anim.y = anim.y0 + (anim.y1-anim.y0)*e;
    anim.s = anim.s0 + (anim.s1-anim.s0)*e;
    if(k<1) requestAnimationFrame(tick);
  })(performance.now());
}

/* ============ 主循环 ============ */
var t0 = performance.now();
function loop(){
  var t = performance.now() - t0;
  drawSky(t);
  drawField(t, picked);

  if(picking && anim && anim.x !== undefined){
    var px = 96 * anim.s * (Math.min(W,H)/420);
    var img = SPR[0][ Math.floor(t/300)%4 ];
    fg.save();
    fg.translate(anim.x, anim.y);
    fg.drawImage(img, -px/2, -px*0.62, px, px);
    fg.restore();

    if(petals > 0){
      fg.save();
      fg.globalAlpha = 0.5 + 0.5*Math.sin(t*0.006);
      fg.beginPath();
      fg.arc(anim.x, anim.y - px*0.12, px*0.64, 0, Math.PI*2);
      fg.strokeStyle = 'rgba(255,250,200,.6)';
      fg.lineWidth = 1.6;
      fg.shadowColor = 'rgba(255,245,170,.9)';
      fg.shadowBlur = 14;
      fg.stroke();
      fg.restore();
    }
  }
  requestAnimationFrame(loop);
}

/* ============ 许愿窗 ============ */
var modal = document.getElementById('modal');
var wishEl = document.getElementById('wish');
var signEl = document.getElementById('sign');
var curC = null;

function openModal(c){
  curC = c;
  wishEl.value = ''; signEl.value = '';
  modal.classList.add('on');
  setTimeout(function(){ wishEl.focus(); }, 280);
}

document.getElementById('cancel').addEventListener('click', function(){
  petals = 4;
  if(curC){ curC.used = false; curC.wish=''; }
  curC = null;
  modal.classList.remove('on');
  showHint('想好了再来点它一次');
});

document.getElementById('submit').addEventListener('click', function(){
  var w = wishEl.value.trim();
  var s = signEl.value.trim();
  if(!w){ wishEl.focus(); return; }
  if(curC){ curC.used = true; curC.wish = w + (s ? ' —— ' + s : ''); }
  save();
  curC = null;
  modal.classList.remove('on');
  showHint('愿望挂上去了，它会一直留在这儿');
});

/* ============ 本地存 ============ */
var KEY = 'clover_wishes_v3';
function save(){
  try{
    var list = [];
    for(var i=0;i<clovers.length;i++){
      if(clovers[i].used) list.push({x:clovers[i].x,y:clovers[i].y,w:clovers[i].wish});
    }
    localStorage.setItem(KEY, JSON.stringify(list));
  }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var list = JSON.parse(raw);
    for(var i=0;i<list.length;i++){
      var p = list[i], best=null, bd=1e9;
      for(var j=0;j<clovers.length;j++){
        var c = clovers[j];
        var d = (c.x-p.x)*(c.x-p.x)+(c.y-p.y)*(c.y-p.y);
        if(d<bd){ bd=d; best=c; }
      }
      if(best && bd<40000){ best.used=true; best.wish=p.w; }
    }
  }catch(e){}
}

/* ============ hint ============ */
var hintTimer = null;
function showHint(msg){
  if(!msg){ hint.classList.add('gone'); return; }
  hint.textContent = msg;
  hint.classList.remove('gone');
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hint.classList.add('gone'); }, 3200);
}

/* ============ 尺寸 ============ */
function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);

  [skyC, fldC].forEach(function(cv){
    cv.width  = Math.round(W*DPR);
    cv.height = Math.round(H*DPR);
    cv.style.width  = W+'px';
    cv.style.height = H+'px';
  });
  skg.setTransform(DPR,0,0,DPR,0,0);
  fg.setTransform(DPR,0,0,DPR,0,0);

  buildStars();
  buildField();
  load();
}

var rzTimer = null;
window.addEventListener('resize', function(){
  if(rzTimer) clearTimeout(rzTimer);
  rzTimer = setTimeout(resize, 220);
});
window.addEventListener('orientationchange', function(){ setTimeout(resize, 320); });

buildSprites();
resize();
setTimeout(function(){ showHint('点一朵四叶草，摘掉四片叶子许个愿'); }, 900);
loop();

})();
</script>
