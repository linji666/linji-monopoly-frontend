<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    background: linear-gradient(160deg,#eef4ff,#f7f0ff,#eafaf1);
    min-height:100vh; padding:28px 16px 60px; color:#4a4a5a;
  }
  .hero { text-align:center; margin-bottom:26px; }
  .hero h1 {

    background:linear-gradient(90deg,#6aa8ff,#9a7bff,#5bc9a2);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:8px;
  }
  .hero p { font-size:14px; color:#8a93ab; }
  .tag {
    display:inline-block; font-size:12px; color:#fff; border-radius:999px;
    padding:4px 12px; margin-top:10px;
    background:linear-gradient(90deg,#6aa8ff,#9a7bff);
  }
  section { max-width:960px; margin:0 auto; }
  .section-title { font-size:20px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .section-title .dot { width:10px; height:10px; border-radius:50%; background:#6aa8ff; }
  .sub { font-size:13px; color:#8a93ab; margin:4px 0 18px; }
  .grid {
    display:grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
    gap:16px;
  }
  .card {
    background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 4px 14px rgba(90,120,180,.12);
    transition: transform .18s, box-shadow .18s; padding:14px 12px 10px; text-align:center;
  }
  .card:hover { transform: translateY(-6px) scale(1.03); box-shadow:0 10px 24px rgba(90,120,180,.22); }
  .card svg { width:100%; max-width:150px; height:auto; }
  .card .cap {
    margin-top:8px; font-size:13px; color:#7a86a0; font-weight:600;
  }
  .footer { text-align:center; font-size:12px; color:#9aa6bf; margin-top:26px; line-height:1.9; }
