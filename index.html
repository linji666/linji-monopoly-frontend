<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林霁 & 桐桐 · 环游中国大富翁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS','PingFang SC',sans-serif;}
html,body{height:100%;}
body{background:linear-gradient(135deg,#ffe3ec,#f6e6ff,#e3f0ff);display:flex;flex-direction:column;overflow:hidden;}
#board{flex:1 1 auto;min-height:0;width:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr);gap:clamp(2px,0.5vw,5px);padding:clamp(3px,0.6vw,8px);overflow:hidden;}
.cell{background:#fff;border-radius:clamp(5px,1.2vw,9px);border:2px solid #ffd3e0;box-shadow:0 3px 8px rgba(200,107,138,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;min-height:0;min-width:0;}
.cell .e{font-size:clamp(14px,3vw,24px);line-height:1;}
.cell .n{font-size:clamp(7px,1.3vw,11px);color:#9b6a7e;font-weight:bold;line-height:1.1;margin-top:1px;max-width:96%;}
.cell .p{font-size:clamp(6px,1vw,9px);color:#c86b8a;}
.cell.start{background:linear-gradient(135deg,#fff0f5,#ffe3ec);border-color:#ff8fab;}
.cell.jail{background:linear-gradient(135deg,#f3e6ff,#e6d5ff);border-color:#b48cd9;}
.cell.event{background:linear-gradient(135deg,#fff8e6,#ffecc9);border-color:#e6b85c;}
.cell.owned-you{background:linear-gradient(135deg,#ffe9f0,#ffd9e8);}
.cell.owned-me{background:linear-gradient(135deg,#e8f0ff,#d9e3ff);}
.cell.here{border-color:#ff8fab;box-shadow:0 0 0 3px rgba(255,143,171,.4);}
.cell .who{position:absolute;top:1px;right:1px;font-size:clamp(9px,1.5vw,13px);background:#fff;border-radius:8px;padding:0 3px;box-shadow:0 1px 4px rgba(200,107,138,.3);}
.center{background:rgba(255,255,255,.95);border-radius:clamp(10px,2vw,18px);box-shadow:0 8px 22px rgba(200,107,138,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(4px,1vw,12px);grid-column:2/9;grid-row:2/5;z-index:3;overflow:hidden;min-height:0;}
.center h1{color:#c86b8a;font-size:clamp(13px,2.2vw,20px);text-shadow:1px 1px 0 #fff;margin-bottom:1px;}
.center .sub{color:#a88bb8;font-size:clamp(8px,1.2vw,11px);margin-bottom:clamp(3px,0.6vw,6px);}
.chips{display:flex;gap:clamp(4px,1vw,10px);margin-bottom:clamp(3px,0.6vw,6px);}
.chip{border-radius:10px;padding:clamp(3px,0.7vw,6px) clamp(6px,1.2vw,12px);font-size:clamp(12px,1.8vw,16px);font-weight:bold;display:flex;align-items:center;gap:clamp(3px,0.6vw,6px);}
.chip.you{background:#fff0f5;}
.chip.me{background:#eef2ff;}
.chip span{color:#a88bb8;font-size:clamp(11px,1.6vw,14px);}
.chip b{color:#e06a8b;}
.chip.me b{color:#6d8ad0;}
button{background:linear-gradient(135deg,#ff8fab,#ffb6c1);border:none;color:#fff;font-size:clamp(12px,1.9vw,16px);padding:clamp(5px,1.2vw,10px) clamp(15px,3.5vw,30px);border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 12px rgba(255,143,171,.4);margin-top:clamp(3px,0.6vw,6px);}
button:disabled{opacity:.4;cursor:not-allowed;}
#ops{margin-top:clamp(2px,0.5vw,4px);}
#ops button{margin:clamp(2px,0.4vw,4px);font-size:clamp(11px,1.7vw,15px);padding:clamp(4px,0.9vw,8px) clamp(12px,2.6vw,22px);}
.goal{color:#b48cd9;font-size:clamp(9px,1.4vw,12px);margin-top:clamp(3px,0.6vw,6px);}
/* 顶部浮动消息条：永远不被遮 */
#msg{position:fixed;top:clamp(6px,1.4vw,12px);left:50%;transform:translateX(-50%);z-index:99;background:rgba(255,255,255,.96);border:2px solid #ffb6c1;border-radius:24px;padding:clamp(5px,1vw,9px) clamp(14px,3vw,26px);font-size:clamp(11px,1.8vw,15px);color:#8a5a72;font-weight:bold;box-shadow:0 6px 18px rgba(200,107,138,.3);text-align:center;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
</style>
</head>
<body>
<div id="board">
  <div class="center">
    <h1>🎲 环游中国 · 大富翁</h1>
    <div class="sub">🐱桐桐 vs 🐶林霁</div>
    <div class="chips">
      <div class="chip you"><span>🐱 桐桐</span><b id="bYou">2000</b></div>
      <div class="chip me"><span>🐶 林霁</span><b id="bMe">2000</b></div>
    </div>
    <button id="btnRoll" onclick="roll()">🎲 掷骰子</button>
    <div id="ops"></div>
    <div class="goal">先攒到 ¥20000 或 对方破产 即获胜</div>
  </div>
</div>
<div id="msg">🎲 点掷骰子开始</div>
<script>
const map=[
 {e:"🏛️",n:"北京·起点/终点",p:0,r:0},{e:"🌆",n:"上海",p:4000,r:130},{e:"🃏",n:"机会",p:0,r:0},
 {e:"🌉",n:"杭州",p:2600,r:80},{e:"🌺",n:"广州",p:3600,r:115},{e:"🏙️",n:"深圳",p:3800,r:120},
 {e:"🐼",n:"成都",p:1800,r:60},{e:"💸",n:"差旅费",p:0,r:100},{e:"🌶️",n:"重庆",p:2400,r:75},
 {e:"🌸",n:"武汉",p:1600,r:55},{e:"🎁",n:"奇遇",p:0,r:0},{e:"🏯",n:"南京",p:2000,r:65},
 {e:"🏮",n:"西安",p:1500,r:50},{e:"🪷",n:"苏州",p:2200,r:70},{e:"🍊",n:"长沙",p:1400,r:45},
 {e:"😈",n:"被林霁抓住",p:0,r:0},{e:"🥟",n:"天津",p:1900,r:62},{e:"🍺",n:"青岛",p:1700,r:58},
 {e:"🍜",n:"郑州",p:1300,r:42},{e:"⏳",n:"时间胶囊",p:0,r:0},{e:"🌊",n:"厦门",p:1200,r:38},
 {e:"🌺",n:"昆明",p:1100,r:35},{e:"⛵",n:"大连",p:1000,r:32},{e:"❄️",n:"哈尔滨",p:900,r:28},
];
const EVENTS=[
 {t:"遇到好心人请喝奶茶，+80",m:80},{t:"考试超常发挥，+150",m:150},
 {t:"被林霁顺走零花钱，-60",m:-60},{t:"路上捡到一百块，+100",m:100},
 {t:"手机屏摔碎，赔 -90",m:-90},{t:"买彩票中奖，+180",m:180},
 {t:"忘带钥匙找开锁，-50",m:-50},{t:"被偶像回了一句，+120",m:120},
];
const JAIL_IDX=15,START_IDX=0,N=map.length,TARGET=20000;
const GRID={0:[1,1],1:[1,2],2:[1,3],3:[1,4],4:[1,5],5:[1,6],6:[1,7],7:[1,8],8:[1,9],
9:[2,9],10:[3,9],11:[4,9],12:[5,9],
13:[5,8],14:[5,7],15:[5,6],16:[5,5],17:[5,4],18:[5,3],19:[5,2],20:[5,1],
21:[4,1],22:[3,1],23:[2,1]};
const board=document.getElementById("board"),msgEl=document.getElementById("msg");
let pos={you:0,me:0},money={you:2000,me:2000},turn="you",jailed={you:false,me:false};
let actor="you",owner={},houses={},over=false;
function rentOf(cell){ return Math.round(cell.r*[1,2,3.5,5,7][houses[cell.n]||0]); }
function say(t){ msgEl.textContent=t; }
map.forEach((c,i)=>{
  const d=document.createElement("div");d.className="cell"+(i===0?" start":"")+(i===JAIL_IDX?" jail":"")+(c.n==="奇遇"?" event":"");d.id="c"+i;
  d.style.gridRow=GRID[i][0];d.style.gridColumn=GRID[i][1];
  d.innerHTML=`<div class="e">${c.e}</div><div class="n">${c.n}</div>`+(c.p>0?`<div class="p">¥${c.p}</div>`:"");
  board.appendChild(d);
});
function fit(){
  const ch=document.documentElement.clientHeight;
  board.style.height=Math.max(200,ch-4)+"px";
}
function getBtn(){ return document.getElementById("btnRoll"); }
function render(){
  map.forEach((c,i)=>{
    const d=document.getElementById("c"+i);
    d.classList.remove("owned-you","owned-me");
    if(c.p>0&&owner[c.n]==="you") d.classList.add("owned-you");
    if(c.p>0&&owner[c.n]==="me") d.classList.add("owned-me");
    if(i!==0) d.classList.toggle("here",pos.you===i||pos.me===i);
    let who=d.querySelector(".who");if(who)who.remove();
    let w="";
    if(pos.you===i) w+="🐱";
    if(pos.me===i) w+="🐶";
    if(w){const b=document.createElement("div");b.className="who";b.textContent=w;d.appendChild(b);}
  });
  document.getElementById("bYou").textContent=money.you;
  document.getElementById("bMe").textContent=money.me;
  getBtn().disabled=over;
}
function ops(html){ document.getElementById("ops").innerHTML=html||""; }
function roll(){
  if(over){ return; }
  const who=turn; actor=who;
  if(jailed[who]){
    jailed[who]=false; ops("");
    say(`🐱${who==="you"?"桐桐":"林霁"} 被抓住，停留一回合～`);
    turn=who==="you"?"me":"you"; render(); return;
  }
  const n=1+Math.floor(Math.random()*6),old=pos[who];
  pos[who]=(pos[who]+n)%N;
  const cell=map[pos[who]];
  let m=`🎲 ${who==="you"?"桐桐":"林霁"} 掷出 ${n} → 「${cell.n}」`;
  if(pos[who]<old&&pos[who]!==0){money[who]+=2000; m+=" · 过起点+2000";}
  if(pos[who]===START_IDX){money[who]+=2000; m+=" · 回起点+2000";}
  if(pos[who]===JAIL_IDX){
    jailed[who]=true; m+=" · 被抓住，下回停留"; ops("");
  }else if(cell.p>0){
    if(owner[cell.n]===undefined){
      const can=money[who]>=cell.p;
      ops(`<button ${can?"":"disabled"} onclick='buy("${cell.n}")'>🏙️ 购买 ¥${cell.p}</button>`);
      m+=can?" · 可购买":" · 钱不够";
    }else if(owner[cell.n]===who){
      ops(`<button onclick='build("${cell.n}")'>🏗️ 升级(房${houses[cell.n]||0})</button>`);
      m+=" · 你的城，可升级";
    }else{
      const op=owner[cell.n]==="you"?"me":"you";
      const r=rentOf(cell);
      money[who]-=r;money[op]+=r;
      m+=` · 是${op==="you"?"桐桐":"林霁"}的城，付租 ¥${r}`; ops("");
    }
  }else if(cell.n==="奇遇"||cell.n==="机会"){
    const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    money[who]+=e.m; m+=` · ${e.t}`; ops("");
  }
  else if(cell.n==="差旅费"){ money[who]-=100; m+=" · 差旅费-100"; ops(""); }
  else if(cell.n==="时间胶囊"){ money[who]-=60; (money[turn==="you"?"me":"you"])+=60; m+=" · 时光-60"; ops(""); }
  // 获胜判定
  if(money[who]>=TARGET){
    over=true; m=`🏆 ${who==="you"?"桐桐":"林霁"} 攒到¥${money[who]}，赢啦！`;
  }else if(money[who]<=0){
    money[who]=0; over=true;
    m=`💔 ${who==="you"?"桐桐":"林霁"} 破产，${(who==="you"?"林霁":"桐桐")} 获胜！`;
  }
  say(m);
  turn=who==="you"?"me":"you"; render();
}
function buy(city){
  const who=actor, cell=map.find(c=>c.n===city);
  if(money[who]<cell.p){ say("钱不够买～"); return; }
  money[who]-=cell.p; owner[city]=who; houses[city]=0; ops("");
  say(`${who==="you"?"桐桐":"林霁"} 买下「${city}」！`);
  if(money[who]>=TARGET){ over=true; say(`🏆 ${who==="you"?"桐桐":"林霁"} 攒到¥${money[who]}，赢啦！`); }
  render();
}
function build(city){
  const who=actor, cell=map.find(c=>c.n===city), h=houses[city]||0;
  if(h>=4){ say("已经 4 房满级啦～"); return; }
  const cost=Math.round(cell.p*0.5);
  if(money[who]<cost){ say(`升级要 ¥${cost}，钱不够`); return; }
  money[who]-=cost; houses[city]=h+1;
  say(`${who==="you"?"桐桐":"林霁"} 「${city}」盖到 ${h+1} 房，租¥${rentOf(cell)}`);
  render();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",()=>setTimeout(fit,250));
fit();render();
</script>
</body>
</html>
