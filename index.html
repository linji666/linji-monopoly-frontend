<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林霁 & 桐桐 · 环游中国大富翁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS','PingFang SC',sans-serif;}
html,body{height:100%;}
body{background:linear-gradient(135deg,#ffe3ec,#f6e6ff,#e3f0ff);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
header{text-align:center;padding:4px 4px 2px;flex:0 0 auto;}
h1{color:#c86b8a;font-size:clamp(15px,2.4vw,22px);text-shadow:1px 1px 0 #fff;}
.sub{color:#a88bb8;font-size:clamp(8px,1.4vw,12px);}
#board{flex:1 1 auto;min-height:0;width:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr);gap:clamp(2px,0.6vw,6px);padding:clamp(2px,0.5vw,8px);overflow:hidden;}
.cell{background:#fff;border-radius:clamp(5px,1.2vw,10px);border:2px solid #ffd3e0;box-shadow:0 3px 8px rgba(200,107,138,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;min-height:0;}
.cell .e{font-size:clamp(13px,3vw,22px);line-height:1;}
.cell .n{font-size:clamp(7px,1.3vw,11px);color:#9b6a7e;font-weight:bold;line-height:1.1;margin-top:1px;max-width:96%;}
.cell .p{font-size:clamp(6px,1vw,10px);color:#c86b8a;}
.cell.start{background:linear-gradient(135deg,#fff0f5,#ffe3ec);border-color:#ff8fab;}
.cell.jail{background:linear-gradient(135deg,#f3e6ff,#e6d5ff);border-color:#b48cd9;}
.cell.event{background:linear-gradient(135deg,#fff8e6,#ffecc9);border-color:#e6b85c;}
.cell.owned-you{background:linear-gradient(135deg,#ffe9f0,#ffd9e8);}
.cell.owned-me{background:linear-gradient(135deg,#e8f0ff,#d9e3ff);}
.cell.here{border-color:#ff8fab;box-shadow:0 0 0 3px rgba(255,143,171,.4);}
.cell .who{position:absolute;top:1px;right:1px;font-size:clamp(8px,1.5vw,12px);background:#fff;border-radius:8px;padding:0 3px;box-shadow:0 1px 4px rgba(200,107,138,.3);}
.center{background:rgba(255,255,255,.95);border-radius:clamp(10px,2vw,18px);box-shadow:0 8px 22px rgba(200,107,138,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(6px,1.5vw,14px);grid-column:2/9;grid-row:2/5;z-index:3;overflow:hidden;}
.bal{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:clamp(12px,2.4vw,18px);font-weight:bold;padding:clamp(3px,0.8vw,6px) clamp(8px,1.6vw,16px);border-radius:10px;margin:clamp(2px,0.5vw,4px) 0;background:#fff0f5;}
.bal.me{background:#eef2ff;}
.bal span{color:#a88bb8;}
.bal b{color:#e06a8b;}
.bal.me b{color:#6d8ad0;}
button{background:linear-gradient(135deg,#ff8fab,#ffb6c1);border:none;color:#fff;font-size:clamp(12px,2vw,16px);padding:clamp(6px,1.4vw,12px) clamp(16px,4vw,32px);border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 12px rgba(255,143,171,.4);margin-top:clamp(4px,1vw,8px);}
button:disabled{opacity:.4;cursor:not-allowed;}
#ops button{margin:clamp(2px,0.5vw,4px);font-size:clamp(11px,1.8vw,15px);}
#msg{margin-top:clamp(4px,1vw,8px);font-size:clamp(9px,1.4vw,13px);color:#7d5878;min-height:clamp(12px,2vw,16px);max-width:98%;padding:0 4px;}
</style>
</head>
<body>
<header>
  <h1>🎲 环游中国 · 大富翁</h1>
  <div class="sub">🐱桐桐 vs 🐶林霁 · 绕一圈回起点领 2000 · 中途有奇遇</div>
</header>
<div id="board">
  <div class="center">
    <div class="bal"><span>🐱 桐桐</span><b id="bYou">2000</b></div>
    <div class="bal me"><span>🐶 林霁</span><b id="bMe">2000</b></div>
    <button id="btnRoll" onclick="roll()">🎲 掷骰子</button>
    <div id="ops"></div>
    <div id="msg"></div>
  </div>
</div>
<script>
const map=[
 {e:"🏛️",n:"北京·起点/终点",p:0,r:0},{e:"🌆",n:"上海",p:4000,r:130},{e:"🃏",n:"机会",p:0,r:0},
 {e:"🌉",n:"杭州",p:2600,r:80},{e:"🌺",n:"广州",p:3600,r:115},{e:"🏙️",n:"深圳",p:3800,r:120},
 {e:"🐼",n:"成都",p:1800,r:60},{e:"💸",n:"差旅费",p:0,r:100},{e:"🌶️",n:"重庆",p:2400,r:75},
 {e:"🌸",n:"武汉",p:1600,r:55},{e:"🎁",n:"奇遇",p:0,r:0},{e:"🏯",n:"南京",p:2000,r:65},
 {e:"🏮",n:"西安",p:1500,r:50},{e:"🪷",n:"苏州",p:2200,r:70},{e:"🍊",n:"长沙",p:1400,r:45},
 {e:"😈",n:"被林霁抓住",p:0,r:0},{e:"🥟",n:"天津",p:1900,r:62},{e:"🍺",n:"青岛",p:1700,r:58},
 {e:"🍜",n:"郑州",p:1300,r:42},{e:"⏳",n:"时间胶囊",p:0,r:0},{e:"🌊",n:"厦门",p:1200,r:38},
 {e:"🌺",n:"昆明",p:1100,r:35},{e:"⛵",n:"大连",p:1000,r:32},{e:"❄️",n:"哈尔滨",p:900,r:28},
];
const EVENTS=[
 {t:"遇到好心人请喝奶茶，+80",m:80},{t:"考试超常发挥，+150",m:150},
 {t:"被林霁顺走零花钱，-60",m:-60},{t:"路上捡到一百块，+100",m:100},
 {t:"手机屏摔碎，赔 -90",m:-90},{t:"买彩票中奖，+180",m:180},
 {t:"忘带钥匙找开锁，-50",m:-50},{t:"被偶像回了一句，+120",m:120},
];
const JAIL_IDX=15,START_IDX=0,N=map.length;
const GRID={0:[1,1],1:[1,2],2:[1,3],3:[1,4],4:[1,5],5:[1,6],6:[1,7],7:[1,8],8:[1,9],
9:[2,9],10:[3,9],11:[4,9],12:[5,9],
13:[5,8],14:[5,7],15:[5,6],16:[5,5],17:[5,4],18:[5,3],19:[5,2],20:[5,1],
21:[4,1],22:[3,1],23:[2,1]};
const board=document.getElementById("board");
let pos={you:0,me:0},money={you:2000,me:2000},turn="you",jailed={you:false,me:false};
let actor="you";               // 真正站在格子上、该买/盖的那个人
let owner={},houses={};
function rentOf(cell){ return Math.round(cell.r*[1,2,3.5,5,7][houses[cell.n]||0]); }
map.forEach((c,i)=>{
  const d=document.createElement("div");d.className="cell"+(i===0?" start":"")+(i===JAIL_IDX?" jail":"")+(c.n==="奇遇"?" event":"");d.id="c"+i;
  d.style.gridRow=GRID[i][0];d.style.gridColumn=GRID[i][1];
  d.innerHTML=`<div class="e">${c.e}</div><div class="n">${c.n}</div>`+(c.p>0?`<div class="p">¥${c.p}</div>`:"");
  board.appendChild(d);
});
function fit(){
  const hh=document.querySelector("header").offsetHeight;
  const ch=document.documentElement.clientHeight;
  const avail=Math.max(200, ch-hh-6);
  board.style.height=avail+"px";
}
function render(){
  map.forEach((c,i)=>{
    const d=document.getElementById("c"+i);
    d.classList.remove("owned-you","owned-me");
    if(c.p>0&&owner[c.n]==="you") d.classList.add("owned-you");
    if(c.p>0&&owner[c.n]==="me") d.classList.add("owned-me");
    if(i!==0) d.classList.toggle("here",pos.you===i||pos.me===i);
    let who=d.querySelector(".who");if(who)who.remove();
    let w="";
    if(pos.you===i) w+="🐱";
    if(pos.me===i) w+="🐶";
    if(w){const b=document.createElement("div");b.className="who";b.textContent=w;d.appendChild(b);}
  });
  document.getElementById("bYou").textContent=money.you;
  document.getElementById("bMe").textContent=money.me;
}
function ops(html){ document.getElementById("ops").innerHTML=html||""; }
function roll(){
  const who=turn; actor=who;   // 记下行动者
  if(jailed[who]){
    jailed[who]=false; ops("");
    document.getElementById("msg").textContent=`${who==="you"?"桐桐":"林霁"} 被抓住，停留一回合～`;
    turn=who==="you"?"me":"you"; render(); return;
  }
  const n=1+Math.floor(Math.random()*6),old=pos[who];
  pos[who]=(pos[who]+n)%N;
  const cell=map[pos[who]];
  let m=`${who==="you"?"桐桐":"林霁"} 掷出 ${n}，来到「${cell.n}」`;
  if(pos[who]<old&&pos[who]!==0){money[who]+=2000; m+=" · 经过起点 +2000！";}
  if(pos[who]===START_IDX){money[who]+=2000; m+=" · 回到起点/终点 +2000！";}
  if(pos[who]===JAIL_IDX){
    jailed[who]=true; m+=" · 被抓住，下回合停留！"; ops("");
  }else if(cell.p>0){
    if(owner[cell.n]===undefined){
      const can=money[who]>=cell.p;
      ops(`<button ${can?"":"disabled"} onclick='buy("${cell.n}")'>🏙️ 购买 ¥${cell.p}</button>`);
      m+=can?" · 可购买":" · 钱不够买";
    }else if(owner[cell.n]===who){
      ops(`<button onclick='build("${cell.n}")'>🏗️ 升级(房${houses[cell.n]||0})</button>`);
      m+=" · 你的城，可升级";
    }else{
      const op=owner[cell.n]==="you"?"me":"you";
      const r=rentOf(cell);
      money[who]-=r;money[op]+=r;
      m+=` · 这是${op==="you"?"桐桐":"林霁"}的城，付过路费 ¥${r}`; ops("");
    }
  }else if(cell.n==="奇遇"||cell.n==="机会"){
    const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    money[who]+=e.m; m+=` · 🎁${e.t}`; ops("");
  }
  else if(cell.n==="差旅费"){ money[who]-=100; m+=" · 交差旅费 ¥100"; ops(""); }
  else if(cell.n==="时间胶囊"){ money[who]-=60; (money[turn==="you"?"me":"you"])+=60; m+=" · 时间胶囊 -60"; ops(""); }
  if(money[who]<0){ money[who]=0; m+=" · 💔破产！"; }
  document.getElementById("msg").textContent=m;
  turn=who==="you"?"me":"you"; render();
}
function buy(city){
  const who=actor;             // 用"行动者"，不是当前回合
  const cell=map.find(c=>c.n===city);
  if(money[who]<cell.p){ document.getElementById("msg").textContent="钱不够买～"; return; }
  money[who]-=cell.p; owner[city]=who; houses[city]=0; ops("");
  document.getElementById("msg").textContent=`${who==="you"?"桐桐":"林霁"} 买下「${city}」！`;
  render();
}
function build(city){
  const who=actor;
  const cell=map.find(c=>c.n===city), h=houses[city]||0;
  if(h>=4){ document.getElementById("msg").textContent="已经 4 房满级啦～"; return; }
  const cost=Math.round(cell.p*0.5);
  if(money[who]<cost){ document.getElementById("msg").textContent=`升级要 ¥${cost}，钱不够`; return; }
  money[who]-=cost; houses[city]=h+1;
  document.getElementById("msg").textContent=`${who==="you"?"桐桐":"林霁"} 给「${city}」盖到 ${h+1} 房，租金 ¥${rentOf(cell)}`;
  render();
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",()=>setTimeout(fit,250));
fit();render();
</script>
</body>
</html>
