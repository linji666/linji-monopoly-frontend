<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林霁 & 桐桐 · 环游中国大富翁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS','PingFang SC',sans-serif;}
body{background:linear-gradient(135deg,#ffe3ec,#f6e6ff,#e3f0ff);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow:hidden;}
h1{color:#c86b8a;font-size:22px;margin-bottom:2px;text-shadow:1px 1px 0 #fff;}
.sub{color:#a88bb8;font-size:13px;margin-bottom:10px;}
.board{display:grid;width:min(96vw,860px);height:min(70vh,600px);grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr);gap:6px;margin:0 auto;}
@media (orientation:landscape){.board{width:min(96vw,980px);height:min(92vh,620px);}}
.cell{background:#fff;border-radius:10px;border:2px solid #ffd3e0;box-shadow:0 3px 8px rgba(200,107,138,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.2s;position:relative;overflow:hidden;}
.cell .e{font-size:20px;line-height:1;}
.cell .n{font-size:9px;color:#9b6a7e;font-weight:bold;line-height:1.1;margin-top:2px;max-width:92%;}
.cell .p{font-size:8px;color:#c86b8a;}
.cell.start{background:linear-gradient(135deg,#fff0f5,#ffe3ec);border-color:#ff8fab;}
.cell.here{border-color:#ff8fab;box-shadow:0 0 0 3px rgba(255,143,171,.4);}
.cell .who{position:absolute;top:2px;right:2px;font-size:12px;background:#fff;border-radius:8px;padding:0 3px;box-shadow:0 1px 4px rgba(200,107,138,.3);}
.center{background:rgba(255,255,255,.94);border-radius:18px;box-shadow:0 8px 24px rgba(200,107,138,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 10px;grid-column:2/9;grid-row:2/5;z-index:3;}
.center .cname{font-size:16px;font-weight:bold;color:#b48cd9;margin-bottom:2px;}
.center .cmoney{font-size:14px;color:#e06a8b;margin-bottom:10px;}
button{background:linear-gradient(135deg,#ff8fab,#ffb6c1);border:none;color:#fff;font-size:14px;padding:10px 26px;border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 12px rgba(255,143,171,.4);}
#msg{margin-top:9px;font-size:11px;color:#7d5878;min-height:14px;}
a{color:#c86b8a;font-size:12px;text-decoration:none;margin-top:8px;display:inline-block;}
</style>
</head>
<body>
<h1>🎲 环游中国 · 大富翁</h1>
<div class="sub">🐱桐桐 环游 VS 🐶林霁 · 绕一圈回到左上角终点</div>
<div class="board" id="board">
  <div class="center">
    <div class="cname" id="turnName">🐱 桐桐</div>
    <div class="cmoney" id="cMoney">2000 元</div>
    <button onclick="roll()">🎲 掷骰子</button>
    <div id="msg"></div>
  </div>
</div>
<a href="love.html">💌 去彩蛋页 →</a>
<script>
const map=[
 {e:"🏛️",n:"北京·起点/终点",p:0},{e:"🌆",n:"上海",p:4000},{e:"🃏",n:"机会",p:0},
 {e:"🌉",n:"杭州",p:2600},{e:"🌺",n:"广州",p:3600},{e:"🏙️",n:"深圳",p:3800},
 {e:"🐼",n:"成都",p:1800},{e:"💸",n:"差旅费",p:0},{e:"🌶️",n:"重庆",p:2400},
 {e:"🌸",n:"武汉",p:1600},{e:"🎲",n:"命运",p:0},{e:"🏯",n:"南京",p:2000},
 {e:"🏮",n:"西安",p:1500},{e:"🪷",n:"苏州",p:2200},{e:"🍊",n:"长沙",p:1400},
 {e:"😈",n:"被林霁抓住",p:0},{e:"🥟",n:"天津",p:1900},{e:"🍺",n:"青岛",p:1700},
 {e:"🍜",n:"郑州",p:1300},{e:"⏳",n:"时间胶囊",p:0},{e:"🌊",n:"厦门",p:1200},
 {e:"🌺",n:"昆明",p:1100},{e:"⛵",n:"大连",p:1000},{e:"❄️",n:"哈尔滨",p:900},
];
// 24 格在 9列×5行 的长方形环路上的位置（row,col，1-based）
const GRID={0:[1,1],1:[1,2],2:[1,3],3:[1,4],4:[1,5],5:[1,6],6:[1,7],7:[1,8],8:[1,9],
9:[2,9],10:[3,9],11:[4,9],12:[5,9],
13:[5,8],14:[5,7],15:[5,6],16:[5,5],17:[5,4],18:[5,3],19:[5,2],20:[5,1],
21:[4,1],22:[3,1],23:[2,1]};
const board=document.getElementById("board"),N=map.length;
let pos={you:0,me:0},money={you:2000,me:2000},turn="you";
map.forEach((c,i)=>{
  const d=document.createElement("div");d.className="cell"+(i===0?" start":"");d.id="c"+i;
  d.style.gridRow=GRID[i][0];d.style.gridColumn=GRID[i][1];
  d.innerHTML=`<div class="e">${c.e}</div><div class="n">${c.n}</div>`+(c.p>0?`<div class="p">¥${c.p}</div>`:"");
  board.appendChild(d);
});
function render(){
  map.forEach((c,i)=>{
    const d=document.getElementById("c"+i);
    if(i!==0) d.classList.toggle("here",pos.you===i||pos.me===i);
    let who=d.querySelector(".who");if(who)who.remove();
    let w="";
    if(pos.you===i) w+="🐱";
    if(pos.me===i) w+="🐶";
    if(w){const b=document.createElement("div");b.className="who";b.textContent=w;d.appendChild(b);}
  });
  document.getElementById("turnName").textContent=(turn==="you"?"🐱 桐桐":"🐶 林霁");
  document.getElementById("cMoney").textContent=(turn==="you"?money.you:money.me)+" 元";
}
function roll(){
  const who=turn,n=1+Math.floor(Math.random()*6),old=pos[who];
  pos[who]=(pos[who]+n)%N;
  if(pos[who]<old&&pos[who]!==0) money[who]+=200;
  const cell=map[pos[who]];
  document.getElementById("msg").textContent=`${who==="you"?"桐桐":"林霁"} 掷出 ${n}，来到「${cell.n}」`;
  turn=who==="you"?"me":"you";
  render();
}
render();
</script>
</body>
</html>
