<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<title>四叶草许愿海</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070f;
 font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#ground{position:fixed;inset:0;z-index:0;background-color:#0d2517;
 background-image:url("https://opengameart.org/sites/default/files/tileable_grass.png");
 background-repeat:repeat;background-size:512px 512px;
 filter:brightness(.46) saturate(.92) contrast(1.05)}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:
  linear-gradient(to bottom, rgba(3,7,13,.97) 0%, rgba(4,10,16,.72) 22%, rgba(5,16,12,.28) 42%, rgba(0,0,0,0) 62%),
  radial-gradient(130% 80% at 50% 112%, rgba(0,0,0,.6), rgba(0,0,0,0) 62%)}
#cv{position:fixed;inset:0;display:block;touch-action:none;z-index:2}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));
 text-align:center;color:#c9e8c0;font-size:12px;letter-spacing:.16em;z-index:4;
 opacity:.68;pointer-events:none;transition:opacity 1s;text-shadow:0 2px 12px #000}
#music{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
 width:38px;height:38px;line-height:37px;text-align:center;border-radius:50%;
 color:#cfe6c6;font-size:15px;opacity:.42;background:rgba(255,255,255,.06);
 border:1px solid rgba(170,220,180,.18);z-index:5}
#close{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));
 width:40px;height:40px;line-height:38px;text-align:center;border-radius:50%;
 color:#d6ecdd;font-size:20px;opacity:0;pointer-events:none;transition:opacity .4s;
 background:rgba(255,255,255,.07);border:1px solid rgba(170,220,180,.2);z-index:6}
#close.on{opacity:.85;pointer-events:auto}
.mask{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
 background:rgba(3,8,6,.66);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.mask.on{display:flex}
.card{width:min(84vw,332px);padding:22px 20px 18px;border-radius:22px;
 background:linear-gradient(160deg,rgba(24,44,34,.97),rgba(9,18,15,.98));
 border:1px solid rgba(150,230,180,.22);
 box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 46px rgba(90,220,150,.14);
 animation:pop .34s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.ttl{text-align:center;color:#d5f0dc;font-size:13px;letter-spacing:.34em;opacity:.88;margin-bottom:16px}
#wish{display:block;width:10em;height:9.5em;margin:0 auto;background:transparent;border:0;outline:0;
 resize:none;color:#f3fff5;font-size:17px;line-height:1.9;text-align:center;
 white-space:pre-wrap;word-break:break-all;overflow:hidden;font-family:inherit}
#wish::placeholder{color:rgba(200,235,210,.26);letter-spacing:.12em;font-size:14px}
#view{width:10em;min-height:3.8em;margin:0 auto;color:#f0fff3;font-size:17px;line-height:1.9;
 white-space:pre-wrap;word-break:break-all;text-align:center}
#vsign{text-align:right;color:#a9d6b6;font-size:13px;margin-top:14px;letter-spacing:.06em}
.srow{display:flex;justify-content:flex-end;margin-top:8px}
#sign{width:8.5em;padding:8px 10px;text-align:right;font-size:13px;border-radius:10px;
 background:rgba(255,255,255,.06);border:1px solid rgba(160,230,190,.2);
 color:#e8fff0;outline:0;font-family:inherit}
.btns{display:flex;gap:10px;margin-top:16px}
button{flex:1;padding:11px 0;border:0;border-radius:12px;font-size:14px;letter-spacing:.12em;
 background:rgba(255,255,255,.07);color:#cfe6d6;font-family:inherit}
button.go{background:linear-gradient(120deg,#6fe0a8,#3fc4a0);color:#04170f;font-weight:700}
</style>
</head>
<body>
<div id="ground"></div>
<div id="veil"></div>
<canvas id="cv"></canvas>
<div id="hint">拖 动 移 视 角 · 双 指 缩 放 · 点 开 一 朵</div>
<div id="music">♫</div>
<div id="close">×</div>
<audio id="bgm" loop></audio>

<div class="mask" id="maskW"><div class="card">
  <div class="ttl">许 愿</div>
  <textarea id="wish" maxlength="50" placeholder="一行十个字以内……"></textarea>
  <div class="srow"><input id="sign" maxlength="12" placeholder="署名"></div>
  <div class="btns"><button id="c1">先不写</button><button class="go" id="ok">挂上去</button></div>
</div></div>

<div class="mask" id="maskV"><div class="card">
  <div class="ttl">已 有 人 许 过</div>
  <div id="view"></div>
  <div id="vsign"></div>
  <div class="btns"><button id="c2">合 上</button></div>
</div></div>

<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ground=document.getElementById('ground');
var hint=document.getElementById('hint'),closeBtn=document.getElementById('close');
var maskW=document.getElementById('maskW'),maskV=document.getElementById('maskV');
var wishEl=document.getElementById('wish'),signEl=document.getElementById('sign');
var viewEl=document.getElementById('view'),vsignEl=document.getElementById('vsign');

var W=0,H=0,DPR=1,TILE=512,CELL=52;
var camX=0,camY=0,scale=1.1,lastBX=null,lastBY=null,lastBS=null;
var stars=[],flies=[],curW=null,focus=null;
var tmap=new Map();

var wishes={};
try{wishes=JSON.parse(localStorage.getItem('clover_wishes')||'{}')}catch(e){wishes={}}
function saveW(){try{localStorage.setItem('clover_wishes',JSON.stringify(wishes))}catch(e){}}

function hash(a,b,n){var s=Math.sin(a*374761393+b*668265263+n*127.1)*43758.5453;return s-Math.floor(s);}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  stars.length=0;flies.length=0;
  var n=Math.min(220,Math.round(W*H*0.34/6200));
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.42,
    r:Math.random()*1.1+.25,a:Math.random(),s:(Math.random()*.012+.004)*(Math.random()<.5?-1:1)});
  for(var j=0;j<18;j++)flies.push({x:Math.random()*W,y:H*0.28+Math.random()*H*0.66,
    r:1.4+Math.random()*1.7,ang:Math.random()*6.283,sp:.1+Math.random()*.2,
    ph:Math.random()*6.283,vy:(Math.random()-.5)*.2});
}
function syncGround(){
  var bs=TILE*scale;
  var bx=(W/2-camX*scale)%bs, by=(H/2-camY*scale)%bs;
  if(bx!==lastBX||by!==lastBY||bs!==lastBS){
    ground.style.backgroundSize=bs.toFixed(1)+'px '+bs.toFixed(1)+'px';
    ground.style.backgroundPosition=bx.toFixed(1)+'px '+by.toFixed(1)+'px';
    lastBX=bx;lastBY=by;lastBS=bs;
  }
}
function proj(wx,wy){return {x:(wx-camX)*scale+W/2, y:(wy-camY)*scale+H/2};}
function tuftAt(ix,iy){
  var key=ix+','+iy, t=tmap.get(key);
  if(t)return t;
  var r1=hash(ix,iy,1),r2=hash(ix,iy,2),r3=hash(ix,iy,3),r4=hash(ix,iy,4),r5=hash(ix,iy,5);
  t={k:key,
    wx:ix*CELL+CELL*0.5+(r1-.5)*CELL*0.85,
    wy:iy*CELL+CELL*0.5+(r2-.5)*CELL*0.85,
    rot:r3*6.283, tone:r4, size:15+r5*7, ph:r3*6.283,
    fall:[0,0,0,0]};
  tmap.set(key,t);
  return t;
}
function leafShape(L){
  ctx.beginPath();
  ctx.moveTo(0,L*0.04);
  ctx.bezierCurveTo(-L*0.82,L*0.02,-L*0.96,-L*0.72,-L*0.30,-L*0.98);
  ctx.quadraticCurveTo(0,-L*0.56,L*0.30,-L*0.98);
  ctx.bezierCurveTo(L*0.96,-L*0.72,L*0.82,L*0.02,0,L*0.04);
  ctx.closePath();
}
function drawTuft(tf,time){
  var p=proj(tf.wx,tf.wy);
  var S=tf.size*scale;
  if(p.x<-S*3||p.x>W+S*3||p.y<-S*3||p.y>H+S*3)return;
  var deep=!!wishes[tf.k];
  if(S<3){
    ctx.fillStyle=deep?'rgba(140,230,190,.5)':'rgba(180,255,200,.55)';
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.8,S*0.7),0,6.2832);ctx.fill();
    return;
  }
  var R=S*0.72;
  var glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*2.6);
  if(deep){glow.addColorStop(0,'rgba(150,255,205,.30)');glow.addColorStop(1,'rgba(150,255,205,0)');}
  else{glow.addColorStop(0,'rgba(150,255,190,.22)');glow.addColorStop(1,'rgba(150,255,190,0)');}
  ctx.fillStyle=glow;
  ctx.beginPath();ctx.arc(p.x,p.y,R*2.6,0,6.2832);ctx.fill();
  var rot=tf.rot*0.35+Math.sin(time/2400+tf.ph)*0.022;
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.scale(1,0.94);
  ctx.rotate(rot);
  for(var i=0;i<4;i++){
    var f=tf.fall[i];
    if(f>=1)continue;
    var a=i*Math.PI/2;
    var drop=f*f;
    var d=R*0.62;
    var bx=Math.cos(a)*d+Math.cos(a+1.5)*drop*R*1.8;
    var by=Math.sin(a)*d+Math.sin(a+1.5)*drop*R*1.4+drop*R*1.6;
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(a+Math.PI/2+drop*2.6);
    ctx.globalAlpha=Math.max(0,1-Math.max(0,(f-0.7)/0.3));
    ctx.save();
    ctx.translate(R*0.05,R*0.08);
    ctx.fillStyle=deep?'rgba(6,26,18,.9)':'rgba(8,42,26,.85)';
    leafShape(R);ctx.fill();
    ctx.restore();
    var g=ctx.createLinearGradient(0,-R,0,0);
    if(deep){g.addColorStop(0,'#2a6a50');g.addColorStop(1,'#0e3626');}
    else{g.addColorStop(0,'#a8f5c6');g.addColorStop(.45,'#54c98b');g.addColorStop(1,'#1f7a52');}
    ctx.fillStyle=g;leafShape(R);ctx.fill();
    ctx.strokeStyle=deep?'rgba(130,210,175,.3)':'rgba(225,255,240,.5)';
    ctx.lineWidth=Math.max(.8,R*0.05);
    leafShape(R);ctx.stroke();
    if(R>7){
      ctx.strokeStyle=deep?'rgba(150,220,190,.18)':'rgba(235,255,245,.3)';
      ctx.lineWidth=Math.max(.7,R*0.04);
      ctx.beginPath();ctx.moveTo(0,-R*0.06);
      ctx.quadraticCurveTo(R*0.05,-R*0.45,0,-R*0.86);ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}
function loop(time){
  time=time||0;
  if(focus&&focus.t<1)focus.t=Math.min(1,focus.t+0.055);
  tmap.forEach(function(tf){
    for(var q=0;q<4;q++)if(tf.fall[q]>0&&tf.fall[q]<1)tf.fall[q]=Math.min(1,tf.fall[q]+0.022);
  });
  syncGround();
  ctx.clearRect(0,0,W,H);
  var i,ix,iy;
  var halfW=W*0.5/scale, halfH=H*0.5/scale;
  var ix0=Math.floor((camX-halfW)/CELL)-1, ix1=Math.ceil((camX+halfW)/CELL)+1;
  var iy0=Math.floor((camY-halfH)/CELL)-1, iy1=Math.ceil((camY+halfH)/CELL)+1;
  for(iy=iy0;iy<=iy1;iy++)for(ix=ix0;ix<=ix1;ix++)drawTuft(tuftAt(ix,iy),time);
  for(i=0;i<stars.length;i++){
    var s=stars[i];s.a+=s.s;
    if(s.a>1){s.a=1;s.s*=-1}if(s.a<0){s.a=0;s.s*=-1}
    var fade=1-(s.y/(H*0.46));
    if(fade<=0)continue;
    ctx.globalAlpha=(0.2+s.a*0.8)*fade*0.9;
    ctx.fillStyle='#eaf4ff';
    ctx.beginPath();ctx.arc(((s.x-camX*2)%W+W)%W,s.y,s.r,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(i=0;i<flies.length;i++){
    var f=flies[i];
    f.ang+=f.sp*0.045;f.x+=Math.cos(f.ang)*f.sp;f.y+=f.vy;
    if(f.y<H*0.24)f.y=H*0.96;if(f.y>H*0.97)f.y=H*0.25;
    if(f.x<-30)f.x=W+30;if(f.x>W+30)f.x=-30;
    var pulse=.3+Math.sin(time/700+f.ph)*.7;
    if(pulse<=0)continue;
    ctx.globalAlpha=pulse*.65;
    var fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*4);
    fg.addColorStop(0,'rgba(232,255,215,.95)');
    fg.addColorStop(.35,'rgba(170,250,200,.26)');
    fg.addColorStop(1,'rgba(170,250,200,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,f.r*4,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(focus){
    var e=1-Math.pow(1-focus.t,3);
    ctx.fillStyle='rgba(3,9,7,'+(0.6*e)+')';
    ctx.fillRect(0,0,W,H);
    var bigR=Math.min(W,H)*0.26;
    var X=focus.x0+(W/2-focus.x0)*e;
    var Y=focus.y0+(H*0.42-focus.y0)*e;
    var R=focus.R0+(bigR-focus.R0)*e;
    ctx.globalAlpha=e;
    drawBig(X,Y,R,focus.tf,time,!!wishes[focus.tf.k]);
    ctx.globalAlpha=1;
    closeBtn.classList.toggle('on',focus.t>=1);
  } else closeBtn.classList.remove('on');
  if(Math.random()<.008&&tmap.size>3000){
    var kill=[];
    tmap.forEach(function(tf,kk){
      var p=proj(tf.wx,tf.wy);
      if(p.x<-W||p.x>W*2||p.y<-H||p.y>H*2)kill.push(kk);
    });
    for(i=0;i<kill.length;i++)tmap.delete(kill[i]);
  }
  requestAnimationFrame(loop);
}
function drawBig(x,y,R,tf,time,deep){
  var L=R*0.94;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(1,0.93);
  ctx.rotate(Math.sin(time/2600)*0.022);
  var halo=ctx.createRadialGradient(0,0,0,0,0,R*3);
  halo.addColorStop(0,deep?'rgba(150,255,205,.22)':'rgba(170,255,200,.30)');
  halo.addColorStop(1,'rgba(170,255,200,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,R*3,0,6.2832);ctx.fill();
  ctx.strokeStyle=deep?'rgba(20,60,46,.95)':'rgba(30,98,62,.95)';
  ctx.lineWidth=Math.max(2,R*0.07);
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0,R*0.06);
  ctx.quadraticCurveTo(R*0.16,R*0.85,R*0.02,R*1.35);
  ctx.stroke();
  for(var i=0;i<4;i++){
    var f=tf.fall[i];
    if(f>=1)continue;
    var ang=tf.rot*0.10+i*Math.PI/2-Math.PI/2;
    var drop=f*f;
    var d=R*0.60;
    var bx=Math.cos(ang)*d+Math.cos(ang+1.5)*drop*R*1.7;
    var by=Math.sin(ang)*d*0.93+Math.sin(ang+1.5)*drop*R*1.3+drop*R*1.5;
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(ang+Math.PI/2+drop*2.6);
    ctx.globalAlpha=Math.max(0,1-Math.max(0,(f-0.72)/0.28));
    ctx.save();
    ctx.translate(L*0.055,L*0.085);
    ctx.fillStyle=deep?'rgba(8,30,22,.9)':'rgba(10,52,34,.85)';
    leafShape(L);ctx.fill();
    ctx.restore();
    var g=ctx.createLinearGradient(0,-L,0,0);
    if(deep){g.addColorStop(0,'#2d6f54');g.addColorStop(1,'#123c2c');}
    else{g.addColorStop(0,'#d8ffe8');g.addColorStop(.4,'#78e2ac');g.addColorStop(1,'#1f7a52');}
    ctx.fillStyle=g;leafShape(L);ctx.fill();
    ctx.strokeStyle=deep?'rgba(120,200,165,.35)':'rgba(235,255,245,.55)';
    ctx.lineWidth=Math.max(1,R*0.013);
    leafShape(L);ctx.stroke();
    ctx.strokeStyle=deep?'rgba(150,220,190,.2)':'rgba(240,255,250,.4)';
    ctx.lineWidth=Math.max(1,R*0.011);
    ctx.beginPath();ctx.moveTo(0,-L*0.04);
    ctx.quadraticCurveTo(L*0.05,-L*0.45,0,-L*0.86);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-L*0.36);ctx.lineTo(-L*0.34,-L*0.66);
    ctx.moveTo(0,-L*0.36);ctx.lineTo(L*0.34,-L*0.66);ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function openWish(c){
  curW=c;wishEl.value='';wishEl.placeholder='一行十个字以内……';
  signEl.value=localStorage.getItem('clover_sign')||'';
  maskW.classList.add('on');
}
function openView(c){
  viewEl.textContent=wishes[c.k].t;
  vsignEl.textContent='—— '+wishes[c.k].s;
  maskV.classList.add('on');
}
document.getElementById('ok').onclick=function(){
  var txt=(wishEl.value||'').trim(), sg=(signEl.value||'').trim()||'无名的人';
  if(!txt){wishEl.placeholder='写一个再挂上去';return;}
  wishes[curW.k]={t:txt,s:sg,d:Date.now()};
  saveW();try{localStorage.setItem('clover_sign',sg)}catch(e){}
  maskW.classList.remove('on');curW=null;focus=null;
};
document.getElementById('c1').onclick=function(){maskW.classList.remove('on');curW=null;};
document.getElementById('c2').onclick=function(){maskV.classList.remove('on');};
closeBtn.onclick=function(){focus=null;};

var pts=[],moved=0,lastDist=0;
cv.addEventListener('pointerdown',function(e){
  pts.push({id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(pts.length===1)moved=0;
  lastDist=0;
});
cv.addEventListener('pointermove',function(e){
  var p=null;
  for(var i=0;i<pts.length;i++)if(pts[i].id===e.pointerId)p=pts[i];
  if(!p)return;
  var dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(pts.length===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(!focus){camX-=dx/scale;camY-=dy/scale;}
  } else if(pts.length>=2){
    var a=pts[0],b=pts[1];
    var d=Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
    if(lastDist>0.5&&d>0.5){
      var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      var wx=(mx-W/2)/scale+camX, wy=(my-H/2)/scale+camY;
      scale=Math.max(0.7,Math.min(2.2,scale*(d/lastDist)));
      camX=wx-(mx-W/2)/scale; camY=wy-(my-H/2)/scale;
    }
    lastDist=d;
    moved+=99;
  }
});
function release(e){
  var keep=[],tapP=null;
  for(var i=0;i<pts.length;i++){if(pts[i].id===e.pointerId)tapP=pts[i];else keep.push(pts[i]);}
  pts=keep;
  if(pts.length===0){
    if(moved<9&&tapP)tap(tapP.sx,tapP.sy);
    moved=0;lastDist=0;
  }
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
function tap(px,py){
  if(focus){
    if(focus.t<1)return;
    var tf=focus.tf;
    if(wishes[tf.k]){openView(tf);return;}
    var idx=-1;
    for(var q=0;q<4;q++)if(tf.fall[q]===0){idx=q;break;}
    if(idx<0)return;
    hint.style.opacity=0;
    tf.fall[idx]=0.02;
    if(idx===3)setTimeout(function(){openWish(tf);},1000);
    return;
  }
  var wx=(px-W/2)/scale+camX, wy=(py-H/2)/scale+camY;
  var ix0=Math.floor(wx/CELL), iy0=Math.floor(wy/CELL);
  var best=null,bd=1e9,bp=null;
  for(var i=-1;i<=1;i++)for(var j=-1;j<=1;j++){
    var t=tuftAt(ix0+i,iy0+j);
    var p=proj(t.wx,t.wy);
    var d=Math.sqrt((p.x-px)*(p.x-px)+(p.y-py)*(p.y-py));
    if(d<bd){bd=d;best=t;bp=p;}
  }
  if(!best)return;
  var R=best.size*scale*0.72;
  if(bd>Math.max(12,R*1.6))return;
  hint.style.opacity=0;
  focus={tf:best,t:0,x0:bp.x,y0:bp.y,R0:Math.max(6,R)};
  if(wishes[best.k])setTimeout(function(){if(focus&&focus.tf===best)openView(best);},900);
}
var bgm=document.getElementById('bgm'),mbtn=document.getElementById('music');
var bgmOn=false;
mbtn.onclick=function(){
  if(!bgm.getAttribute('src'))bgm.setAttribute('src','bgm.mp3');
  if(bgmOn){bgm.pause();mbtn.style.opacity=.42;}
  else{bgm.volume=.45;bgm.play().catch(function(){});mbtn.style.opacity=1;}
  bgmOn=!bgmOn;
};
addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
</script>
