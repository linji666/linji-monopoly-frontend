<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<title>四叶草许愿海</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050f0a;
 font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block;touch-action:none;z-index:2}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));
 text-align:center;color:#c9e8c0;font-size:12px;letter-spacing:.16em;z-index:4;
 opacity:.68;pointer-events:none;transition:opacity 1s;text-shadow:0 2px 12px #000}
#music{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
 width:38px;height:38px;line-height:37px;text-align:center;border-radius:50%;
 color:#cfe6c6;font-size:15px;opacity:.42;background:rgba(255,255,255,.06);
 border:1px solid rgba(170,220,180,.18);z-index:5}
#close{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));
 width:40px;height:40px;line-height:38px;text-align:center;border-radius:50%;
 color:#d6ecdd;font-size:20px;opacity:0;pointer-events:none;transition:opacity .4s;
 background:rgba(255,255,255,.07);border:1px solid rgba(170,220,180,.2);z-index:6}
#close.on{opacity:.85;pointer-events:auto}
.mask{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
 background:rgba(3,8,6,.66);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.mask.on{display:flex}
.card{width:min(84vw,332px);padding:22px 20px 18px;border-radius:22px;
 background:linear-gradient(160deg,rgba(24,44,34,.97),rgba(9,18,15,.98));
 border:1px solid rgba(150,230,180,.22);
 box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 46px rgba(90,220,150,.14);
 animation:pop .34s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.ttl{text-align:center;color:#d5f0dc;font-size:13px;letter-spacing:.34em;opacity:.88;margin-bottom:16px}
#wish{display:block;width:10em;height:9.5em;margin:0 auto;background:transparent;border:0;outline:0;
 resize:none;color:#f3fff5;font-size:17px;line-height:1.9;text-align:center;
 white-space:pre-wrap;word-break:break-all;overflow:hidden;font-family:inherit}
#wish::placeholder{color:rgba(200,235,210,.26);letter-spacing:.12em;font-size:14px}
#view{width:10em;min-height:3.8em;margin:0 auto;color:#f0fff3;font-size:17px;line-height:1.9;
 white-space:pre-wrap;word-break:break-all;text-align:center}
#vsign{text-align:right;color:#a9d6b6;font-size:13px;margin-top:14px;letter-spacing:.06em}
.srow{display:flex;justify-content:flex-end;margin-top:8px}
#sign{width:8.5em;padding:8px 10px;text-align:right;font-size:13px;border-radius:10px;
 background:rgba(255,255,255,.06);border:1px solid rgba(160,230,190,.2);
 color:#e8fff0;outline:0;font-family:inherit}
.btns{display:flex;gap:10px;margin-top:16px}
button{flex:1;padding:11px 0;border:0;border-radius:12px;font-size:14px;letter-spacing:.12em;
 background:rgba(255,255,255,.07);color:#cfe6d6;font-family:inherit}
button.go{background:linear-gradient(120deg,#6fe0a8,#3fc4a0);color:#04170f;font-weight:700}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">拖 动 移 视 角 · 双 指 缩 放 · 点 开 一 朵</div>
<div id="music">♫</div>
<div id="close">×</div>
<audio id="bgm" loop></audio>

<div class="mask" id="maskW"><div class="card">
  <div class="ttl">许 愿</div>
  <textarea id="wish" maxlength="50" placeholder="一行十个字以内……"></textarea>
  <div class="srow"><input id="sign" maxlength="12" placeholder="署名"></div>
  <div class="btns"><button id="c1">先不写</button><button class="go" id="ok">挂上去</button></div>
</div></div>

<div class="mask" id="maskV"><div class="card">
  <div class="ttl">已 有 人 许 过</div>
  <div id="view"></div>
  <div id="vsign"></div>
  <div class="btns"><button id="c2">合 上</button></div>
</div></div>

<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var hint=document.getElementById('hint'),closeBtn=document.getElementById('close');
var maskW=document.getElementById('maskW'),maskV=document.getElementById('maskV');
var wishEl=document.getElementById('wish'),signEl=document.getElementById('sign');
var viewEl=document.getElementById('view'),vsignEl=document.getElementById('vsign');

var W=0,H=0,DPR=1,HOR=0,SLOPE=0.12;
var CELL=28,DNEAR=58,DEPTH=540,KMAX=1.55;
var F=0,CAMH=0,zoom=1;
var camX=0,camZ=200,panY=0,tgX=0,tgPanY=0;
var stars=[],flies=[],hit=[],curW=null,focus=null;
var tmap=new Map();

var SPRITE_URL='https://i.postimg.cc/mBQxP3pW/1789800299981.png';
var sprite=null,SPW=1,SPH=1,alphaOk=false;
function prepImg(img){
  try{
    var tw=300, th=Math.round(300*img.height/img.width);
    var c=document.createElement('canvas');c.width=tw;c.height=th;
    var g=c.getContext('2d');
    g.drawImage(img,0,0,tw,th);
    var cropped=false;
    try{
      var d=g.getImageData(0,0,tw,th),p=d.data;
      for(var i=0;i<p.length;i+=4){
        var lum=p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114;
        var a=(220-lum)/82; if(a<0)a=0; if(a>1)a=1;
        p[i+3]=Math.round(a*p[i+3]);
      }
      g.putImageData(d,0,0);
      alphaOk=true;
      var minX=tw,minY=th,maxX=-1,maxY=-1;
      for(var y=0;y<th;y++){
        for(var x=0;x<tw;x++){
          if(p[(y*tw+x)*4+3]>20){
            if(x<minX)minX=x; if(x>maxX)maxX=x;
            if(y<minY)minY=y; if(y>maxY)maxY=y;
          }
        }
      }
      if(maxX>minX&&maxY>minY){
        var pad=3;
        minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
        maxX=Math.min(tw-1,maxX+pad); maxY=Math.min(th-1,maxY+pad);
        var cw=maxX-minX+1, ch=maxY-minY+1;
        var kk2=320/Math.max(cw,ch);
        var nw=Math.max(1,Math.round(cw*kk2)), nh=Math.max(1,Math.round(ch*kk2));
        var c2=document.createElement('canvas');c2.width=nw;c2.height=nh;
        c2.getContext('2d').drawImage(c,minX,minY,cw,ch,0,0,nw,nh);
        sprite=c2;SPW=nw;SPH=nh;cropped=true;
      }
    }catch(e){alphaOk=false;}
    if(!cropped){sprite=c;SPW=tw;SPH=th;}
  }catch(e){sprite=null;}
}
(function(){
  function load(useCors){
    var img=new Image();
    if(useCors)img.crossOrigin='anonymous';
    img.onload=function(){prepImg(img);};
    img.onerror=function(){if(useCors)load(false);};
    img.src=SPRITE_URL;
  }
  load(true);
})();

var wishes={};
try{wishes=JSON.parse(localStorage.getItem('clover_wishes')||'{}')}catch(e){wishes={}}
function saveW(){try{localStorage.setItem('clover_wishes',JSON.stringify(wishes))}catch(e){}}
function hash(a,b,n){var s=Math.sin(a*374761393+b*668265263+n*127.1)*43758.5453;return s-Math.floor(s);}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  HOR=Math.round(H*0.44);
  F=KMAX*DNEAR; CAMH=(H-HOR)/KMAX;
  stars.length=0;flies.length=0;
  var n=Math.min(260,Math.round(W*H*0.44/5400));
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.55,
    r:Math.random()*1.15+.25,a:Math.random(),s:(Math.random()*.012+.004)*(Math.random()<.5?-1:1)});
  for(var j=0;j<20;j++)flies.push({x:Math.random()*W,y:HOR*0.6+Math.random()*H*0.5,
    r:1.3+Math.random()*1.7,ang:Math.random()*6.283,sp:.1+Math.random()*.2,
    ph:Math.random()*6.283,vy:(Math.random()-.5)*.2});
}
function proj(wx,wz){
  var dz=wz-camZ;
  if(dz<DNEAR*0.55)return null;
  var k=(F*zoom)/dz;
  var x=W/2+(wx-camX)*k;
  var y=HOR+x*SLOPE+CAMH*k+panY;
  if(y>H+340)return null;
  return {x:x, y:y, k:k};
}
function tuftAt(ix,iz){
  var key=ix+','+iz, t=tmap.get(key);
  if(t)return t;
  var r1=hash(ix,iz,1),r2=hash(ix,iz,2),r3=hash(ix,iz,3),r4=hash(ix,iz,4),r5=hash(ix,iz,5),r6=hash(ix,iz,6);
  t={k:key,
    wx:ix*CELL+CELL*0.5+(r1-.5)*CELL*1.0,
    wz:iz*CELL+CELL*0.5+(r2-.5)*CELL*1.0,
    sz:CELL*(1.06+r5*0.6),
    rot:(r3-.5)*1.0,
    flip:r6>0.5,
    tilt:(r4-.5)*0.24,
    at:0.72+r4*0.28,
    ph:r3*6.283,
    fall:[0,0,0,0]};
  tmap.set(key,t);
  return t;
}
function drawSprite(tf,time){
  var p=proj(tf.wx,tf.wz);
  if(!p)return;
  var w=tf.sz*p.k, h=w*(SPH/SPW);
  if(w<1.0)return;
  if(p.x<-w||p.x>W+w||p.y<-h*1.4||p.y>H+h*0.3)return;
  var deep=!!wishes[tf.k];
  var cy=p.y-h*0.5;
  if(w<6||!sprite){
    ctx.globalAlpha=deep?0.5:0.85;
    ctx.fillStyle=deep?'rgba(140,230,190,.75)':'rgba(198,252,214,.8)';
    ctx.beginPath();ctx.arc(p.x,cy,Math.max(1.0,w*0.34),0,6.2832);ctx.fill();
    ctx.globalAlpha=1;
    hit.push({x:p.x,y:cy,r:Math.max(9,w*1.1),t:tf});
    return;
  }
  var sway=Math.sin(time/2200+tf.ph)*(deep?0.005:0.014);
  if(deep||w>26){
    var gl=ctx.createRadialGradient(p.x,cy,0,p.x,cy,w*0.9);
    if(deep){gl.addColorStop(0,'rgba(150,255,205,.44)');gl.addColorStop(1,'rgba(150,255,205,0)');}
    else{gl.addColorStop(0,'rgba(185,255,220,.10)');gl.addColorStop(1,'rgba(185,255,220,0)');}
    ctx.fillStyle=gl;
    ctx.beginPath();ctx.arc(p.x,cy,w*0.9,0,6.2832);ctx.fill();
  }
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(tf.rot+sway);
  ctx.scale(tf.flip?-1:1,1);
  ctx.transform(1,0,tf.tilt,1,0,0);
  ctx.globalCompositeOperation=alphaOk?'source-over':'multiply';
  ctx.globalAlpha=deep?0.62:tf.at;
  try{ctx.drawImage(sprite,-w*0.5,-h,w,h);}catch(e){}
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  hit.push({x:p.x,y:cy,r:Math.max(12,w*0.85),t:tf});
}
function leafShape(L){
  ctx.beginPath();
  ctx.moveTo(0,L*0.04);
  ctx.bezierCurveTo(-L*0.82,L*0.02,-L*0.96,-L*0.72,-L*0.30,-L*0.98);
  ctx.quadraticCurveTo(0,-L*0.56,L*0.30,-L*0.98);
  ctx.bezierCurveTo(L*0.96,-L*0.72,L*0.82,L*0.02,0,L*0.04);
  ctx.closePath();
}
function drawBig(x,y,R,tf,time,deep){
  var L=R*0.94;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(1,0.93);
  ctx.rotate(Math.sin(time/2600)*0.022);
  var halo=ctx.createRadialGradient(0,0,0,0,0,R*3);
  halo.addColorStop(0,deep?'rgba(150,255,205,.24)':'rgba(180,255,210,.34)');
  halo.addColorStop(1,'rgba(180,255,210,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,R*3,0,6.2832);ctx.fill();
  ctx.strokeStyle=deep?'rgba(20,60,46,.95)':'rgba(30,98,62,.95)';
  ctx.lineWidth=Math.max(2,R*0.07);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,R*0.06);
  ctx.quadraticCurveTo(R*0.16,R*0.85,R*0.02,R*1.35);ctx.stroke();
  for(var i=0;i<4;i++){
    var f=tf.fall[i];
    if(f>=1)continue;
    var ang=tf.rot*0.25+i*Math.PI/2-Math.PI/2;
    var drop=f*f,d=R*0.60;
    var bx=Math.cos(ang)*d+Math.cos(ang+1.5)*drop*R*1.7;
    var by=Math.sin(ang)*d*0.93+Math.sin(ang+1.5)*drop*R*1.3+drop*R*1.5;
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(ang+Math.PI/2+drop*2.6);
    ctx.globalAlpha=Math.max(0,1-Math.max(0,(f-0.72)/0.28));
    ctx.save();
    ctx.translate(L*0.055,L*0.085);
    ctx.fillStyle=deep?'rgba(8,30,22,.9)':'rgba(10,52,34,.85)';
    leafShape(L);ctx.fill();
    ctx.restore();
    var g=ctx.createLinearGradient(0,-L,0,0);
    if(deep){g.addColorStop(0,'#2d6f54');g.addColorStop(1,'#123c2c');}
    else{g.addColorStop(0,'#e6fff0');g.addColorStop(.4,'#86eaba');g.addColorStop(1,'#1f7a52');}
    ctx.fillStyle=g;leafShape(L);ctx.fill();
    ctx.strokeStyle=deep?'rgba(120,200,165,.35)':'rgba(245,255,250,.6)';
    ctx.lineWidth=Math.max(1,R*0.013);
    leafShape(L);ctx.stroke();
    ctx.strokeStyle=deep?'rgba(150,220,190,.2)':'rgba(248,255,253,.42)';
    ctx.lineWidth=Math.max(1,R*0.011);
    ctx.beginPath();ctx.moveTo(0,-L*0.04);
    ctx.quadraticCurveTo(L*0.05,-L*0.45,0,-L*0.86);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-L*0.36);ctx.lineTo(-L*0.34,-L*0.66);
    ctx.moveTo(0,-L*0.36);ctx.lineTo(L*0.34,-L*0.66);ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function frame(time){
  time=time||0;
  try{
    camX+=(tgX-camX)*0.13; panY+=(tgPanY-panY)*0.13;
    if(focus&&focus.t<1)focus.t=Math.min(1,focus.t+0.055);
    tmap.forEach(function(tf){
      for(var q=0;q<4;q++)if(tf.fall[q]>0&&tf.fall[q]<1)tf.fall[q]=Math.min(1,tf.fall[q]+0.022);
    });
    var sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#03060c');
    sky.addColorStop(.34,'#071422');
    sky.addColorStop(.6,'#0a1c26');
    sky.addColorStop(1,'#0b2318');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];s.a+=s.s;
      if(s.a>1){s.a=1;s.s*=-1}if(s.a<0){s.a=0;s.s*=-1}
      ctx.globalAlpha=.22+s.a*.78;
      ctx.fillStyle='#eaf4ff';
      ctx.beginPath();ctx.arc(((s.x-camX*0.25)%W+W)%W,s.y,s.r,0,6.2832);ctx.fill();
    }
    ctx.globalAlpha=1;
    hit.length=0;
    var ix,iz;
    var izFar=Math.floor((camZ+DEPTH)/CELL), izNear=Math.ceil((camZ+DNEAR*0.45)/CELL);
    for(iz=izFar;iz>=izNear;iz--){
      var dzm=iz*CELL+CELL*0.5-camZ;
      if(dzm<DNEAR*0.45)continue;
      var km=(F*zoom)/dzm, half=(W*0.5)/km+CELL*3;
      var ix0=Math.floor((camX-half)/CELL), ix1=Math.ceil((camX+half)/CELL);
      for(ix=ix0;ix<=ix1;ix++)drawSprite(tuftAt(ix,iz),time);
    }
    for(i=0;i<flies.length;i++){
      var f=flies[i];
      f.ang+=f.sp*0.045;f.x+=Math.cos(f.ang)*f.sp;f.y+=f.vy;
      if(f.y<HOR*0.35)f.y=H*0.92;if(f.y>H*0.94)f.y=HOR*0.38;
      if(f.x<-30)f.x=W+30;if(f.x>W+30)f.x=-30;
      var pulse=.3+Math.sin(time/700+f.ph)*.7;
      if(pulse<=0)continue;
      ctx.globalAlpha=pulse*.6;
      var fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*4);
      fg.addColorStop(0,'rgba(232,255,215,.95)');
      fg.addColorStop(.35,'rgba(170,250,200,.24)');
      fg.addColorStop(1,'rgba(170,250,200,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,f.r*4,0,6.2832);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(focus){
      var e=1-Math.pow(1-focus.t,3);
      ctx.fillStyle='rgba(3,9,7,'+(0.68*e)+')';
      ctx.fillRect(0,0,W,H);
      var bigR=Math.min(W,H)*0.28;
      var X=focus.x0+(W/2-focus.x0)*e;
      var Y=focus.y0+(H*0.42-focus.y0)*e;
      var R=focus.R0+(bigR-focus.R0)*e;
      ctx.globalAlpha=e;
      drawBig(X,Y,R,focus.tf,time,!!wishes[focus.tf.k]);
      ctx.globalAlpha=1;
      closeBtn.classList.toggle('on',focus.t>=1);
    } else closeBtn.classList.remove('on');
    if(Math.random()<.01&&tmap.size>6000){
      var kill=[];
      tmap.forEach(function(tf,kk){
        var dz=tf.wz-camZ;
        if(dz<0||dz>DEPTH*1.8)kill.push(kk);
      });
      for(i=0;i<kill.length;i++)tmap.delete(kill[i]);
    }
  }catch(e){}
  requestAnimationFrame(frame);
}
function openWish(c){
  curW=c;wishEl.value='';wishEl.placeholder='一行十个字以内……';
  signEl.value=localStorage.getItem('clover_sign')||'';
  maskW.classList.add('on');
}
function openView(c){
  viewEl.textContent=wishes[c.k].t;
  vsignEl.textContent='—— '+wishes[c.k].s;
  maskV.classList.add('on');
}
document.getElementById('ok').onclick=function(){
  var txt=(wishEl.value||'').trim(), sg=(signEl.value||'').trim()||'无名的人';
  if(!txt){wishEl.placeholder='写一个再挂上去';return;}
  wishes[curW.k]={t:txt,s:sg,d:Date.now()};
  saveW();try{localStorage.setItem('clover_sign',sg)}catch(e){}
  maskW.classList.remove('on');curW=null;focus=null;
};
document.getElementById('c1').onclick=function(){maskW.classList.remove('on');curW=null;};
document.getElementById('c2').onclick=function(){maskV.classList.remove('on');};
closeBtn.onclick=function(){focus=null;};

var pts=[],moved=0,lastDist=0;
cv.addEventListener('pointerdown',function(e){
  pts.push({id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(pts.length===1)moved=0;
  lastDist=0;
});
cv.addEventListener('pointermove',function(e){
  var p=null;
  for(var i=0;i<pts.length;i++)if(pts[i].id===e.pointerId)p=pts[i];
  if(!p)return;
  var dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(pts.length===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(!focus){
      var kref=(F*zoom)/260;
      tgX-=dx/kref;
      tgPanY-=dy*0.85;
      var lim=H*0.34;
      if(tgPanY<-lim)tgPanY=-lim;
      if(tgPanY>lim)tgPanY=lim;
    }
  } else if(pts.length>=2){
    var a=pts[0],b=pts[1];
    var d=Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
    if(lastDist>0.5&&d>0.5){
      zoom=Math.max(0.62,Math.min(2.4,zoom*(d/lastDist)));
    }
    lastDist=d;moved+=99;
  }
});
function release(e){
  var keep=[],tapP=null;
  for(var i=0;i<pts.length;i++){if(pts[i].id===e.pointerId)tapP=pts[i];else keep.push(pts[i]);}
  pts=keep;
  if(pts.length===0){
    if(moved<9&&tapP)tap(tapP.sx,tapP.sy);
    moved=0;lastDist=0;
  }
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
function tap(px,py){
  if(focus){
    if(focus.t<1)return;
    var tf=focus.tf;
    if(wishes[tf.k]){openView(tf);return;}
    var idx=-1;
    for(var q=0;q<4;q++)if(tf.fall[q]===0){idx=q;break;}
    if(idx<0)return;
    hint.style.opacity=0;
    tf.fall[idx]=0.02;
    if(idx===3)setTimeout(function(){openWish(tf);},1000);
    return;
  }
  var best=null,bd=1e9;
  for(var i=hit.length-1;i>=0;i--){
    var h=hit[i];
    var d=Math.sqrt((h.x-px)*(h.x-px)+(h.y-py)*(h.y-py));
    if(d<h.r&&d<bd){bd=d;best=h;}
  }
  if(!best)return;
  hint.style.opacity=0;
  focus={tf:best.t,t:0,x0:best.x,y0:best.y,R0:Math.max(8,best.r*0.9)};
  if(wishes[best.t.k])setTimeout(function(){if(focus&&focus.tf===best.t)openView(best.t);},900);
}
var bgm=document.getElementById('bgm'),mbtn=document.getElementById('music');
var bgmOn=false;
mbtn.onclick=function(){
  if(!bgm.getAttribute('src'))bgm.setAttribute('src','bgm.mp3');
  if(bgmOn){bgm.pause();mbtn.style.opacity=.42;}
  else{bgm.volume=.45;bgm.play().catch(function(){});mbtn.style.opacity=1;}
  bgmOn=!bgmOn;
};
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
</script>
