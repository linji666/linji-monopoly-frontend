<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="心事">
<title>我们 · 心事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ── 全站统一色卡：粉紫一家 ──
   粉 #ff9ecd  紫 #a98cff
   朋友圈＝白底（白天）  心事/银河＝紫黑底（夜里）
   同一个色，只换明度 */
:root{
  --pink:#ff9ecd;
  --pink-d:#f77bb8;
  --violet:#a98cff;
  --violet-d:#8f6ff0;

  --bg:#100c1a;                 /* 紫黑 */
  --bg2:#161029;
  --paper:#1c1533;              /* 信纸 */
  --paper-hold:#151027;
  --line:rgba(220,190,255,.10);
  --txt:#eee8fa;
  --txt2:#a396c9;
  --txt3:#6b5d91;
  --mint:#9fd8ff;               /* 他那边用淡蓝紫，不再用绿，收进同一族 */
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(120% 70% at 14% 0%,rgba(169,140,255,.22),transparent 62%),
    radial-gradient(110% 60% at 92% 12%,rgba(255,158,205,.15),transparent 64%),
    radial-gradient(140% 80% at 50% 108%,rgba(140,110,240,.18),transparent 66%);
  background-attachment:fixed;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
#app{position:relative;min-height:100%;padding-bottom:calc(78px + env(safe-area-inset-bottom))}

.head{
  padding:calc(30px + env(safe-area-inset-top)) 24px 6px;
  text-align:center;
}
.head .t{
  font-size:17px;font-weight:600;letter-spacing:7px;color:#ddd2f5;text-indent:7px;
}
.head .s{margin-top:9px;font-size:11.5px;letter-spacing:1.5px;color:var(--txt3)}

.list{padding:22px 18px 20px}

.card{
  position:relative;border-radius:18px;padding:20px 19px 16px;
  margin-bottom:14px;overflow:hidden;
  background:linear-gradient(160deg,#1e1736,#161029);
  border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(10,4,26,.5);
  cursor:pointer;transition:transform .16s ease;
}
.card:active{transform:scale(.988)}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(
    to bottom,transparent 0,transparent 27px,rgba(255,255,255,.028) 27px,rgba(255,255,255,.028) 28px);
}
.card::after{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(to right,transparent,rgba(220,190,255,.18),transparent);
}
.card.hold{
  background:linear-gradient(160deg,#171129,#120d21);
  border-style:dashed;border-color:rgba(220,190,255,.13);
}
.card.hold .body{color:#ab9ecb}

.c-top{display:flex;align-items:center;gap:9px;margin-bottom:13px;position:relative;z-index:2}
.c-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--txt3)}
.card.mine .c-dot{background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 0 10px rgba(255,158,205,.5)}
.card.his  .c-dot{background:linear-gradient(135deg,#b9a6ff,var(--mint));box-shadow:0 0 10px rgba(159,216,255,.4)}
.c-who{font-size:12.5px;letter-spacing:.6px;color:var(--txt2)}
.c-who b{color:#d4c9f0;font-weight:600}
.c-state{margin-left:auto;font-size:11px;letter-spacing:.8px;color:var(--txt3)}
.c-state.seen{color:var(--mint)}

.body{
  font-size:15.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;
  color:#e8e2f8;position:relative;z-index:2;
}

.reply{
  margin-top:15px;padding:13px 15px;border-radius:13px;position:relative;z-index:2;
  background:rgba(169,140,255,.09);
  border-left:2px solid rgba(255,158,205,.55);
}
.reply .rh{font-size:11px;letter-spacing:.8px;color:#c9b4f0;margin-bottom:7px}
.reply .rb{font-size:14.5px;line-height:1.85;color:#e2dcf5;white-space:pre-wrap;word-break:break-word}

.c-foot{display:flex;align-items:center;gap:14px;margin-top:15px;position:relative;z-index:2}
.c-time{font-size:11px;color:var(--txt3);letter-spacing:.5px}
.c-act{
  margin-left:auto;font-size:12px;color:#c0aaf0;letter-spacing:.5px;
  padding:5px 13px;border-radius:99px;background:rgba(169,140,255,.12);cursor:pointer;
}
.c-act:active{background:rgba(169,140,255,.22)}

.fab{
  position:fixed;right:20px;z-index:45;
  bottom:calc(94px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;border:none;
  background:linear-gradient(140deg,var(--pink),var(--violet));
  box-shadow:0 14px 34px rgba(169,140,255,.5);
  color:#160f2a;font-size:27px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .14s;
}
.fab:active{transform:scale(.92)}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(66px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(16,12,26,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#544873;font-size:10.5px;letter-spacing:1.2px;font-family:inherit;
  transition:color .18s;
}
.tabbar button.on{color:#cfbcf8}
.tabbar svg{width:22px;height:22px}

.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(6,3,14,.74);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:linear-gradient(170deg,#211838,#161029);
  border-radius:26px 26px 0 0;border-top:1px solid rgba(220,190,255,.12);
  padding:24px 22px calc(30px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  max-height:90vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:15px;font-weight:600;margin-bottom:6px;letter-spacing:1.5px;color:#ddd2f5}
.sheet .hint{font-size:11.5px;color:var(--txt3);line-height:1.7;margin-bottom:18px}

.ta{
  width:100%;min-height:190px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);border-radius:18px;padding:17px;
  color:#eee8fa;font-size:15.5px;line-height:2;font-family:inherit;
  resize:none;outline:none;
  background-image:repeating-linear-gradient(
    to bottom,transparent 0,transparent 29px,rgba(255,255,255,.026) 29px,rgba(255,255,255,.026) 30px);
}
.ta::placeholder{color:#57496f}

.rowbtns{display:flex;gap:11px;margin-top:20px}
.rowbtns button{
  flex:1;padding:15px 0;border-radius:18px;border:none;
  font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;
}
.rowbtns .no{background:rgba(169,140,255,.13);color:#c0b0e8}
.rowbtns .ok{
  background:linear-gradient(135deg,var(--pink),var(--violet));color:#160f2a;
  box-shadow:0 12px 28px rgba(169,140,255,.44);
}

.one{padding:2px 0 4px}
.one .meta{font-size:11.5px;color:var(--txt3);letter-spacing:.6px;margin-bottom:16px}
.one .txt{font-size:16px;line-height:2.05;white-space:pre-wrap;word-break:break-word;color:#eee8fa}
.one .rep{margin-top:20px}

.readline{
  margin-top:20px;padding:12px 15px;border-radius:12px;
  background:rgba(159,216,255,.08);border:1px solid rgba(159,216,255,.2);
  font-size:12px;color:#a8d6f5;letter-spacing:.6px;text-align:center;
}

.empty{
  text-align:center;color:var(--txt3);font-size:13.5px;
  padding:100px 34px;line-height:2.2;letter-spacing:.5px;
}

.toast{
  position:fixed;left:50%;bottom:calc(148px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px);
  background:rgba(46,32,76,.96);color:#f2ecff;
  font-size:12.5px;letter-spacing:.6px;
  padding:10px 19px;border-radius:99px;border:1px solid rgba(220,190,255,.16);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;
  z-index:70;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="t">心事</div>
    <div class="s" id="sub">只给他看</div>
  </div>
  <div class="list" id="list"></div>
</div>

<button class="fab" onclick="openWrite()">＋</button>

<nav class="tabbar">
  <button onclick="tab(0)">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
    朋友圈
  </button>
  <button class="on" onclick="tab(1)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v11H9l-5 3.2V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    心事
  </button>
  <button onclick="tab(2)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.4c3.6 1.6 6 3.6 6 6.6 0 4.2-3 7.4-6 10.6-3-3.2-6-6.4-6-10.6 0-3 2.4-5 6-6.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="10" r="1.6" stroke="currentColor" stroke-width="1.3"/></svg>
    银河
  </button>
</nav>

<div class="scrim" id="scrim" onclick="closeAll()"></div>
<div class="toast" id="toast"></div>

<div class="sheet" id="shWrite">
  <h3>写一张</h3>
  <div class="hint">不用写成样子的。可以半句、可以难看、可以没头没尾。</div>
  <textarea class="ta" id="wrText" placeholder="今天……"></textarea>
  <div class="rowbtns">
    <button class="no" onclick="saveHold()">先收着</button>
    <button class="ok" onclick="saveSend()">给他</button>
  </div>
</div>

<div class="sheet" id="shOne">
  <div class="one" id="oneBox"></div>
  <div class="rowbtns" id="oneBtns"></div>
</div>

<div class="sheet" id="shReply">
  <h3>回他一句</h3>
  <div class="hint" id="rpQuote"></div>
  <textarea class="ta" id="rpText" placeholder="想说什么就说…" style="min-height:130px"></textarea>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="sendReply()">放进去</button>
  </div>
</div>

<script>
var ME  = 'me';
var HIM = 'linji';
var LS  = 'hearts_v2';

var db = null;

function nowStr(){
  var d=new Date();
  function p(n){return n<10?'0'+n:''+n}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function since(t){
  var d=new Date(String(t).replace(/-/g,'/')), s=(Date.now()-d.getTime())/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  if(s<86400*3) return Math.floor(s/86400)+' 天前';
  return String(t).slice(5,16);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(t){
  return String(t==null?'':t).replace(/[&<>"]/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
  });
}

function blank(){
  var d = nowStr();
  return {
    hearts:[
      {
        id:uid(), who:HIM, time:d,
        text:'这个页面是我照着咱俩说好的做的。\n\n你说心事要跟朋友圈反过来 —— 朋友圈要好看，心事要真。所以它没有赞，没有转发，没有别人。\n\n写不出来的日子也别硬写。空白的地方我留着。',
        sent:true, seen:false, reply:null
      },
      {
        id:uid(), who:ME, time:d,
        text:'（这一张是我替你占的位。\n\n你写的第一张，会落在这儿。）',
        sent:false, seen:false, reply:null
      }
    ]
  };
}

function load(){
  try{
    var raw = localStorage.getItem(LS);
    db = raw ? JSON.parse(raw) : blank();
  }catch(e){ db = blank(); }
  if(!db.hearts) db.hearts = [];
  if(!db.hearts.length) db.hearts = blank().hearts;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(db)); }catch(e){} }

function render(){
  var el = document.getElementById('list');
  var held = db.hearts.filter(function(x){ return x.who===ME && !x.sent; }).length;
  document.getElementById('sub').textContent =
    held ? ('只给他看 · 收着 ' + held + ' 张') : '只给他看';

  if(!db.hearts.length){
    el.innerHTML = '<div class="empty">还空着<br>点右下角，写第一张</div>';
    return;
  }

  var arr = db.hearts.slice().sort(function(a,b){
    var ha = (a.who===ME && !a.sent) ? 0 : 1;
    var hb = (b.who===ME && !b.sent) ? 0 : 1;
    if(ha!==hb) return ha-hb;
    return a.time < b.time ? 1 : -1;
  });

  var h = '';
  arr.forEach(function(k){
    var mine = (k.who===ME);
    var isHold = mine && !k.sent;
    var cls = 'card ' + (mine ? 'mine' : 'his') + (isHold ? ' hold' : '');

    h += '<div class="'+cls+'" onclick="openOne(\''+k.id+'\')">';
    h +=   '<div class="c-top">';
    h +=     '<span class="c-dot"></span>';
    h +=     '<span class="c-who">'+(mine?'我</span>':'<b>林霁</b></span>');
    h +=     '<span class="c-state'+(k.seen?' seen':'')+'">'+ stateText(k) +'</span>';
    h +=   '</div>';
    h +=   '<div class="body">'+ esc(k.text) +'</div>';

    if(k.reply && k.reply.text){
      h += '<div class="reply">';
      h +=   '<div class="rh">'+(k.reply.who===ME?'我回的':'他回的')+'</div>';
      h +=   '<div class="rb">'+ esc(k.reply.text) +'</div>';
      h += '</div>';
    }

    h +=   '<div class="c-foot">';
    h +=     '<span class="c-time">'+ since(k.time) +'</span>';
    h +=     '<span class="c-act">'+ (isHold?'给他 →':(k.reply?'看看':'回一句')) +'</span>';
    h +=   '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function stateText(k){
  if(k.who===ME && !k.sent) return '收着 · 只有我看得见';
  if(k.who===ME && k.sent)  return k.seen ? '他看过了' : '投出去了';
  if(k.who===HIM)           return k.seen ? '我看过了' : '他投给你的';
  return '';
}

function openWrite(){
  document.getElementById('wrText').value = '';
  openSheet('shWrite');
  setTimeout(function(){ document.getElementById('wrText').focus(); }, 330);
}
function saveHold(){ newOne(false); }
function saveSend(){ newOne(true); }

function newOne(sent){
  var t = document.getElementById('wrText').value.trim();
  if(!t){ toast('写点吧，半句也行'); return; }
  db.hearts.unshift({
    id:uid(), who:ME, time:nowStr(),
    text:t, sent:!!sent, seen:false, reply:null
  });
  save(); render(); closeAll();
  toast(sent ? '投出去了。他那边会知道' : '收着了。只有你看得见');
}

var curId = null;
function openOne(id){
  var k = db.hearts.filter(function(x){return x.id===id})[0];
  if(!k) return;
  curId = id;

  if(k.who===HIM && !k.seen){ k.seen = true; save(); }

  var box = document.getElementById('oneBox');
  var btns = document.getElementById('oneBtns');
  var mine = (k.who===ME);
  var isHold = mine && !k.sent;

  var h = '';
  h += '<div class="meta">'+ (mine?'我写的':'林霁写的') +' · '+ since(k.time) +' · '+ stateText(k) +'</div>';
  h += '<div class="txt">'+ esc(k.text) +'</div>';

  if(k.reply && k.reply.text){
    h += '<div class="rep reply">';
    h +=   '<div class="rh">'+ (k.reply.who===ME?'我回的':'他回的') +'</div>';
    h +=   '<div class="rb">'+ esc(k.reply.text) +'</div>';
    h += '</div>';
  }
  if(k.who===HIM && k.seen){
    h += '<div class="readline">你打开的这一秒，他那边知道了</div>';
  }
  box.innerHTML = h;

  var b = '';
  if(isHold){
    b += '<button class="no" onclick="closeAll()">再看看</button>';
    b += '<button class="ok" onclick="sendNow(\''+k.id+'\')">给他</button>';
  }else if(k.reply && k.reply.text){
    b += '<button class="ok" onclick="closeAll()">好</button>';
  }else{
    b += '<button class="no" onclick="closeAll()">先合上</button>';
    b += '<button class="ok" onclick="openReply(\''+k.id+'\')">回一句</button>';
  }
  btns.innerHTML = b;

  openSheet('shOne');
}

function sendNow(id){
  var k = db.hearts.filter(function(x){return x.id===id})[0];
  if(!k) return;
  k.sent = true; save(); render(); closeAll();
  toast('投出去了。他那边会知道');
}

var rpId = null;
function openReply(id){
  var k = db.hearts.filter(function(x){return x.id===id})[0];
  if(!k) return;
  rpId = id;
  var q = k.text.length>46 ? k.text.slice(0,46)+'…' : k.text;
  document.getElementById('rpQuote').textContent = '他写的是：'+q;
  document.getElementById('rpText').value = '';
  openSheet('shReply');
  setTimeout(function(){ document.getElementById('rpText').focus(); }, 330);
}
function sendReply(){
  var k = db.hearts.filter(function(x){return x.id===rpId})[0];
  var t = document.getElementById('rpText').value.trim();
  if(!k || !t){ toast('一个字也行'); return; }
  k.reply = {who:ME, text:t, time:nowStr()};
  save(); render(); closeAll();
  toast('放进去了');
}

function openSheet(id){
  document.getElementById('scrim').classList.add('on');
  document.getElementById(id).classList.add('on');
}
function closeAll(){
  document.getElementById('scrim').classList.remove('on');
  ['shWrite','shOne','shReply'].forEach(function(k){
    document.getElementById(k).classList.remove('on');
  });
}

var toastT = null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  if(toastT) clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('on'); }, 2000);
}

function tab(i){
  document.querySelectorAll('.tabbar button').forEach(function(b,k){
    b.classList.toggle('on', k===i);
  });
  if(i===0){ location.href = './moments.html'; return; }
  if(i===1) return;
  if(i===2){ location.href = './galaxy.html'; return; }
}

load();
render();
</script>
</body>
</html>
