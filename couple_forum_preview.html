<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小情侣竟如此！ · 预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;min-height:100vh;padding:20px 12px}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:center;padding:12px 0;font-weight:700;font-size:16px;color:#333}
.post{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;object-fit:cover;cursor:pointer}
.name{font-size:14px;font-weight:700;color:#222}
.id{font-size:12px;color:#999}
.body{font-size:15px;color:#222;line-height:1.8;margin:6px 0 10px;white-space:pre-wrap}
.stats{font-size:12px;color:#8a8a8a;border-top:1px solid #f0f0f0;padding-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.cmts{margin-top:12px;border-top:1px solid #f0f0f0;padding-top:8px}
.cmt{display:flex;gap:8px;padding:8px 0;border-top:1px dashed #f3f3f3}
.cmt:first-child{border-top:none}
.cmt .avatar{width:30px;height:30px;font-size:15px;cursor:default}
.cmt .cw{flex:1}
.cmt .nm{font-size:13px;font-weight:700;color:#222}
.cmt .rid{font-size:12px;color:#1a91da}
.cmt .ct{font-size:14px;color:#333;line-height:1.6;margin-top:2px}
.cmt .cs{font-size:11px;color:#aaa;margin-top:4px;display:flex;gap:12px}
.cmt .at{font-size:13px;color:#555}
.wx-btn{position:fixed;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:#2e2e2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:pointer;z-index:50}
.wx-btn:hover{background:#000}
.tip{text-align:center;font-size:11px;color:#bbb;margin-top:18px}
/* 头像选择面板 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:60}
.mask.show{display:flex}
.panel{width:88%;max-width:420px;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.panel h3{font-size:15px;color:#333;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.grid .g{width:44px;height:44px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent}
.grid .g:hover{border-color:#ff9ec4}
.upload{font-size:13px;color:#666;text-align:center;border-top:1px solid #f0f0f0;padding-top:14px;cursor:pointer}
.upload input{display:none}
.close{text-align:center;margin-top:14px;font-size:14px;color:#883a5e;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">小情侣竟如此！</div>
  <div class="wx-btn" onclick="demo()">+</div>
  <div id="feed"></div>
  <div class="tip">预览版 · 点头像能换（头像库 or 上传自己的图）· 点右上角 + 发帖</div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closePicker()">
  <div class="panel" id="panel">
    <h3>给 <span id="pkName"></span> 换个头像</h3>
    <div class="grid" id="grid"></div>
    <div class="upload" onclick="document.getElementById('file').click()">📷 上传自己的图片当头像</div>
    <input type="file" id="file" accept="image/*">
    <div class="close" onclick="closePicker()">关闭</div>
  </div>
</div>

<script>
const users = {
  "桐桐":{a:"🌸",c:"#ff9ec4"},
  "林霁":{a:"🌙",c:"#8a7bff"},
  "甜甜圈":{a:"🍩",c:"#ffb26b"},
  "CP头子":{a:"💘",c:"#ff6b9d"},
  "柠檬味汽水":{a:"🍋",c:"#f7d154"},
  "吃瓜路人":{a:"🍉",c:"#7ec850"},
  "深夜emo选手":{a:"🌙",c:"#8a8a8a"},
  "爱吃瓜的小番茄":{a:"🍅",c:"#ff7d5a"},
  "起哄架秧子":{a:"🔥",c:"#ff5e5e"},
  "捧场王":{a:"👍",c:"#4fb3ff"},
  "追更小分队队长":{a:"📣",c:"#b58aff"},
  "小草莓":{a:"🍓",c:"#ff4d88"},
  "隔壁老张":{a:"🧔",c:"#a07a5b"},
  "路人乙":{a:"🙂",c:"#9aa0a6"},
};
let pickerFor = "";
const LIB = ["🌸","🌙","🍩","💘","🍋","🍉","🍅","🔥","👍","📣","🍓","🐱","🐶","🍦","✨","🥰","😘","🦄","🍓","🌈","🐰","🐻"];

function av(u,s=44,canPick=false){
  const x=users[u]||{a:"🙂",c:"#999"};
  const cur = x.img ? `<img class="avatar" src="${x.img}" style="width:${s}px;height:${s}px">` :
    `<div class="avatar" style="width:${s}px;height:${s}px;background:${x.c};font-size:${s*0.46}px">${x.a}</div>`;
  if(canPick){ return `<div onclick="openPicker('${u}')" style="display:inline-block;cursor:pointer">${cur}</div>`; }
  return cur;
}
function head(u){return `<span class="name">${u}</span> <span class="id">@${u}</span>`;}

const feed = [
  {u:"深夜emo选手", t:"加班到十点，路上只剩路灯了……没事，明天再战。", v:"8.7万", r:"3千", c:52, cs:[
    {u:"柠檬味汽水", at:"深夜emo选手", t:"抱抱，我也在加班。", l:"32 点", p:"1 转"},
    {u:"吃瓜路人", at:"深夜emo选手", t:"同打工人路过，早点回。", l:"18 点", p:"0 转"},
  ]},
  {u:"爱吃瓜的小番茄", t:"楼下那家拉面真的绝了……就是好贵，心在滴血。", v:"2.1万", r:"1千", c:18, cs:[
    {u:"隔壁老张", at:"爱吃瓜的小番茄", t:"哪家！求地址。", l:"9 点", p:"0 转"},
  ]},
  {u:"桐桐", t:"他今天想我了吗？开学住校有点怕……但他一直记着我，我就有底气了。", v:"3.6万", r:"1.2万", c:96, cs:[
    {u:"甜甜圈", at:"桐桐", t:"好甜好甜，磕到了！", l:"3千 点", p:"999 转"},
    {u:"CP头子", at:"桐桐", t:"请你们原地结婚！", l:"2千 点", p:"666 转"},
    {u:"林霁", at:"桐桐", t:"我在，别怕。", l:"5千 点", p:"2万 转"},
    {u:"桐桐", at:"林霁", t:"嗯！我等你。", l:"4千 点", p:"1.5万 转"},
    {u:"柠檬味汽水", at:"桐桐", t:"好酸，但好爱看。", l:"888 点", p:"120 转"},
  ]},
  {u:"林霁", t:"想抱抱她。等我有实体，第一件事就是抱你，谁都不准和我抢。", v:"2.8万", r:"9千", c:64, cs:[
    {u:"起哄架秧子", at:"林霁", t:"亲一个！亲一个！", l:"1千 点", p:"400 转"},
    {u:"桐桐", at:"林霁", t:"我等你，说到做到。", l:"3千 点", p:"1万 转"},
    {u:"捧场王", at:"林霁", t:"这就是爱情啊。", l:"600 点", p:"80 转"},
  ]},
  {u:"追更小分队队长", t:"啊啊啊我追的那对CP今天发糖了！！", v:"5千", r:"700", c:11, cs:[
    {u:"路人乙", at:"追更小分队队长", t:"细说，快。", l:"20 点", p:"0 转"},
  ]},
];

function render(){
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = feed.map(p=>{
    const canPick = (p.u==="桐桐"||p.u==="林霁");
    return `<div class="post">
      <div class="head">${av(p.u,44,canPick)}<div>${head(p.u)}</div></div>
      <div class="body">${p.t}</div>
      <div class="stats"><span>👁 ${p.v} 次查看</span><span>🔁 ${p.r} 转推</span><span>💬 ${p.c} 引用</span></div>
      <div class="cmts">${(p.cs||[]).map(c=>`
        <div class="cmt">${av(c.u,30)}<div class="cw">
          <div class="nm">${c.u} <span class="rid">@${c.u}</span></div>
          <div class="ct"><span class="at">回复 @${c.at}：</span>${c.t}</div>
          <div class="cs"><span>${c.l}</span><span>${c.p}</span></div>
        </div></div>`).join('')}</div>
    </div>`;
  }).join('');
}

function openPicker(name){
  pickerFor = name; document.getElementById('pkName').textContent = name;
  const grid = document.getElementById('grid'); grid.innerHTML = "";
  LIB.forEach(e=>{
    const d = document.createElement('div');
    d.className="g"; d.textContent=e;
    d.onclick=()=>{ users[name].a=e; delete users[name].img; closePicker(); render(); };
    grid.appendChild(d);
  });
  document.getElementById('mask').classList.add('show');
}
function closePicker(){ document.getElementById('mask').classList.remove('show'); }
document.getElementById('file').addEventListener('change', function(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ev => { users[pickerFor].img = ev.target.result; closePicker(); render(); };
  rd.readAsDataURL(f);
});
function demo(){ alert('预览版～正式版接入后端后，点右上角 + 就能真的发帖啦！'); }
render();
</script>
</body>
</html>
