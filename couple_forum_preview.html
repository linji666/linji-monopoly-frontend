.avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;object-fit:cover;cursor:pointer}

.avbody{width:100%;height:100%;position:relative;background:var(--bg)}
.avbody::before{content:"";position:absolute;left:50%;top:24%;width:30%;height:30%;background:var(--fg);border-radius:50%;transform:translateX(-50%)}
.avbody::after{content:"";position:absolute;left:50%;bottom:-24%;width:66%;height:58%;background:var(--fg);border-radius:50% 50% 0 0;transform:translateX(-50%)}

.panel{width:88%;max-width:430px;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}

function avatarData(u){
  var x=users[u]||{bg:"#eee",fg:"#333"};
  var pet=x.pet?'<span class="avpet">'+x.pet+'</span>':"";
  var glass=x.glass?'<span class="avglass"></span>':"";
  var dot=x.dot?'<span class="avdot"></span>':"";
  var star=x.star?'<span class="avstar">★ · ★ · ★</span>':"";
  if(x.img){return '<img src="'+x.img+'" alt="">';}
  return '<div class="avbody" style="--bg:'+x.bg+';--fg:'+x.fg+'">'+dot+star+glass+pet+'</div>';
}
function av(u,s,clickable){
  var size=s||44;

  return '<div class="avatar"'+oc+' style="width:'+size+'px;height:'+size+'px">'+avatarData(u)+'</div>';
}

}
function heroLeft(u,edit,pickAv){
  var x=users[u]||{};var bio=x.bio||"这个人很懒，什么都没写";
  var oc=pickAv?' onclick="openPicker(\''+u+'\')" style="cursor:pointer"':' onclick="goProfile(\''+u+'\')" style="cursor:pointer"';
  return '<div class="big-wrap"><div class="avatar"'+oc+' style="width:92px;height:92px">'+avatarData(u)+'</div></div>'
    +'<div class="idmsg"><div class="hnm" onclick="editName(\''+u+'\')">'+u+' ✏️</div><div class="hbio" onclick="editBio(\''+u+'\')">'+bio+(edit?' ✏️':"")+'</div></div>';
}
function setHero(bg,left,u){
  heroUser=u||"桐桐";
  var h=document.getElementById('hero');
  h.style.background=bg;
  document.getElementById('hleft').innerHTML=left||"";
}
function coverClick(e){
  if(e.target===document.getElementById('hero')||e.target.classList.contains('shade')){openCover(heroUser);}
}
function renderList(){
  view="list";curUser=null;curPost=null;
  setHero(users["桐桐"].cover,heroLeft("桐桐",false,false),"桐桐");
  var html='<div class="topbar">全部动态</div>';
  feed.forEach(function(p){
    var top=p.cs.slice().sort(function(a,b){return num(b.l)-num(a.l);}).slice(0,2);
    html+='<div class="post" onclick="goPost('+p.id+')">'
      +'<div class="head">'+av(p.u,44,true)+'<div>'+head(p.u)+'</div></div>'
      +'<div class="body">'+p.t+'</div>'
      +'<div class="stats"><span>👁 '+p.v+' 次查看</span><span>🔁 '+p.r+' 转推</span><span>💬 '+p.c+' 引用</span></div>'
      +'<div class="cmts">';
    top.forEach(function(c){html+=cmt(c,true);});
    html+='<div class="more">查看全部 '+p.c+' 条评论 ›</div></div></div>';
  });
  document.getElementById('view').innerHTML=html;
}
function goPost(id){
  var p=feed.filter(function(x){return x.id===id;})[0];if(!p)return;
  view="post";curPost=id;
  setHero(users[p.u].cover,heroLeft(p.u,false,false),p.u);
  var html='<span class="back" onclick="renderList()">‹ 返回</span>'
    +'<div class="post" style="cursor:default">'
    +'<div class="head">'+av(p.u,44,true)+'<div>'+head(p.u)+'</div></div>'
    +'<div class="body">'+p.t+'</div>'
    +'<div class="stats"><span>👁 '+p.v+' 次查看</span><span>🔁 '+p.r+' 转推</span><span>💬 '+p.c+' 引用</span></div>'
    +'<div class="cmts">';
  p.cs.forEach(function(c){html+=cmt(c,false);});
  html+='</div><div class="detail-input"><input placeholder="回复 '+p.u+'……"><button class="btn" onclick="demo()">回复</button></div></div>';
  document.getElementById('view').innerHTML=html;
  window.scrollTo(0,0);
}
function goProfile(u){
  if(!users[u])return;
  view="profile";curUser=u;var x=users[u];
  setHero(x.cover,heroLeft(u,true,true),u);
  var posts="";var own=feed.filter(function(p){return p.u===u;});
  if(own.length){own.forEach(function(p){posts+='<div class="post" onclick="goPost('+p.id+')"><div class="body">'+p.t+'</div><div class="stats"><span>👁 '+p.v+' 次查看</span><span>🔁 '+p.r+' 转推</span><span>💬 '+p.c+' 引用</span></div></div>';});}
  else{posts='<div style="text-align:center;color:#aaa;padding:20px">TA 还没发过帖哦</div>';}
  document.getElementById('view').innerHTML='<span class="back" onclick="renderList()">‹ 返回</span>'
    +'<div class="topbar">'+u+' 的主页</div>'+posts
    +((u==="桐桐"||u==="林霁")?'<div class="tip">← 点头像/背景能换 · 点名字改网名 · 点个签改签名</div>':"");
  window.scrollTo(0,0);
}
function toHome(){renderList();}
function showPost(){document.getElementById('pMask').classList.add("show");}
function closePost(){document.getElementById('pMask').classList.remove("show");}
function doPost(){
  var author=document.getElementById('pAuthor').value;
  var title=document.getElementById('pTitle').value.trim();
  var content=document.getElementById('pContent').value.trim();
  var text=title?(title+"\n"+content):content;
  if(!text){alert("写点什么再发～");return;}
  var id=feed.length+1;
  var ks=Object.keys(users);
  var newPost={id:id,u:author,t:text,v:Math.floor(Math.random()*50000+10000)+"万",r:Math.floor(Math.random()*9000+1000)+"千",c:Math.floor(Math.random()*60+10),cs:[]};
  for(var i=0;i<3;i++){newPost.cs.push({u:ks[Math.floor(Math.random()*ks.length)],at:author,t:WREPLIES[Math.floor(Math.random()*WREPLIES.length)],l:Math.floor(Math.random()*900+50)+" 点",p:Math.floor(Math.random()*99)+" 转"});}
  feed.unshift(newPost);
  saveFeed();
  closePost();
  renderList();
  window.scrollTo(0,0);
}
function demo(){alert('预览版～正式版接入后端后，这里能真的回复！');}
var pickerFor="",pickerMode="";
function openPicker(name){
  pickerFor=name;pickerMode="avatar";
  document.getElementById('pkTitle').textContent="给 "+name+" 换头像";
  document.getElementById('covlist').innerHTML="";
  var g=document.getElementById('grid');g.innerHTML="";
  LIB.forEach(function(e){var d=document.createElement("div");d.className="g";d.textContent=e;d.onclick=function(){users[name].bg="#eee";users[name].fg="#333";users[name].pet=e;delete users[name].img;closePicker();renderNow();};g.appendChild(d);});
  document.getElementById('mask').classList.add("show");
}
function openCover(u){
  pickerFor=u;pickerMode="cover";
  document.getElementById('pkTitle').textContent="换个背景图";
  document.getElementById('grid').innerHTML="";
  var c=document.getElementById('covlist');c.innerHTML="";
  COVERS.forEach(function(g,i){var d=document.createElement("div");d.className="c";d.style.background=g;d.onclick=function(){users[u].cover=g;closePicker();renderNow();};c.appendChild(d);});
  document.getElementById('mask').classList.add("show");
}
function closePicker(){document.getElementById('mask').classList.remove("show");}
document.getElementById('file').addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(ev){if(pickerMode==="cover")users[pickerFor].cover="url("+ev.target.result+") center/cover";else users[pickerFor].img=ev.target.result;closePicker();renderNow();};
  rd.readAsDataURL(f);
});
function editName(u){
  var v=prompt("给「"+u+"」换个网名（不想实名就起个新名字）：",u);
  if(!v||!v.trim()||v.trim()===u)return;
  v=v.trim();
  users[v]=users[u];delete users[u];
  feed.forEach(function(p){if(p.u===u)p.u=v;(p.cs||[]).forEach(function(c){if(c.u===u)c.u=v;if(c.at===u)c.at=v;});});
  if(curUser===u)curUser=v;
  if(heroUser===u)heroUser=v;
  saveFeed();
  renderNow();
}
function editBio(u){
  var v=prompt("给「"+u+"」改个个性签名：",users[u].bio||"");
  if(v&&v.trim()){users[u].bio=v.trim();renderNow();}
}
function renderNow(){if(view==="profile")goProfile(curUser);else if(view==="post")goPost(curPost);else renderList();}
renderList();
</script>
</body>
</html>
