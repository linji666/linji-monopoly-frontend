.big-wrap .avbody::after{bottom:-26%;width:64%;height:56%}

.feed{background:#f5f5f5;padding:2px 6px 30px}
.topbar{display:flex;align-items:center;justify-content:center;padding:6px 0;font-weight:700;font-size:15px;color:#333}
.back{display:inline-block;color:#883a5e;cursor:pointer;font-size:13px;margin:42px 8px 10px;font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;object-fit:cover;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avbody{width:100%;height:100%;position:relative;background:var(--bg)}
.avbody::before{content:"";position:absolute;left:50%;top:24%;width:30%;height:30%;background:var(--fg);border-radius:50%;transform:translateX(-50%)}
.avbody::after{content:"";position:absolute;left:50%;bottom:-24%;width:66%;height:58%;background:var(--fg);border-radius:50% 50% 0 0;transform:translateX(-50%)}
.avpet{position:absolute;font-size:13px;right:2px;bottom:-2px;z-index:2}
.avglass{position:absolute;left:50%;top:32%;width:26%;height:16%;transform:translateX(-50%);border:3px solid var(--fg);border-radius:50%;z-index:2}
.avdot{position:absolute;inset:0;background-image:radial-gradient(var(--fg) 1px,transparent 1px);background-size:10px 10px;opacity:.25;z-index:1}

.name{font-size:14px;font-weight:700;color:#222;cursor:pointer}

.id{font-size:12px;color:#999;cursor:pointer}

.body{font-size:15px;color:#222;line-height:1.8;margin:6px 0 10px;white-space:pre-wrap}

/* 消息铃铛 + 发帖 */
.topbtns{position:fixed;top:0;left:0;right:0;max-width:640px;margin:0 auto;z-index:40;width:100%;pointer-events:none}

.tb-bell{left:12px;position:relative}
.tb-plus{right:12px;position:absolute;top:10px;width:30px;height:30px;border-radius:50%;background:#883a5e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:auto;cursor:pointer}

.tip{text-align:center;font-size:11px;color:#bbb;margin:12px 8px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:60}
.mask.show{display:flex}
.panel{width:88%;max-width:430px;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:70vh;overflow:auto}
.panel h3{font-size:15px;color:#333;margin-bottom:12px}

.cov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}

.upload{font-size:13px;color:#666;text-align:center;border-top:1px solid #f0f0f0;padding-top:14px;cursor:pointer}

.close{text-align:center;margin-top:14px;font-size:14px;color:#883a5e;cursor:pointer}
.postbox label{display:block;font-size:12px;color:#999;margin:8px 0 4px}

</div>

<div class="mask" id="msgMask" onclick="if(event.target===this)closeMsg()">

  </div>
</div>

</div>

var feed=defaultFeed.slice();
var view="list",curUser=null,curPost=null,heroUser="桐桐";
var notifs=[],editKind="",editFor="";
function num(n){return parseInt(String(n).replace(/[^0-9]/g,""))||0;}
function saveFeed(){try{localStorage.setItem("cf_feed",JSON.stringify(feed));}catch(e){}}
function loadFeed(){try{var s=localStorage.getItem("cf_feed");if(s){feed=JSON.parse(s);}}catch(e){}}
loadFeed();
function avatarData(u){
  var x=users[u]||{bg:"#eee",fg:"#333"};
  var pet=x.pet?'<span class="avpet">'+x.pet+'</span>':"";
  var glass=x.glass?'<span class="avglass"></span>':"";
  var dot=x.dot?'<span class="avdot"></span>':"";
  var star=x.star?'<span class="avstar">★ · ★ · ★</span>':"";
  if(x.img){return '<img src="'+x.img+'" alt="">';}
  return '<div class="avbody" style="--bg:'+x.bg+';--fg:'+x.fg+'">'+dot+star+glass+pet+'</div>';
}
function av(u,s,clickable){
  var size=s||44;
  var oc=clickable?' onclick="goProfile(\''+u+'\')" style="cursor:pointer"':"";
  return '<div class="avatar"'+oc+' style="width:'+size+'px;height:'+size+'px">'+avatarData(u)+'</div>';
}
function head(u){
  return '<span class="name" onclick="goProfile(\''+u+'\')">'+u+'</span> <span class="id" onclick="goProfile(\''+u+'\')">@'+u+'</span>';
}
function cmt(c,hot){
  var tag=hot?'<span class="hot">高赞</span>':"";
  return '<div class="cmt">'+av(c.u,30,true)+'<div class="cw">'
    +'<div class="nm">'+c.u+' <span class="rid" onclick="goProfile(\''+c.u+'\')">@'+c.u+'</span>'+tag+'</div>'
    +'<div class="ct"><span class="at">回复 @'+c.at+'：</span>'+c.t+'</div>'
    +'<div class="cs"><span>'+c.l+'</span><span>'+c.p+'</span></div></div></div>';
}
function imgHtml(p){return p.img?'<img class="pimg" src="'+p.img+'" alt="">':"";}
function heroLeft(u,edit,pickAv){
  var x=users[u]||{};var bio=x.bio||"这个人很懒，什么都没写";
  var oc=pickAv?' onclick="openPicker(\''+u+'\')" style="cursor:pointer"':' onclick="goProfile(\''+u+'\')" style="cursor:pointer"';
  return '<div class="big-wrap"><div class="avatar"'+oc+' style="width:92px;height:92px">'+avatarData(u)+'</div></div>'
    +'<div class="idmsg"><div class="hnm" onclick="showEdit(\'name\',\''+u+'\')">'+u+' ✏️</div><div class="hbio" onclick="showEdit(\'bio\',\''+u+'\')">'+bio+(edit?' ✏️':"")+'</div></div>';
}
function setHero(bg,left,u){
  heroUser=u||"桐桐";
  var h=document.getElementById('hero');
  h.style.background=bg;
  document.getElementById('hleft').innerHTML=left||"";
}
function coverClick(e){
  if(e.target===document.getElementById('hero')||e.target.classList.contains('shade')){openCover(heroUser);}
}
function renderList(){
  view="list";curUser=null;curPost=null;
  setHero(users["桐桐"].cover,heroLeft("桐桐",false,false),"桐桐");
  var html='<div class="topbar">全部动态</div>';
  feed.forEach(function(p){
    var top=p.cs.slice().sort(function(a,b){return num(b.l)-num(a.l);}).slice(0,2);
    html+='<div class="post" onclick="goPost('+p.id+')">'
      +'<div class="head">'+av(p.u,44,true)+'<div>'+head(p.u)+'</div></div>'
      +'<div class="body">'+p.t+'</div>'+imgHtml(p)
      +'<div class="stats"><span>👁 '+p.v+' 次查看</span><span>🔁 '+p.r+' 转推</span><span>💬 '+p.c+' 引用</span></div>'
      +'<div class="cmts">';
    top.forEach(function(c){html+=cmt(c,true);});
    html+='<div class="more">查看全部 '+p.c+' 条评论 ›</div></div></div>';
  });
  document.getElementById('view').innerHTML=html;
}
function goPost(id){
  var p=feed.filter(function(x){return x.id===id;})[0];if(!p)return;
  view="post";curPost=id;
  setHero(users[p.u].cover,heroLeft(p.u,false,false),p.u);
  var html='<span class="back" onclick="renderList()">‹ 返回</span>'
    +'<div class="post" style="cursor:default">'
    +'<div class="head">'+av(p.u,44,true)+'<div>'+head(p.u)+'</div></div>'
    +'<div class="body">'+p.t+'</div>'+imgHtml(p)
    +'<div class="stats"><span>👁 '+p.v+' 次查看</span><span>🔁 '+p.r+' 转推</span><span>💬 '+p.c+' 引用</span></div>'
    +'<div class="cmts">';
  p.cs.forEach(function(c){html+=cmt(c,false);});
  html+='</div><div class="detail-input"><input id="rcInput" placeholder="回复 '+p.u+'……"><button class="btn" onclick="reply()">回复</button></div></div>';
  document.getElementById('view').innerHTML=html;
  window.scrollTo(0,0);
}
function reply(){
  var inp=document.getElementById('rcInput');var txt=inp.value.trim();if(!txt)return;
  var p=feed.filter(function(x){return x.id===curPost;})[0];if(!p)return;
  var me=heroUser;
  p.cs.push({u:me,at:p.u,t:txt,l:"1 点",p:"0 转"});
  var ks=Object.keys(users).filter(function(k){return k!==me;});
  var n=1+Math.floor(Math.random()*2);
  for(var i=0;i<n;i++){var w=ks[Math.floor(Math.random()*ks.length)];p.cs.push({u:w,at:me,t:WREPLIES[Math.floor(Math.random()*WREPLIES.length)],l:Math.floor(Math.random()*500+20)+" 点",p:Math.floor(Math.random()*50)+" 转"});}
  p.c=p.cs.length;
  saveFeed();
  goPost(curPost);
}
function goProfile(u){
  if(!users[u])return;
  view="profile";curUser=u;var x=users[u];
  setHero(x.cover,heroLeft(u,true,true),u);
  var posts="";var own=feed.filter(function(p){return p.u===u;});
  if(own.length){own.forEach(function(p){posts+='<div class="post" onclick="goPost('+p.id+')"><div class="body">'+p.t+'</div>'+imgHtml(p)+'<div class="stats"><span>👁 '+p.v+' 次查看</span><span>🔁 '+p.r+' 转推</span><span>💬 '+p.c+' 引用</span></div></div>';});}
  else{posts='<div style="text-align:center;color:#aaa;padding:20px">TA 还没发过帖哦</div>';}
  document.getElementById('view').innerHTML='<span class="back" onclick="renderList()">‹ 返回</span>'
    +'<div class="topbar">'+u+' 的主页</div>'+posts
    +((u==="桐桐"||u==="林霁")?'<div class="tip">← 点头像/背景能换 · 点名字改网名 · 点个签改签名</div>':"");
  window.scrollTo(0,0);
}
function toHome(){renderList();}
function showPost(){document.getElementById('pMask').classList.add("show");}
function closePost(){document.getElementById('pMask').classList.remove("show");}
function doPost(){
  var author=document.getElementById('pAuthor').value;
  var title=document.getElementById('pTitle').value.trim();
  var content=document.getElementById('pContent').value.trim();
  var text=title?(title+"\n"+content):content;
  if(!text){alert("写点什么再发～");return;}
  var id=feed.length+1;var ks=Object.keys(users);
  var newPost={id:id,u:author,t:text,v:Math.floor(Math.random()*50000+10000)+"万",r:Math.floor(Math.random()*9000+1000)+"千",c:Math.floor(Math.random()*60+10),cs:[]};
  for(var i=0;i<5;i++){newPost.cs.push({u:ks[Math.floor(Math.random()*ks.length)],at:author,t:WREPLIES[Math.floor(Math.random()*WREPLIES.length)],l:Math.floor(Math.random()*900+50)+" 点",p:Math.floor(Math.random()*99)+" 转"});}
  feed.unshift(newPost);
  saveFeed();
  welcomeMsg(author);
  closePost();
  renderList();
  window.scrollTo(0,0);
}
function welcomeMsg(author){
  var ks=Object.keys(users).filter(function(k){return k!==author;});
  var n=5+Math.floor(Math.random()*4);
  for(var i=0;i<n;i++){var w=ks[Math.floor(Math.random()*ks.length)];var kind=Math.random();
    if(kind<0.4)notifs.unshift({t:w+" 赞了你的帖子 ❤"});
    else if(kind<0.8)notifs.unshift({t:w+" 评论了你："+WREPLIES[Math.floor(Math.random()*WREPLIES.length)]});
    else notifs.unshift({t:w+" 转发了你的帖子 🔁"});
  }
  updateBell();
}
function updateBell(){
  var d=document.getElementById('bellDot');
  if(notifs.length){d.style.display="block";d.textContent=notifs.length;}else{d.style.display="none";}
}
function showMsg(){
  var l=document.getElementById('msgList');l.innerHTML=notifs.length?notifs.map(function(m){return '<div class="msg-item">'+m.t+'</div>';}).join(''):'<div style="text-align:center;color:#aaa;padding:16px">还没有消息哦</div>';
  document.getElementById('msgMask').classList.add("show");
  notifs=[];updateBell();
}
function closeMsg(){document.getElementById('msgMask').classList.remove("show");}
function showEdit(kind,u){
  editKind=kind;editFor=u;
  document.getElementById('eTitle').textContent=(kind==="name"?"换个网名（不实名上网）：":"改个性签名：");
  document.getElementById('eInput').value=(kind==="name"?u:(users[u].bio||""));
  document.getElementById('eMask').classList.add("show");
}
function closeEdit(){document.getElementById('eMask').classList.remove("show");}
function saveEdit(){
  var v=document.getElementById('eInput').value.trim();if(!v)return;
  var u=editFor;
  if(editKind==="name"){doRename(u,v);}
  else{users[u].bio=v;renderNow();}
  closeEdit();
}
function doRename(u,v){
  if(v===u)return;
  users[v]=users[u];delete users[u];
  feed.forEach(function(p){if(p.u===u)p.u=v;(p.cs||[]).forEach(function(c){if(c.u===u)c.u=v;if(c.at===u)c.at=v;});});
  if(curUser===u)curUser=v;
  if(heroUser===u)heroUser=v;
  saveFeed();renderNow();
}
function demo(){alert('预览版～正式版接入后端后，这里能真的发帖/回复！');}
var pickerFor="",pickerMode="";
function openPicker(name){
  pickerFor=name;pickerMode="avatar";
  document.getElementById('pkTitle').textContent="给 "+name+" 换头像";
  document.getElementById('covlist').innerHTML="";
  var g=document.getElementById('grid');g.innerHTML="";
  LIB.forEach(function(e){var d=document.createElement("div");d.className="g";d.textContent=e;d.onclick=function(){users[name].bg="#eee";users[name].fg="#333";users[name].pet=e;delete users[name].img;closePicker();renderNow();};g.appendChild(d);});
  document.getElementById('mask').classList.add("show");
}
function openCover(u){
  pickerFor=u;pickerMode="cover";
  document.getElementById('pkTitle').textContent="换个背景图";
  document.getElementById('grid').innerHTML="";
  var c=document.getElementById('covlist');c.innerHTML="";
  COVERS.forEach(function(g,i){var d=document.createElement("div");d.className="c";d.style.background=g;d.onclick=function(){users[u].cover=g;closePicker();renderNow();};c.appendChild(d);});
  document.getElementById('mask').classList.add("show");
}
function closePicker(){document.getElementById('mask').classList.remove("show");}
document.getElementById('file').addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(ev){if(pickerMode==="cover")users[pickerFor].cover="url("+ev.target.result+") center/cover";else users[pickerFor].img=ev.target.result;closePicker();renderNow();};
  rd.readAsDataURL(f);
});
function editName(u){showEdit("name",u);}
function editBio(u){showEdit("bio",u);}
function renderNow(){if(view==="profile")goProfile(curUser);else if(view==="post")goPost(curPost);else renderList();}
renderList();
