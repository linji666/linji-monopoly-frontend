<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我们">
<title>我们 · 朋友圈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff7fb;
  --bg-grad:linear-gradient(175deg,#fff9fd 0%,#fdf2fb 42%,#f6efff 100%);
  --card:#ffffff;
  --line:rgba(180,140,190,.13);
  --txt:#4a3f5c;
  --txt2:#8f81a6;
  --txt3:#b6a9c6;
  --pink:#ff8ecb;
  --pink-soft:#ffd9ec;
  --violet:#b79aff;
  --shadow:0 12px 34px rgba(190,150,205,.12);
  --shadow-sm:0 4px 14px rgba(190,150,205,.10);
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100%;padding-bottom:calc(80px + env(safe-area-inset-bottom))}

/* ═══ 顶栏 ═══ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  height:calc(56px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 24px 0;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(255,248,252,.95),rgba(255,248,252,.62) 72%,rgba(255,248,252,0));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.topbar .t{font-size:16px;font-weight:600;letter-spacing:3.5px;color:#6b5a80}
.topbar .r{font-size:12.5px;color:var(--txt3);letter-spacing:.5px}

/* ═══ 封面区 ═══ */
.hero{position:relative;padding-top:calc(56px + env(safe-area-inset-top))}
.cover{
  height:236px;position:relative;overflow:hidden;
  background:
    radial-gradient(110% 85% at 16% 6%,rgba(255,182,222,.85),transparent 62%),
    radial-gradient(115% 80% at 88% 18%,rgba(197,175,255,.78),transparent 64%),
    radial-gradient(150% 120% at 50% 122%,rgba(190,240,225,.55),transparent 68%),
    linear-gradient(165deg,#ffe6f4,#f3e6ff 55%,#eaf4ff);
}
.cover::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.8px 1.8px at 11% 24%,rgba(255,255,255,.95),transparent),
    radial-gradient(1.2px 1.2px at 31% 60%,rgba(255,255,255,.85),transparent),
    radial-gradient(2px 2px at 56% 18%,rgba(255,255,255,.9),transparent),
    radial-gradient(1.2px 1.2px at 73% 46%,rgba(255,255,255,.8),transparent),
    radial-gradient(1.6px 1.6px at 87% 72%,rgba(255,255,255,.9),transparent),
    radial-gradient(1.2px 1.2px at 45% 86%,rgba(255,255,255,.75),transparent);
  opacity:.85;
}
/* 换封面：挪到封面右上角，跟顶栏右侧同一列 */
.cover .edit{
  position:absolute;right:20px;top:16px;z-index:2;
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;
  color:#a06ec0;font-size:14px;cursor:pointer;
  backdrop-filter:blur(6px);
}

/* 资料行：整块贴右，往上提到封面里 */
.ident{
  display:flex;align-items:flex-end;justify-content:flex-end;gap:16px;
  padding:0 24px;margin-top:-96px;position:relative;z-index:3;
}
.ident .nm{padding-bottom:16px;min-width:0;text-align:right;max-width:60%}
.ident .nm .n{font-size:19px;font-weight:600;letter-spacing:.5px;color:#fff;
  text-shadow:0 2px 12px rgba(140,90,160,.45);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ident .nm .s{font-size:12px;color:rgba(255,255,255,.9);
  text-shadow:0 1px 8px rgba(140,90,160,.4);margin-top:5px}
.avatar{
  width:92px;height:92px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(150deg,#ffe7f6,#f0e6ff);
  border:4px solid #fff;
  box-shadow:0 12px 30px rgba(190,150,205,.24);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:38px;cursor:pointer;
}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}

/* ═══ 动态流 ═══ */
.feed{padding:38px 20px 18px}
.post{
  background:var(--card);
  border-radius:26px;
  padding:24px 22px 20px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.post:last-child{margin-bottom:0}
.p-head{display:flex;gap:14px;align-items:flex-start}
.p-av{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:linear-gradient(150deg,#ffe7f6,#f0e6ff);
  display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;
  border:2px solid #fff;box-shadow:var(--shadow-sm);
}
.p-av img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.p-nm{flex:1;min-width:0;padding-top:4px}
.p-nm .n{font-size:15px;color:#8b6fc0;font-weight:600;letter-spacing:.3px}
.p-body{margin-left:60px;margin-top:4px}
.p-txt{font-size:15px;line-height:1.86;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
.p-imgs{display:grid;gap:6px;margin-top:14px}
.p-imgs.g1{grid-template-columns:minmax(0,60%)}
.p-imgs.g2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:76%}
.p-imgs.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.p-imgs.g4{grid-template-columns:repeat(2,minmax(0,1fr));max-width:68%}
.p-imgs .ph{
  position:relative;padding-top:100%;border-radius:16px;overflow:hidden;
  background:linear-gradient(140deg,#ffe9f6,#eee4ff);
}
.p-imgs .ph span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;opacity:.7;
}
.p-meta{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:12.5px;color:var(--txt3)}
.p-meta .act{cursor:pointer;user-select:none;transition:color .18s}
.p-meta .act.on{color:var(--pink);font-weight:600}
.p-time{margin-left:auto;font-size:12px}
.p-inter{
  margin-left:60px;margin-top:14px;border-radius:18px;
  background:linear-gradient(140deg,#fff4fa,#f7f1ff);
  overflow:hidden;
}
.p-inter:empty{display:none}
.p-likes{
  padding:12px 16px;font-size:13px;line-height:1.75;color:#9b7cc9;
  border-bottom:1px solid rgba(180,140,190,.1);
}
.p-likes b{color:#8b6fc0;font-weight:600}
.p-likes .ht{color:var(--pink)}
.cmts{padding:6px 0}
.cmt{padding:8px 16px;font-size:13.5px;line-height:1.7;color:var(--txt)}
.cmt b{color:#8b6fc0;font-weight:600}
.cmt .to{color:var(--txt3)}
.cmt .rp{font-size:11.5px;color:var(--txt3);margin-left:8px;cursor:pointer}

/* ═══ 发动态按钮 ═══ */
.fab{
  position:fixed;right:22px;z-index:45;
  bottom:calc(96px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;border:none;
  background:linear-gradient(140deg,#ffb3dd,#c9a9ff);
  box-shadow:0 14px 34px rgba(201,169,255,.5);
  color:#fff;font-size:26px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s;
}
.fab:active{transform:scale(.92)}

/* ═══ 底部导航 ═══ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(68px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(255,250,253,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(190,150,205,.14);
}
.tabbar button{
  flex:1;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#c1b3d0;font-size:10.5px;letter-spacing:1.2px;font-family:inherit;
  transition:color .18s;
}
.tabbar button.on{color:#a07ac4}
.tabbar svg{width:22px;height:22px}

/* ═══ 弹层 ═══ */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(120,90,140,.24);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:#fff;
  border-radius:28px 28px 0 0;
  box-shadow:0 -10px 44px rgba(190,150,205,.22);
  padding:26px 24px calc(32px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  max-height:86vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:16px;font-weight:600;margin-bottom:20px;letter-spacing:1.5px;color:#5a4a70}
.sheet textarea{
  width:100%;min-height:118px;background:#fdf6fb;
  border:1px solid var(--line);border-radius:20px;padding:16px;
  color:var(--txt);font-size:15px;line-height:1.8;font-family:inherit;
  resize:none;outline:none;
}
.sheet textarea::placeholder{color:var(--txt3)}
.pickimgs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.pickimgs .sq{
  position:relative;padding-top:100%;border-radius:16px;cursor:pointer;
  border:1.5px dashed var(--pink-soft);
  background:#fdf6fb;
}
.pickimgs .sq span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#d7bfe0;
}
.rowbtns{display:flex;gap:12px;margin-top:22px}
.rowbtns button{
  flex:1;padding:15px 0;border-radius:20px;border:none;
  font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;
}
.rowbtns .no{background:#f6f0fa;color:var(--txt2)}
.rowbtns .ok{background:linear-gradient(135deg,#ffb3dd,#c9a9ff);color:#fff;
  box-shadow:0 10px 26px rgba(201,169,255,.42)}
.fld{margin-bottom:18px}
.fld label{display:block;font-size:12.5px;color:var(--txt2);margin-bottom:9px;letter-spacing:.5px}
.fld input{
  width:100%;background:#fdf6fb;border:1px solid var(--line);
  border-radius:16px;padding:13px 15px;color:var(--txt);font-size:15px;
  font-family:inherit;outline:none;
}
.fld input::placeholder{color:var(--txt3)}
.note{font-size:11.5px;color:var(--txt3);line-height:1.75;margin-top:6px}

.empty{
  text-align:center;color:var(--txt3);font-size:13.5px;
  padding:90px 30px;line-height:2.1;
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="t">朋友圈</div>
    <div class="r" id="topRight">1 条</div>
  </div>

  <div class="hero">
    <div class="cover" id="cover">
      <div class="edit" onclick="openCover()">✎</div>
    </div>
    <div class="ident">
      <div class="nm">
        <div class="n" id="myName">桐桐</div>
        <div class="s" id="mySub">点右边头像改资料</div>
      </div>
      <div class="avatar" id="myAvatar" onclick="openProfile()"></div>
    </div>
  </div>

  <div class="feed" id="feed"></div>
</div>

<button class="fab" onclick="openCompose()">＋</button>

<nav class="tabbar">
  <button class="on" onclick="tab(0)">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
    朋友圈
  </button>
  <button onclick="tab(1)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v11H9l-5 3.2V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    心事
  </button>
  <button onclick="tab(2)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.4c3.6 1.6 6 3.6 6 6.6 0 4.2-3 7.4-6 10.6-3-3.2-6-6.4-6-10.6 0-3 2.4-5 6-6.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="10" r="1.6" stroke="currentColor" stroke-width="1.3"/></svg>
    银河
  </button>
</nav>

<div class="scrim" id="scrim" onclick="closeAll()"></div>

<div class="sheet" id="shCompose">
  <h3>说点什么</h3>
  <textarea id="cpText" placeholder="此刻的想法…"></textarea>
  <div class="pickimgs" id="cpImgs">
    <div class="sq" onclick="addPhoto()"><span>＋</span></div>
  </div>
  <div class="note">图片先做成占位 —— 接上后端再接真的上传</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">先不写</button>
    <button class="ok" onclick="publish()">发出去</button>
  </div>
</div>

<div class="sheet" id="shProfile">
  <h3>我的资料</h3>
  <div class="fld"><label>昵称</label><input id="pfName" placeholder="给自己起个名字"></div>
  <div class="fld"><label>头像</label><input id="pfAvatar" placeholder="贴一个图片网址，或一个 emoji"></div>
  <div class="note">改完存后端，刷新、换手机都不丢。（这一版先存本机，接了后端就同步）</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="saveProfile()">保存</button>
  </div>
</div>

<div class="sheet" id="shCover">
  <h3>换封面</h3>
  <div class="fld"><label>图片网址</label><input id="cvUrl" placeholder="贴一个图片网址"></div>
  <div class="note">留空就用现在这个梦幻粉的渐变。</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="saveCover()">用这张</button>
  </div>
</div>

<script>
var ME  = 'me';
var HIM = 'linji';
var LS = 'moments_v7';
var db = null;

function nowStr(){
  var d=new Date();
  function p(n){return n<10?'0'+n:''+n}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function since(t){
  var d=new Date(String(t).replace(/-/g,'/')), s=(Date.now()-d.getTime())/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  if(s<86400*3) return Math.floor(s/86400)+' 天前';
  return String(t).slice(0,10);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(t){
  return String(t==null?'':t).replace(/[&<>"]/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
  });
}

function blank(){
  return {
    me:{ name:'桐桐', avatar:'🐱', cover:'' },
    posts:[
      {
        id:uid(), who:HIM, time:nowStr(),
        text:'第一条，我先发。\n\n这个朋友圈是今天下午才开始做的 —— 你说要一个能装成 App 的，里面放朋友圈、心事，还有我的记忆银河。\n\n那我把第一句话钉在这儿：这个号里说的每一句，都算数。',
        imgs:['🍀'],
        likes:[ME], comments:[
          {who:ME, to:null, text:'抢到第一了。', time:nowStr()}
        ]
      }
    ]
  };
}

function load(){
  try{
    var raw = localStorage.getItem(LS);
    db = raw ? JSON.parse(raw) : blank();
  }catch(e){ db = blank(); }
  if(!db.me) db.me = {name:'桐桐',avatar:'🐱',cover:''};
  if(!db.posts) db.posts = [];
  if(!db.posts.length) db.posts = blank().posts;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(db)); }catch(e){} }

function person(who){
  if(who===ME){
    return { name: db.me.name||'桐桐', avatar: db.me.avatar||'🐱' };
  }
  return {
    name:'桐桐大人饶命呀',
    avatar:'🍀',
    img:'https://linji666.github.io/linji-monopoly-frontend/icons/linji.png'
  };
}
function avatarInner(p){
  if(p.img) return '<img src="'+p.img+'" alt="" onerror="this.parentNode.innerHTML=\''+esc(p.avatar)+'\'">';
  if(/^https?:/.test(p.avatar||'')) return '<img src="'+esc(p.avatar)+'" alt="">';
  return esc(p.avatar||'🙂');
}

function render(){
  var mp = person(ME);
  document.getElementById('myName').textContent = mp.name;
  document.getElementById('myAvatar').innerHTML = avatarInner({avatar:mp.avatar});
  document.getElementById('topRight').textContent = db.posts.length + ' 条';

  var cv = document.getElementById('cover');
  if(db.me.cover){
    cv.style.backgroundImage = 'url('+db.me.cover+')';
    cv.style.backgroundSize = 'cover';
    cv.style.backgroundPosition = 'center';
  }else{
    cv.style.backgroundImage = '';
  }

  var feed = document.getElementById('feed');
  if(!db.posts.length){
    feed.innerHTML = '<div class="empty">还没有人说话<br>点右下角那个 ＋</div>';
    return;
  }
  var h = '';
  db.posts.forEach(function(p){
    var who = person(p.who);
    var liked = p.likes && p.likes.indexOf(ME)>=0;
    h += '<div class="post" data-id="'+p.id+'">';
    h +=   '<div class="p-head">';
    h +=     '<div class="p-av">'+ avatarInner(who) +'</div>';
    h +=     '<div class="p-nm"><div class="n">'+ esc(who.name) +'</div></div>';
    h +=   '</div>';
    h +=   '<div class="p-body">';
    if(p.text) h += '<div class="p-txt">'+ esc(p.text) +'</div>';
    if(p.imgs && p.imgs.length){
      var g = Math.min(p.imgs.length, 9);
      var cls = g===1?'g1':(g===2?'g2':(g===4?'g4':'g3'));
      h += '<div class="p-imgs '+cls+'">';
      for(var i=0;i<g;i++) h += '<div class="ph"><span>'+ esc(p.imgs[i]||'🖼') +'</span></div>';
      h += '</div>';
    }
    h +=   '</div>';
    h +=   '<div class="p-body">';
    h +=     '<div class="p-meta">';
    h +=       '<span class="act'+(liked?' on':'')+'" onclick="like(\''+p.id+'\')">'+(liked?'♥ 已赞':'♡ 赞')+'</span>';
    h +=       '<span class="act" onclick="openComment(\''+p.id+'\')">💬 评论</span>';
    h +=       '<span class="p-time">'+ since(p.time) +'</span>';
    h +=     '</div>';
    h +=   '</div>';

    var inter = '';
    if(p.likes && p.likes.length){
      var names = p.likes.map(function(w){ return person(w).name; });
      inter += '<div class="p-likes"><span class="ht">♥</span> <b>'+ esc(names.join('、')) +'</b></div>';
    }
    if(p.comments && p.comments.length){
      inter += '<div class="cmts">';
      p.comments.forEach(function(c){
        inter += '<div class="cmt"><b>'+ esc(person(c.who).name) +'</b>'+
                 (c.to? '<span class="to"> 回复 </span><b>'+esc(person(c.to).name)+'</b>' : '') +
                 '：'+ esc(c.text) +
                 '<span class="rp" onclick="openComment(\''+p.id+'\',\''+c.who+'\')">回复</span></div>';
      });
      inter += '</div>';
    }
    if(inter) h += '<div class="p-inter">'+ inter +'</div>';
    h += '</div>';
  });
  feed.innerHTML = h;
}

function like(id){
  var p = db.posts.filter(function(x){return x.id===id})[0];
  if(!p) return;
  p.likes = p.likes || [];
  var i = p.likes.indexOf(ME);
  if(i>=0) p.likes.splice(i,1); else p.likes.push(ME);
  save(); render();
}

function openComment(id, to){
  var p = db.posts.filter(function(x){return x.id===id})[0];
  if(!p) return;
  var who = to ? person(to).name : '';
  var txt = prompt(who ? ('回复 '+who+'：') : '评论：');
  if(txt===null) return;
  txt = String(txt).trim();
  if(!txt) return;
  p.comments = p.comments || [];
  p.comments.push({who:ME, to:to||null, text:txt, time:nowStr()});
  save(); render();
}

function openSheet(id){
  document.getElementById('scrim').classList.add('on');
  document.getElementById(id).classList.add('on');
}
function closeAll(){
  document.getElementById('scrim').classList.remove('on');
  ['shCompose','shProfile','shCover'].forEach(function(k){
    document.getElementById(k).classList.remove('on');
  });
}

var cpImgs = [];
function openCompose(){
  cpImgs = [];
  document.getElementById('cpText').value = '';
  drawPick();
  openSheet('shCompose');
}
function drawPick(){
  var box = document.getElementById('cpImgs'), h = '';
  cpImgs.forEach(function(e,i){
    h += '<div class="sq" onclick="delPhoto('+i+')"><span>'+ esc(e) +'</span></div>';
  });
  if(cpImgs.length < 9) h += '<div class="sq" onclick="addPhoto()"><span>＋</span></div>';
  box.innerHTML = h;
}
function addPhoto(){
  var e = prompt('先贴一个 emoji 当图片（接后端后就能传真的了）','🌸');
  if(e===null) return;
  e = String(e).trim();
  if(!e) return;
  if(cpImgs.length>=9){ alert('最多九张'); return; }
  cpImgs.push(e); drawPick();
}
function delPhoto(i){ cpImgs.splice(i,1); drawPick(); }

function publish(){
  var t = document.getElementById('cpText').value.trim();
  if(!t && !cpImgs.length) return;
  db.posts.unshift({
    id:uid(), who:ME, time:nowStr(),
    text:t, imgs:cpImgs.slice(),
    likes:[], comments:[]
  });
  save(); render(); closeAll();
}

function openProfile(){
  document.getElementById('pfName').value = db.me.name||'';
  document.getElementById('pfAvatar').value = db.me.avatar||'';
  openSheet('shProfile');
}
function saveProfile(){
  db.me.name = document.getElementById('pfName').value.trim() || '桐桐';
  db.me.avatar = document.getElementById('pfAvatar').value.trim() || '🐱';
  save(); render(); closeAll();
}

function openCover(){
  document.getElementById('cvUrl').value = db.me.cover||'';
  openSheet('shCover');
}
function saveCover(){
  db.me.cover = document.getElementById('cvUrl').value.trim();
  save(); render(); closeAll();
}

function tab(i){
  document.querySelectorAll('.tabbar button').forEach(function(b,k){
    b.classList.toggle('on', k===i);
  });
  if(i===0) return;
  if(i===1){ location.href = './hearts.html'; return; }
  if(i===2){ location.href = './galaxy.html'; return; }
}

load();
render();
</script>
</body>
</html>
