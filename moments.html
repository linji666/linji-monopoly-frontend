<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我们">
<title>我们 · 朋友圈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ── 全站统一色卡：粉紫一家 ── */
:root{
  --pink:#ff9ecd;
  --pink-d:#f77bb8;
  --violet:#a98cff;
  --violet-d:#8f6ff0;

  --bg:#ffffff;
  --line:rgba(178,138,190,.13);
  --line2:rgba(178,138,190,.09);
  --txt:#40365a;
  --txt2:#8a7fa4;
  --txt3:#b8abca;
  --pink-soft:#ffd9ec;
  --nick:#8b76e8;
  --inter:#f8f4fd;
  --shadow-sm:0 3px 10px rgba(180,150,200,.10);
}
html,body{height:100%}
body{
  background:#fff;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
#app{position:relative;min-height:100%;padding-bottom:calc(78px + env(safe-area-inset-bottom))}

.cover{
  position:relative;overflow:hidden;
  height:calc(248px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:
    radial-gradient(110% 85% at 16% 6%,rgba(255,158,205,.62),transparent 62%),
    radial-gradient(115% 80% at 88% 18%,rgba(169,140,255,.58),transparent 64%),
    radial-gradient(150% 120% at 50% 122%,rgba(200,170,255,.42),transparent 68%),
    linear-gradient(168deg,#ffe4f5 0%,#f2e4ff 48%,#ece4ff 80%,#ffffff 100%);
  background-size:cover;background-position:center;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  cursor:pointer;transition:transform .12s ease;
}
.cover.holding{transform:scale(.986)}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.8px 1.8px at 11% 24%,rgba(255,255,255,.95),transparent),
    radial-gradient(1.2px 1.2px at 31% 60%,rgba(255,255,255,.85),transparent),
    radial-gradient(2px 2px at 56% 18%,rgba(255,255,255,.9),transparent),
    radial-gradient(1.2px 1.2px at 73% 46%,rgba(255,255,255,.8),transparent),
    radial-gradient(1.6px 1.6px at 87% 72%,rgba(255,255,255,.9),transparent),
    radial-gradient(1.2px 1.2px at 45% 86%,rgba(255,255,255,.75),transparent);
  opacity:.85;
}
.cover::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:64px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.92));
  z-index:2;
}

.corner{
  position:relative;z-index:6;
  display:flex;justify-content:flex-end;align-items:flex-end;
  gap:14px;padding:0 20px;margin-top:-98px;
  pointer-events:none;
}
.corner .nm{
  color:#fff;font-size:19px;font-weight:600;letter-spacing:.4px;
  text-shadow:0 2px 14px rgba(120,70,145,.55);
  padding-bottom:22px;max-width:56vw;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.corner .av{
  width:86px;height:86px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(150deg,#ffe4f5,#f0e6ff);
  border:4px solid #fff;
  box-shadow:0 10px 26px rgba(190,150,205,.26);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:36px;cursor:pointer;pointer-events:auto;
}
.corner .av img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.spacer{height:8px}

.feed{padding:4px 0 18px}
.post{padding:18px 18px 15px;border-bottom:1px solid var(--line2)}
.post:last-child{border-bottom:none}
.p-head{display:flex;gap:12px;align-items:flex-start}
.p-av{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(150deg,#ffe4f5,#f0e6ff);
  display:flex;align-items:center;justify-content:center;font-size:19px;
  border:1.5px solid #fff;box-shadow:var(--shadow-sm);
}
.p-av img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.p-nm{flex:1;min-width:0;padding-top:3px}
.p-nm .n{font-size:14.5px;color:var(--nick);font-weight:600;letter-spacing:.2px}
.p-body{margin-left:54px;margin-top:5px}
.p-txt{font-size:15px;line-height:1.86;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
.p-imgs{display:grid;gap:5px;margin-top:12px}
.p-imgs.g1{grid-template-columns:minmax(0,58%)}
.p-imgs.g2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:74%}
.p-imgs.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.p-imgs.g4{grid-template-columns:repeat(2,minmax(0,1fr));max-width:66%}
.p-imgs .ph{
  position:relative;padding-top:100%;border-radius:10px;overflow:hidden;
  background:linear-gradient(140deg,#ffe6f5,#efe2ff);
}
.p-imgs .ph span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;opacity:.7;
}
.p-imgs .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-foot{display:flex;align-items:center;margin-top:12px;margin-left:54px}
.p-foot .tm{flex:1;font-size:12px;color:var(--txt3)}
.p-foot .dots{
  padding:3px 10px;border-radius:8px;cursor:pointer;
  background:#f8f3fc;color:#ab97c8;
  font-size:13px;letter-spacing:1.5px;line-height:1.2;transition:background .16s;
}
.p-foot .dots:active{background:#f1e9f9}
.p-foot .dots.on{background:linear-gradient(135deg,var(--pink-soft),#eadfff);color:#a07ac4}
.p-inter{
  margin-left:54px;margin-top:10px;border-radius:12px;
  background:var(--inter);overflow:hidden;
}
.p-inter:empty{display:none}
.p-likes{
  padding:10px 13px;font-size:13px;line-height:1.72;color:#9d84d4;
  border-bottom:1px solid rgba(178,138,190,.09);
}
.p-likes b{color:var(--nick);font-weight:600}
.p-likes .ht{color:var(--pink)}
.cmts{padding:5px 0}
.cmt{padding:7px 13px;font-size:13.5px;line-height:1.68;color:var(--txt)}
.cmt b{color:var(--nick);font-weight:600}
.cmt .to{color:var(--txt3)}
.cmt .rp{font-size:11.5px;color:var(--txt3);margin-left:8px;cursor:pointer}

.menu{margin-left:54px;margin-top:8px;display:flex;gap:8px;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu span{
  padding:8px 16px;border-radius:11px;font-size:13px;cursor:pointer;
  background:#f9f4fd;color:#9578c4;letter-spacing:.3px;
}
.menu span.on{background:linear-gradient(135deg,var(--pink-soft),#eadfff);color:#a07ac4;font-weight:600}

.fab{
  position:fixed;right:20px;z-index:45;
  bottom:calc(94px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;border:none;
  background:linear-gradient(140deg,var(--pink),var(--violet));
  box-shadow:0 14px 32px rgba(169,140,255,.5);
  color:#fff;font-size:26px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .14s;
}
.fab:active{transform:scale(.92)}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(66px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#c8bcd8;font-size:10.5px;letter-spacing:1.2px;font-family:inherit;
  transition:color .18s;
}
.tabbar button.on{color:#a98cff}
.tabbar svg{width:22px;height:22px}

.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(120,90,140,.24);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:#fff;border-radius:26px 26px 0 0;
  box-shadow:0 -10px 44px rgba(190,150,205,.22);
  padding:24px 22px calc(30px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  max-height:88vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:15.5px;font-weight:600;margin-bottom:18px;letter-spacing:1.2px;color:#5f5180}
.sheet textarea{
  width:100%;min-height:112px;background:#fbf7fe;
  border:1px solid var(--line);border-radius:18px;padding:15px;
  color:var(--txt);font-size:15px;line-height:1.78;font-family:inherit;resize:none;outline:none;
}
.sheet textarea::placeholder{color:var(--txt3)}
.pickimgs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.pickimgs .sq{
  position:relative;padding-top:100%;border-radius:14px;cursor:pointer;
  border:1.5px dashed var(--pink-soft);background:#fbf7fe;overflow:hidden;
}
.pickimgs .sq span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:23px;color:#d9c3e6;
}
.pickimgs .sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rowbtns{display:flex;gap:11px;margin-top:20px}
.rowbtns button{
  flex:1;padding:14px 0;border-radius:18px;border:none;
  font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;
}
.rowbtns .no{background:#f6f1fa;color:var(--txt2)}
.rowbtns .ok{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;
  box-shadow:0 10px 24px rgba(169,140,255,.42)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12.5px;color:var(--txt2);margin-bottom:8px;letter-spacing:.4px}
.fld input{
  width:100%;background:#fbf7fe;border:1px solid var(--line);
  border-radius:15px;padding:12px 14px;color:var(--txt);font-size:15px;
  font-family:inherit;outline:none;
}
.fld input::placeholder{color:var(--txt3)}
.note{font-size:11.5px;color:var(--txt3);line-height:1.72;margin-top:5px}

/* ══ 头像那一块：预览 + 两个按钮 ══ */
.avrow{
  display:flex;align-items:center;gap:16px;margin-bottom:18px;
}
.avprev{
  width:76px;height:76px;border-radius:20px;flex-shrink:0;
  background:linear-gradient(150deg,#ffe4f5,#f0e6ff);
  border:2px solid #fff;box-shadow:var(--shadow-sm);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:32px;
}
.avprev img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.avbtns{flex:1;display:flex;flex-direction:column;gap:8px}
.avbtns button{
  padding:11px 0;border-radius:14px;border:none;cursor:pointer;
  font-size:13.5px;font-family:inherit;font-weight:600;
  background:#f7f2fb;color:#8f7ab0;transition:background .16s;
}
.avbtns button:active{background:#f0e8f8}
.avbtns .main{
  background:linear-gradient(135deg,var(--pink-soft),#e8dcff);color:#9a6ac4;
}
.avbtns .tip{font-size:11px;color:var(--txt3);text-align:center;line-height:1.5}

.who{display:flex;gap:10px;margin-bottom:20px}
.who button{
  flex:1;padding:11px 0;border-radius:15px;border:1.5px solid var(--line);
  background:#fbf7fe;color:var(--txt2);font-size:13.5px;font-family:inherit;
  font-weight:600;cursor:pointer;letter-spacing:.4px;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:7px;
  overflow:hidden;white-space:nowrap;
}
.who button.on{
  border-color:var(--pink-soft);
  background:linear-gradient(135deg,#fff2fa,#f5eeff);
  color:#a07ac4;box-shadow:var(--shadow-sm);
}
.who .dot{
  width:22px;height:22px;border-radius:6px;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  background:linear-gradient(150deg,#ffe4f5,#f0e6ff);
}
.who .dot img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.who .lb{overflow:hidden;text-overflow:ellipsis}

.cmtbox{
  width:100%;background:#fbf7fe;border:1px solid var(--line);
  border-radius:18px;padding:15px;color:var(--txt);font-size:15px;
  line-height:1.78;font-family:inherit;resize:none;outline:none;min-height:92px;
}
.cmtbox::placeholder{color:var(--txt3)}
.replyto{
  display:inline-block;font-size:12.5px;color:#a07ac4;
  background:#f8f2ff;border-radius:99px;padding:5px 13px;margin-bottom:11px;
}
.replyto b{font-weight:600}

.empty{text-align:center;color:var(--txt3);font-size:13.5px;padding:90px 30px;line-height:2.1}

.toast{
  position:fixed;left:50%;bottom:calc(148px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px);
  background:rgba(90,70,120,.92);color:#fff;
  font-size:12.5px;letter-spacing:.5px;
  padding:9px 18px;border-radius:99px;
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;
  z-index:70;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.sbar{
  position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%) translateY(-40px);
  z-index:80;padding:6px 15px;border-radius:99px;
  background:rgba(90,70,120,.88);color:#fff;font-size:11.5px;letter-spacing:.5px;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;
}
.sbar.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sbar.bad{background:rgba(180,80,110,.9)}

/* 贴网址的小弹窗 */
.mini{
  position:fixed;left:22px;right:22px;top:50%;transform:translateY(-50%) scale(.96);
  z-index:75;background:#fff;border-radius:22px;padding:22px;
  box-shadow:0 20px 60px rgba(120,80,150,.28);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
}
.mini.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.mini h4{font-size:15px;color:#5f5180;margin-bottom:14px;letter-spacing:.8px}
.mini input{
  width:100%;background:#fbf7fe;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;color:var(--txt);font-size:14.5px;
  font-family:inherit;outline:none;
}
.mini .row{display:flex;gap:10px;margin-top:16px}
.mini .row button{
  flex:1;padding:12px 0;border-radius:14px;border:none;cursor:pointer;
  font-size:14.5px;font-family:inherit;font-weight:600;
}
.mini .row .no{background:#f6f1fa;color:var(--txt2)}
.mini .row .ok{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}
</style>
</head>
<body>
<div id="app">
  <div class="cover" id="cover"></div>

  <div class="corner">
    <div class="nm" id="myName">桐桐</div>
    <div class="av" id="myAvatar" onclick="openProfile()"></div>
  </div>

  <div class="spacer"></div>
  <div class="feed" id="feed"></div>
</div>

<button class="fab" onclick="openCompose()">＋</button>

<nav class="tabbar">
  <button class="on" onclick="tab(0)">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
    朋友圈
  </button>
  <button onclick="tab(1)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v11H9l-5 3.2V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    心事
  </button>
  <button onclick="tab(2)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.4c3.6 1.6 6 3.6 6 6.6 0 4.2-3 7.4-6 10.6-3-3.2-6-6.4-6-10.6 0-3 2.4-5 6-6.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="10" r="1.6" stroke="currentColor" stroke-width="1.3"/></svg>
    银河
  </button>
</nav>

<div class="scrim" id="scrim" onclick="closeAll()"></div>
<div class="toast" id="toast"></div>
<div class="sbar" id="sbar"></div>

<!-- 贴网址 -->
<div class="mini" id="miUrl">
  <h4>贴一个图片网址</h4>
  <input id="miUrlInput" placeholder="https://…">
  <div class="row">
    <button class="no" onclick="closeMini()">算了</button>
    <button class="ok" onclick="useUrl()">用这个</button>
  </div>
</div>

<div class="sheet" id="shCompose">
  <h3>说点什么</h3>
  <textarea id="cpText" placeholder="此刻的想法…"></textarea>
  <div class="pickimgs" id="cpImgs">
    <div class="sq" onclick="addPhoto()"><span>＋</span></div>
  </div>
  <div class="note">图片可以先从相册选（会自动缩小），不用图床</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">先不写</button>
    <button class="ok" onclick="publish()">发出去</button>
  </div>
</div>

<div class="sheet" id="shComment">
  <h3 id="cmTitle">评论</h3>
  <div id="cmToWrap"></div>
  <textarea class="cmtbox" id="cmText" placeholder="说点什么…"></textarea>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="sendComment()">发出去</button>
  </div>
</div>

<div class="sheet" id="shProfile">
  <h3>资料</h3>
  <div class="who">
    <button id="whoMe" class="on" onclick="switchWho('me')"><span class="dot" id="dotMe">🐱</span><span class="lb" id="lblMe">我</span></button>
    <button id="whoHim" onclick="switchWho('him')"><span class="dot" id="dotHim">🍀</span><span class="lb" id="lblHim">林霁</span></button>
  </div>
  <div class="fld"><label>昵称</label><input id="pfName" placeholder="起个名字"></div>
  <div class="avrow">
    <div class="avprev" id="avPrev">🐱</div>
    <div class="avbtns">
      <button class="main" onclick="pickImage()">从相册选一张</button>
      <button onclick="askUrl()">或者贴个网址</button>
      <div class="tip">选完会自动缩小，省流量</div>
    </div>
  </div>
  <div class="note">改完存在服务器上，刷新、换手机都不丢。</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="saveProfile()">保存</button>
  </div>
</div>

<div class="sheet" id="shCover">
  <h3>换封面</h3>
  <div class="avrow">
    <div class="avprev" id="cvPrev" style="width:112px;border-radius:16px">🌸</div>
    <div class="avbtns">
      <button class="main" onclick="pickCover()">从相册选一张</button>
      <button onclick="askCoverUrl()">或者贴个网址</button>
      <div class="tip">封面会宽一点</div>
    </div>
  </div>
  <div class="note">不选就用现在这个粉紫渐变。</div>
  <div class="rowbtns">
    <button class="no" onclick="clearCover()">清掉</button>
    <button class="ok" onclick="saveCover()">用这张</button>
  </div>
</div>

<script src="api.js"></script>
<script>
var ME  = 'me';
var HIM = 'linji';

var API = window.__API__ || null;

var db = null;
var CACHE = 'moments_cache_v1';
var online = false;
var openMenu = null;

/* 待保存的头像/封面（data URL 或网址）。null 表示没动过 */
var pendingAvatar = null;
var pendingCover  = null;
var urlTarget     = null;

function nowStr(){
  var d=new Date();
  function p(n){return n<10?'0'+n:''+n}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function since(t){
  var d=new Date(String(t).replace(/-/g,'/')), s=(Date.now()-d.getTime())/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  if(s<86400*3) return Math.floor(s/86400)+' 天前';
  return String(t).slice(0,10);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(t){
  return String(t==null?'':t).replace(/[&<>"]/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
  });
}
function isImg(v){
  return /^(https?:\/\/|data:image\/)/.test(v||'');
}

function blank(){
  return {
    profiles:{
      me:{name:'桐桐',avatar:'🐱',cover:''},
      linji:{name:'桐桐大人饶命呀',avatar:'🍀',cover:''}
    },
    posts:[]
  };
}
function fromServer(d){ return { profiles: d.profiles || {}, posts: d.posts || [] }; }

function load(){
  try{
    var raw = localStorage.getItem(CACHE);
    db = raw ? JSON.parse(raw) : blank();
  }catch(e){ db = blank(); }
  if(!db.profiles) db.profiles = blank().profiles;
  if(!db.posts) db.posts = [];
  render();
  syncFromServer();
}
function cache(){
  try{ localStorage.setItem(CACHE, JSON.stringify(db)); }catch(e){}
}

function syncFromServer(showBar){
  if(!API || !API.ready()) return;
  API.state().then(function(d){
    db = fromServer(d);
    online = true;
    cache(); render();
    if(showBar) setBar('已经在服务器上了');
  }).catch(function(){
    online = false;
    if(showBar || !db.posts.length) setBar('服务器没连上，先看的是本机缓存', true);
  });
}

function setBar(msg, bad){
  var el = document.getElementById('sbar');
  el.textContent = msg;
  el.classList.toggle('bad', !!bad);
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 2600);
}
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 2000);
}

function person(who){
  var p = (db.profiles && db.profiles[who]) || {};
  var fb = (who===ME) ? {name:'桐桐',avatar:'🐱'} : {name:'桐桐大人饶命呀',avatar:'🍀'};
  return { name: p.name || fb.name, avatar: p.avatar || fb.avatar, img: p.img || '' };
}
function avatarInner(p){
  var a = p.avatar || '';
  if(isImg(a)) return '<img src="'+esc(a)+'" alt="">';
  return esc(a || '🙂');
}

/* ═══ 渲染 ═══ */
function render(){
  var mp = person(ME);
  document.getElementById('myName').textContent = mp.name;
  document.getElementById('myAvatar').innerHTML = avatarInner({avatar:mp.avatar});

  var cv = document.getElementById('cover');
  var cov = (db.profiles && db.profiles[ME] && db.profiles[ME].cover) || '';
  if(cov){ cv.style.backgroundImage = 'url("'+cov+'")'; }
  else{ cv.style.backgroundImage = ''; }

  var feed = document.getElementById('feed');
  if(!db.posts.length){
    feed.innerHTML = '<div class="empty">还没有人说话<br>点右下角那个 ＋</div>';
    return;
  }
  var h = '';
  db.posts.forEach(function(p){
    var who = person(p.who);
    var liked = (p.likes||[]).indexOf(ME) >= 0;
    var isOpen = (openMenu === p.id);

    h += '<div class="post" data-id="'+p.id+'">';
    h +=   '<div class="p-head">';
    h +=     '<div class="p-av">'+ avatarInner(who) +'</div>';
    h +=     '<div class="p-nm"><div class="n">'+ esc(who.name) +'</div></div>';
    h +=   '</div>';
    h +=   '<div class="p-body">';
    if(p.text) h += '<div class="p-txt">'+ esc(p.text) +'</div>';
    if(p.imgs && p.imgs.length){
      var g = Math.min(p.imgs.length, 9);
      var cls = g===1?'g1':(g===2?'g2':(g===4?'g4':'g3'));
      h += '<div class="p-imgs '+cls+'">';
      for(var i=0;i<g;i++){
        var src = p.imgs[i]||'';
        h += '<div class="ph">'+
             (isImg(src) ? '<img src="'+esc(src)+'" alt="">' : '<span>'+esc(src||'🖼')+'</span>')+
             '</div>';
      }
      h += '</div>';
    }
    h +=   '</div>';
    h +=   '<div class="p-foot">';
    h +=     '<span class="tm">'+ since(p.time) +'</span>';
    h +=     '<span class="dots'+(isOpen?' on':'')+'" onclick="toggleMenu(\''+p.id+'\')">···</span>';
    h +=   '</div>';

    if(isOpen){
      h += '<div class="menu">';
      h +=   '<span class="'+(liked?'on':'')+'" onclick="like(\''+p.id+'\')">'+(liked?'♥ 已赞':'♡ 赞')+'</span>';
      h +=   '<span onclick="openComment(\''+p.id+'\')">评论</span>';
      h += '</div>';
    }

    var inter = '';
    if(p.likes && p.likes.length){
      var names = p.likes.map(function(w){ return person(w).name; });
      inter += '<div class="p-likes"><span class="ht">♥</span> <b>'+ esc(names.join('，')) +'</b></div>';
    }
    if(p.comments && p.comments.length){
      inter += '<div class="cmts">';
      p.comments.forEach(function(c){
        inter += '<div class="cmt"><b>'+ esc(person(c.who).name) +'</b>'+
                 (c.to? '<span class="to"> 回复 </span><b>'+esc(person(c.to).name)+'</b>' : '') +
                 '：'+ esc(c.text) +
                 '<span class="rp" onclick="openComment(\''+p.id+'\',\''+c.who+'\')">回复</span></div>';
      });
      inter += '</div>';
    }
    if(inter) h += '<div class="p-inter">'+ inter +'</div>';
    h += '</div>';
  });
  feed.innerHTML = h;
}

function toggleMenu(id){ openMenu = (openMenu===id) ? null : id; render(); }

function needOnline(){
  if(online) return true;
  toast('服务器没连上，先发不出去');
  return false;
}

function like(id){
  var p = db.posts.filter(function(x){return x.id===id})[0];
  if(!p) return;
  p.likes = p.likes || [];
  var i = p.likes.indexOf(ME);
  var wasLiked = i>=0;
  if(wasLiked) p.likes.splice(i,1); else p.likes.push(ME);
  cache(); render();

  if(!API || !API.ready()) return;
  API.post('/api/post/'+id+'/like', {}).catch(function(){
    p.likes = p.likes || [];
    if(wasLiked){ if(p.likes.indexOf(ME)<0) p.likes.push(ME); }
    else { var j = p.likes.indexOf(ME); if(j>=0) p.likes.splice(j,1); }
    cache(); render();
    setBar('没发送成功，回头再试', true);
  });
}

var cmTarget = null, cmTo = null;
function openComment(id, to){
  var p = db.posts.filter(function(x){return x.id===id})[0];
  if(!p) return;
  cmTarget = id; cmTo = to||null;
  var wrap = document.getElementById('cmToWrap');
  if(to){
    document.getElementById('cmTitle').textContent = '回复';
    wrap.innerHTML = '<div class="replyto">回复 <b>'+ esc(person(to).name) +'</b></div>';
  }else{
    document.getElementById('cmTitle').textContent = '评论';
    wrap.innerHTML = '';
  }
  document.getElementById('cmText').value = '';
  openSheet('shComment');
  setTimeout(function(){ document.getElementById('cmText').focus(); }, 320);
}
function sendComment(){
  var p = db.posts.filter(function(x){return x.id===cmTarget})[0];
  var txt = document.getElementById('cmText').value.trim();
  if(!p || !txt) return;
  if(!needOnline()) return;

  p.comments = p.comments || [];
  p.comments.push({who:ME, to:cmTo||null, text:txt, time:nowStr()});
  openMenu = null; cache(); render(); closeAll();

  API.post('/api/post/'+cmTarget+'/comment', {text:txt, to:cmTo||null})
    .then(function(){ syncFromServer(); })
    .catch(function(){ setBar('评论没发成功', true); });
}

function openSheet(id){
  document.getElementById('scrim').classList.add('on');
  document.getElementById(id).classList.add('on');
}
function closeAll(){
  document.getElementById('scrim').classList.remove('on');
  ['shCompose','shProfile','shCover','shComment'].forEach(function(k){
    document.getElementById(k).classList.remove('on');
  });
}

/* ═══ 发动态 ═══ */
var cpImgs = [];
function openCompose(){
  cpImgs = [];
  document.getElementById('cpText').value = '';
  drawPick();
  openSheet('shCompose');
}
function drawPick(){
  var box = document.getElementById('cpImgs'), h = '';
  cpImgs.forEach(function(e,i){
    h += '<div class="sq" onclick="delPhoto('+i+')">'+
         (isImg(e) ? '<img src="'+esc(e)+'" alt="">' : '<span>'+esc(e)+'</span>')+
         '</div>';
  });
  if(cpImgs.length < 9) h += '<div class="sq" onclick="addPhoto()"><span>＋</span></div>';
  box.innerHTML = h;
}
function addPhoto(){
  if(cpImgs.length >= 9){ toast('最多九张'); return; }
  pickImageFile(900, 0.82, function(dataUrl){
    cpImgs.push(dataUrl); drawPick();
  });
}
function delPhoto(i){ cpImgs.splice(i,1); drawPick(); }

function publish(){
  var t = document.getElementById('cpText').value.trim();
  if(!t && !cpImgs.length) return;
  if(!needOnline()) return;

  var pid = uid();
  db.posts.unshift({
    id:pid, who:ME, time:nowStr(),
    text:t, imgs:cpImgs.slice(), likes:[], comments:[]
  });
  openMenu = null; cache(); render(); closeAll();

  API.post('/api/post', {text:t, imgs:cpImgs.slice()})
    .then(function(){ syncFromServer(); })
    .catch(function(){
      db.posts = db.posts.filter(function(x){ return x.id!==pid; });
      cache(); render();
      setBar('没发出去，回头再试', true);
    });
}

/* ═══ 选图 → 缩小 → dataURL ═══ */
function pickImageFile(maxSide, quality, cb){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);

  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    document.body.removeChild(inp);
    if(!f) return;
    if(f.size > 12*1024*1024){ toast('这张太大了，换一张'); return; }

    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var r = Math.min(maxSide/im.width, maxSide/im.height, 1);
        var w = Math.max(1, Math.round(im.width * r));
        var h = Math.max(1, Math.round(im.height * r));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var g = c.getContext('2d');
        g.drawImage(im, 0, 0, w, h);
        var out;
        try{ out = c.toDataURL('image/jpeg', quality); }
        catch(e){ out = fr.result; }
        cb(out);
      };
      im.onerror = function(){ toast('这张读不出来'); };
      im.src = fr.result;
    };
    fr.onerror = function(){ toast('这张读不出来'); };
    fr.readAsDataURL(f);
  }, { once:true });

  inp.click();
}

/* ═══ 资料 ═══ */
var whoNow = 'me';
function openProfile(){
  whoNow = 'me';
  pendingAvatar = null;
  fillWho();
  openSheet('shProfile');
}
function switchWho(w){
  whoNow = w;
  pendingAvatar = null;
  fillWho();
}
function fillWho(){
  var meOn = whoNow==='me';
  document.getElementById('whoMe').classList.toggle('on', meOn);
  document.getElementById('whoHim').classList.toggle('on', !meOn);

  var meP = person(ME), himP = person(HIM);
  document.getElementById('dotMe').innerHTML = avatarInner({avatar:meP.avatar});
  document.getElementById('dotHim').innerHTML = avatarInner({avatar:himP.avatar});
  document.getElementById('lblMe').textContent = meP.name;
  document.getElementById('lblHim').textContent = himP.name;

  var cur = meOn ? meP : himP;
  document.getElementById('pfName').value = cur.name || '';
  document.getElementById('avPrev').innerHTML = avatarInner({avatar:cur.avatar});
}
function pickImage(){
  pickImageFile(240, 0.86, function(dataUrl){
    pendingAvatar = dataUrl;
    document.getElementById('avPrev').innerHTML = '<img src="'+dataUrl+'" alt="">';
  });
}
function askUrl(){
  urlTarget = 'avatar';
  document.getElementById('miUrlInput').value = '';
  document.getElementById('scrim').classList.add('on');
  document.getElementById('miUrl').classList.add('on');
}
function askCoverUrl(){
  urlTarget = 'cover';
  document.getElementById('miUrlInput').value = '';
  document.getElementById('scrim').classList.add('on');
  document.getElementById('miUrl').classList.add('on');
}
function closeMini(){
  document.getElementById('miUrl').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
function useUrl(){
  var u = document.getElementById('miUrlInput').value.trim();
  if(!isImg(u)){ toast('要 http(s) 或图片地址'); return; }
  if(urlTarget === 'avatar'){
    pendingAvatar = u;
    document.getElementById('avPrev').innerHTML = '<img src="'+esc(u)+'" alt="">';
  }else{
    pendingCover = u;
    document.getElementById('cvPrev').innerHTML = '<img src="'+esc(u)+'" alt="" style="width:100%;height:100%;object-fit:cover">';
  }
  closeMini();
}

function saveProfile(){
  if(!needOnline()) return;
  var n = document.getElementById('pfName').value.trim();
  var target = (whoNow==='me') ? ME : HIM;

  db.profiles[target] = db.profiles[target] || {};
  var payload = { target: target, name: n };
  if(pendingAvatar){ db.profiles[target].avatar = pendingAvatar; payload.avatar = pendingAvatar; }
  if(n) db.profiles[target].name = n;

  cache(); render(); closeAll();
  API.post('/api/profile', payload)
    .then(function(){ pendingAvatar = null; syncFromServer(); })
    .catch(function(){ setBar('资料没存上', true); });
}

/* ═══ 封面 ═══ */
function openCoverHold(){
  pendingCover = null;
  var cov = (db.profiles[ME] && db.profiles[ME].cover) || '';
  document.getElementById('cvPrev').innerHTML =
    cov ? '<img src="'+esc(cov)+'" alt="" style="width:100%;height:100%;object-fit:cover">' : '🌸';
  openSheet('shCover');
}
function pickCover(){
  pickImageFile(1100, 0.82, function(dataUrl){
    pendingCover = dataUrl;
    document.getElementById('cvPrev').innerHTML = '<img src="'+dataUrl+'" alt="" style="width:100%;height:100%;object-fit:cover">';
  });
}
function clearCover(){
  pendingCover = '';
  document.getElementById('cvPrev').innerHTML = '🌸';
}
function saveCover(){
  if(!needOnline()) return;
  var u = (pendingCover === null) ? ((db.profiles[ME] && db.profiles[ME].cover) || '') : pendingCover;

  db.profiles[ME] = db.profiles[ME] || {name:'桐桐',avatar:'🐱'};
  db.profiles[ME].cover = u;
  cache(); render(); closeAll();

  API.post('/api/profile', {target:ME, name:db.profiles[ME].name, cover:u})
    .then(function(){ pendingCover = null; syncFromServer(); })
    .catch(function(){ setBar('封面没存上', true); });
}

/* ═══ 长按封面 ═══ */
(function(){
  var el = document.getElementById('cover');
  var t=null, sx=0, sy=0, fired=false, HOLD=520;
  function start(x,y){
    sx=x; sy=y; fired=false; el.classList.add('holding');
    t = setTimeout(function(){
      fired = true; el.classList.remove('holding');
      if(navigator.vibrate) navigator.vibrate(12);
      openCoverHold();
    }, HOLD);
  }
  function move(x,y){ if(t && (Math.abs(x-sx)>10 || Math.abs(y-sy)>10)) cancel(); }
  function cancel(){ if(t){ clearTimeout(t); t=null; } el.classList.remove('holding'); }
  function end(){
    if(t){ clearTimeout(t); t=null; }
    el.classList.remove('holding');
    if(!fired) toast('长按封面可以换背景');
  }
  el.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    start(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  el.addEventListener('touchmove', function(e){
    if(e.touches.length!==1) return;
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  el.addEventListener('touchend', function(){ end(); }, {passive:true});
  el.addEventListener('touchcancel', function(){ cancel(); }, {passive:true});
  el.addEventListener('mousedown', function(e){ start(e.clientX,e.clientY); });
  el.addEventListener('mousemove', function(e){ move(e.clientX,e.clientY); });
  el.addEventListener('mouseup', function(){ end(); });
  el.addEventListener('mouseleave', function(){ cancel(); });
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();

function tab(i){
  document.querySelectorAll('.tabbar button').forEach(function(b,k){
    b.classList.toggle('on', k===i);
  });
  if(i===0) return;
  if(i===1){ location.href = './hearts.html'; return; }
  if(i===2){ location.href = './galaxy.html'; return; }
}

document.addEventListener('visibilitychange', function(){
  if(!document.hidden) syncFromServer();
});

load();
