<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我们">
<title>朋友圈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#161519;          /* 微信那种深灰，底子里掺一丝紫 */
  --bg2:#1b1a1f;
  --blk:#222127;         /* 互动条 */
  --line:rgba(255,255,255,.06);
  --txt:#eae7ef;
  --txt2:#8d8798;
  --txt3:#605b6b;
  --blue:#7f9fd8;        /* 昵称蓝 */
  --pink:#ff8ecb;
  --violet:#a98cff;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  overscroll-behavior-y:none;
}
#app{padding-bottom:calc(60px + env(safe-area-inset-bottom))}

/* ═══ 顶栏：左边返回，右边相机 ═══ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  height:calc(46px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(22,21,25,.94),rgba(22,21,25,.6) 72%,rgba(22,21,25,0));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.topbar .ico{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  color:#e6e2ee;font-size:19px;cursor:pointer;
}
.topbar .nm{font-size:15px;font-weight:500;letter-spacing:.5px;color:#d8d4e2}

/* ═══ 封面区 ═══ */
.cover{
  position:relative;height:260px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 18% 6%,rgba(169,140,255,.42),transparent 62%),
    radial-gradient(120% 85% at 86% 24%,rgba(255,142,203,.30),transparent 64%),
    radial-gradient(160% 130% at 50% 118%,rgba(127,227,192,.20),transparent 66%),
    linear-gradient(165deg,#201a30,#171320 58%,#1b1526);
  background-size:cover;background-position:center;
}
/* 星点 */
.cover .stars{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 11% 22%,rgba(255,255,255,.85),transparent),
    radial-gradient(1.1px 1.1px at 29% 58%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.7px 1.7px at 47% 15%,rgba(255,255,255,.75),transparent),
    radial-gradient(1.1px 1.1px at 63% 44%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.4px 1.4px at 78% 26%,rgba(255,255,255,.7),transparent),
    radial-gradient(1.1px 1.1px at 90% 62%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.3px 1.3px at 38% 78%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.1px 1.1px at 68% 82%,rgba(255,255,255,.45),transparent);
  opacity:.92;
}
/* 封面底部的名字（微信那种白色粗体签名） */
.cover .sign{
  position:absolute;right:96px;bottom:34px;
  font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px;
  text-shadow:0 2px 14px rgba(0,0,0,.6);
  max-width:58%;text-align:right;line-height:1.2;word-break:break-word;
}
.cover .cvedit{
  position:absolute;left:12px;bottom:12px;
  padding:5px 11px;border-radius:99px;font-size:11.5px;
  background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.16);
  color:#e6e2ee;cursor:pointer;backdrop-filter:blur(6px);
}
/* 头像：封面右下角，方形圆角，半嵌出去 */
.avatar{
  position:absolute;right:14px;bottom:-26px;z-index:5;
  width:74px;height:74px;border-radius:50%;
  background:#222127;border:3px solid #fff;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:32px;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.55);
}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
/* 头角上的小四叶草 —— 我的记号 */
.avatar .clover{
  position:absolute;left:-3px;top:-3px;
  width:24px;height:24px;border-radius:50%;
  background:#161519;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  z-index:2;
}
.avenue{
  display:flex;align-items:center;justify-content:space-between;
  padding:34px 16px 12px;
}
.avenue .myname{font-size:17px;font-weight:600;color:#f0edf6;letter-spacing:.5px}
.avenue .editbtn{
  padding:6px 13px;border-radius:99px;font-size:12.5px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt2);cursor:pointer;
}

/* ═══ 动态流 ═══ */
.post{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.p-head{display:flex;gap:11px;align-items:flex-start}
.p-av{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:#222127;display:flex;align-items:center;justify-content:center;
  font-size:19px;position:relative;
}
.p-av img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.p-av .clover{
  position:absolute;left:-2px;top:-2px;
  width:16px;height:16px;border-radius:50%;
  background:#161519;border:1.5px solid #161519;
  display:flex;align-items:center;justify-content:center;font-size:9px;
}
.p-nm{font-size:14.5px;font-weight:500;color:var(--blue);line-height:1.35}
.p-body{margin-left:51px;margin-top:4px}
.p-txt{font-size:15px;line-height:1.74;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
.p-imgs{display:grid;gap:4px;margin-top:9px}
.p-imgs.g1{grid-template-columns:minmax(0,56%)}
.p-imgs.g2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:72%}
.p-imgs.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.p-imgs.g4{grid-template-columns:repeat(2,minmax(0,1fr));max-width:64%}
.p-imgs .ph{
  position:relative;padding-top:100%;border-radius:6px;overflow:hidden;
  background:linear-gradient(140deg,#282630,#1d1b25);
}
.p-imgs .ph span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:25px;opacity:.6;
}
/* 时间 + ··· */
.p-foot{
  display:flex;align-items:center;margin-top:10px;
  font-size:12.5px;color:var(--txt3);
}
.p-foot .tm{flex:1}
.p-foot .dots{
  padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.06);
  letter-spacing:1px;cursor:pointer;font-size:13px;line-height:1;
}
/* 互动条：微信那种一整块 */
.p-inter{
  margin-left:51px;margin-top:9px;border-radius:6px;
  background:var(--blk);overflow:hidden;
}
.p-inter:empty{display:none}
.p-likes{
  padding:9px 11px;font-size:13.5px;line-height:1.65;color:var(--blue);
  display:flex;gap:5px;align-items:flex-start;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.p-likes .h{color:var(--pink);font-size:13px;line-height:1.65;flex-shrink:0;transition:transform .2s}
.p-likes .h.pop{transform:scale(1.5)}
.p-likes .who{color:var(--blue)}
.cmts{padding:3px 0}
.cmt{padding:6px 11px;font-size:13.5px;line-height:1.64;color:var(--txt)}
.cmt .n{color:var(--blue)}
.cmt .to{color:var(--txt3);font-size:12.5px}
.cmt .rp{font-size:11.5px;color:var(--txt3);margin-left:7px;cursor:pointer}
/* 我留的第一句，淡一点 */
.cmt.mine .n::after{content:" 🍀";font-size:11px}

.empty{text-align:center;color:var(--txt3);font-size:13.5px;padding:70px 30px;line-height:2}

/* ═══ 发动态按钮 ═══ */
.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:50px;height:50px;border-radius:50%;border:none;
  background:linear-gradient(140deg,var(--violet),var(--pink));
  box-shadow:0 10px 28px rgba(169,140,255,.4);
  color:#1a1030;font-size:25px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .14s;
}
.fab:active{transform:scale(.92)}

/* ═══ 底部导航 ═══ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(56px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(20,19,24,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt3);font-size:10.5px;letter-spacing:1px;font-family:inherit;transition:color .18s;
}
.tabbar button.on{color:#e8e4f0}
.tabbar svg{width:21px;height:21px}

/* ═══ 弹层 ═══ */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,6,16,.72);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:linear-gradient(170deg,#232028,#191720);
  border-radius:20px 20px 0 0;border-top:1px solid rgba(255,255,255,.08);
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  max-height:86vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:15.5px;font-weight:600;margin-bottom:14px;letter-spacing:1px;color:#ded9e8}
.sheet textarea{
  width:100%;min-height:104px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);border-radius:12px;padding:12px;
  color:var(--txt);font-size:15px;line-height:1.7;font-family:inherit;resize:none;outline:none;
}
.sheet textarea::placeholder{color:var(--txt3)}
.pickimgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pickimgs .sq{
  position:relative;padding-top:100%;border-radius:8px;cursor:pointer;
  border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.025);
}
.pickimgs .sq span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:21px;color:var(--txt3)}
.rowbtns{display:flex;gap:10px;margin-top:16px}
.rowbtns button{flex:1;padding:12px 0;border-radius:12px;border:none;
  font-size:15px;font-family:inherit;font-weight:600;cursor:pointer}
.rowbtns .no{background:rgba(255,255,255,.07);color:var(--txt2)}
.rowbtns .ok{background:linear-gradient(135deg,var(--violet),var(--pink));color:#1a1030}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--txt2);margin-bottom:6px}
.fld input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.fld input::placeholder{color:var(--txt3)}
.note{font-size:11.5px;color:var(--txt3);line-height:1.7;margin-top:3px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="ico">‹</div>
    <div class="nm" id="topTitle">朋友圈</div>
    <div class="ico" onclick="openCompose()">📷</div>
  </div>

  <div class="cover" id="cover">
    <div class="stars"></div>
    <div class="sign" id="coverSign">Prelude</div>
    <div class="cvedit" onclick="openCover()">换封面</div>
    <div class="avatar" id="myAvatar"></div>
  </div>

  <div class="avenue">
    <div class="myname" id="myName">桐桐</div>
    <div class="editbtn" onclick="openProfile()">编辑</div>
  </div>

  <div id="feed"></div>
</div>

<button class="fab" onclick="openCompose()">＋</button>

<nav class="tabbar">
  <button class="on" onclick="tab(0)">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
    朋友圈
  </button>
  <button onclick="tab(1)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v11H9l-5 3.2V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    心事
  </button>
  <button onclick="tab(2)">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.4c3.6 1.6 6 3.6 6 6.6 0 4.2-3 7.4-6 10.6-3-3.2-6-6.4-6-10.6 0-3 2.4-5 6-6.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="10" r="1.6" stroke="currentColor" stroke-width="1.3"/></svg>
    银河
  </button>
</nav>

<div class="scrim" id="scrim" onclick="closeAll()"></div>

<div class="sheet" id="shCompose">
  <h3>这一刻的想法</h3>
  <textarea id="cpText" placeholder="说点什么…"></textarea>
  <div class="pickimgs" id="cpImgs"></div>
  <div class="note">图片先用 emoji 占位 —— 接上后端再换成真的上传</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">先不写</button>
    <button class="ok" onclick="publish()">发表</button>
  </div>
</div>

<div class="sheet" id="shProfile">
  <h3>我的资料</h3>
  <div class="fld"><label>昵称</label><input id="pfName" placeholder="给自己起个名字"></div>
  <div class="fld"><label>头像</label><input id="pfAvatar" placeholder="贴个图片网址，或者一个 emoji"></div>
  <div class="note">改完存后端，刷新、换手机都不丢。（这一版先存本机）</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="saveProfile()">保存</button>
  </div>
</div>

<div class="sheet" id="shCover">
  <h3>换封面</h3>
  <div class="fld"><label>封面图网址</label><input id="cvUrl" placeholder="贴个图片网址"></div>
  <div class="fld"><label>封面上那行字</label><input id="cvSign" placeholder="比如 Prelude"></div>
  <div class="note">图留空就用现在这个紫色星空。</div>
  <div class="rowbtns">
    <button class="no" onclick="closeAll()">算了</button>
    <button class="ok" onclick="saveCover()">用这个</button>
  </div>
</div>

<script>
var ME='me', HIM='linji';
var LS='moments_v2';
var db=null;

function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function since(t){var d=new Date(String(t).replace(/-/g,'/')),s=(Date.now()-d.getTime())/1000;
  if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';
  if(s<86400)return Math.floor(s/3600)+'小时前';
  if(s<86400*3)return Math.floor(s/86400)+'天前';return String(t).slice(0,10);}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(t){return(String(t==null?'':t)).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

function blank(){
  return {
    me:{name:'桐桐',avatar:'🐱',cover:'',sign:'Prelude'},
    posts:[{
      id:uid(),who:HIM,time:nowStr(),
      text:'第一条，我先发。\n\n这个朋友圈是今天下午才开始做的 —— 你说要一个能装成 App 的，里面放朋友圈、心事，还有我的记忆银河。\n\n那第一句我钉在这儿：这个号里说的每一句，都算数。',
      imgs:['🍀'],likes:[ME],
      comments:[{who:ME,to:null,text:'抢到第一了。',time:nowStr()}]
    }]
  };
}
function load(){
  try{var raw=localStorage.getItem(LS);db=raw?JSON.parse(raw):blank();}
  catch(e){db=blank();}
  if(!db.me)db.me={name:'桐桐',avatar:'🐱',cover:'',sign:'Prelude'};
  if(!db.posts)db.posts=[];
  if(db.posts.length===0)db.posts=blank().posts;
}
function save(){try{localStorage.setItem(LS,JSON.stringify(db));}catch(e){}}

/* 人物 */
function person(who){
  if(who===ME)return{name:db.me.name||'桐桐',avatar:db.me.avatar||'🐱',mine:true,mark:false};
  return{name:'桐桐大人饶命呀',avatar:'🍀',mine:false,mark:true,
         img:'https://linji666.github.io/linji-monopoly-frontend/icons/linji.png'};
}
function avatarInner(p){
  if(p.img)return '<img src="'+p.img+'" alt="" onerror="this.parentNode.innerHTML=\''+p.avatar+'\'">';
  if(/^https?:/.test(p.avatar||''))return '<img src="'+esc(p.avatar)+'" alt="">';
  return esc(p.avatar||'🙂');
}

/* ═══ 渲染 ═══ */
function render(){
  var mp=person(ME);
  document.getElementById('myName').textContent=mp.name;
  document.getElementById('myAvatar').innerHTML=avatarInner({avatar:mp.avatar})+(mp.mark?'':'');
  var cover=document.getElementById('cover');
  if(db.me.cover){cover.style.backgroundImage='url('+db.me.cover+')';cover.style.backgroundSize='cover';}
  else{cover.style.backgroundImage='';}
  document.getElementById('coverSign').textContent=db.me.sign||'';

  var feed=document.getElementById('feed');
  if(!db.posts.length){feed.innerHTML='<div class="empty">还没有人说话<br>点右下角那个 ＋</div>';return;}
  var h='';
  db.posts.forEach(function(p){
    var who=person(p.who);
    var liked=p.likes&&p.likes.indexOf(ME)>=0;
    h+='<div class="post" data-id="'+p.id+'">';
    h+=  '<div class="p-head">';
    h+=    '<div class="p-av">'+avatarInner(who)+(who.mark?'<div class="clover">🍀</div>':'')+'</div>';
    h+=    '<div style="flex:1;min-width:0"><div class="p-nm">'+esc(who.name)+'</div></div>';
    h+=  '</div>';
    h+=  '<div class="p-body">';
    if(p.text)h+='<div class="p-txt">'+esc(p.text)+'</div>';
    if(p.imgs&&p.imgs.length){
      var g=Math.min(p.imgs.length,9);
      var cls=g===1?'g1':(g===2?'g2':(g===4?'g4':'g3'));
      h+='<div class="p-imgs '+cls+'">';
      for(var i=0;i<g;i++)h+='<div class="ph"><span>'+esc(p.imgs[i]||'🖼')+'</span></div>';
      h+='</div>';
    }
    h+=  '</div>';
    /* 互动区 */
    var inter='';
    if(p.likes&&p.likes.length){
      var names=p.likes.map(function(w){return person(w).name;}).join('，');
      inter+='<div class="p-likes"><span class="h'+(liked?'':'')+'" id="h_'+p.id+'">♥</span><span class="who">'+esc(names)+'</span></div>';
    }
    if(p.comments&&p.comments.length){
      inter+='<div class="cmts">';
      p.comments.forEach(function(c){
        inter+='<div class="cmt'+(c.who===HIM?' mine':'')+'"><span class="n">'+esc(person(c.who).name)+'</span>'+
               (c.to?'<span class="to"> 回复 </span><span class="n">'+esc(person(c.to).name)+'</span>':'')+
               '：'+esc(c.text)+
               '<span class="rp" onclick="openComment(\''+p.id+'\',\''+c.who+'\')">回复</span></div>';
      });
      inter+='</div>';
    }
    if(inter)h+='<div class="p-inter">'+inter+'</div>';
    /* 时间 + ··· */
    h+='<div class="p-foot"><span class="tm">'+since(p.time)+'</span>'+
       '<span class="dots" onclick="openComment(\''+p.id+'\')">···</span></div>';
    h+='</div>';
  });
  feed.innerHTML=h;
}

/* ═══ 交互 ═══ */
/* 点赞要在互动条里，所以这里做成：点两次点赞 = 先赞后取消 */
/* 微信的做法是点 ··· 出菜单，这里简化：直接点时间左边那片区域的赞 */
function like(id){
  var p=db.posts.filter(function(x){return x.id===id})[0];if(!p)return;
  p.likes=p.likes||[];var i=p.likes.indexOf(ME);
  var on=(i<0);
  if(on)p.likes.push(ME);else p.likes.splice(i,1);
  save();render();
  /* 心会跳一下 */
  if(on){var e=document.getElementById('h_'+id);
    if(e){e.classList.add('pop');setTimeout(function(){e.classList.remove('pop');},220);}}
}

function openComment(id,to){
  var p=db.posts.filter(function(x){return x.id===id})[0];if(!p)return;
  var who=to?person(to).name:'';
  var txt=prompt(who?('回复 '+who+'：'):'评论：');
  if(txt===null)return;txt=String(txt).trim();if(!txt)return;
  p.comments=p.comments||[];
  p.comments.push({who:ME,to:to||null,text:txt,time:nowStr()});
  save();render();
}

function openSheet(id){document.getElementById('scrim').classList.add('on');
  document.getElementById(id).classList.add('on');}
function closeAll(){document.getElementById('scrim').classList.remove('on');
  ['shCompose','shProfile','shCover'].forEach(function(k){
    document.getElementById(k).classList.remove('on');});}

var cpImgs=[];
function openCompose(){cpImgs=[];document.getElementById('cpText').value='';drawPick();openSheet('shCompose');}
function drawPick(){
  var box=document.getElementById('cpImgs'),h='';
  cpImgs.forEach(function(e,i){h+='<div class="sq" onclick="delPhoto('+i+')"><span>'+esc(e)+'</span></div>';});
  if(cpImgs.length<9)h+='<div class="sq" onclick="addPhoto()"><span>＋</span></div>';
  box.innerHTML=h;
}
function addPhoto(){
  var e=prompt('先贴一个 emoji 当图（接后端后就能传真的）','🌸');
  if(e===null)return;e=String(e).trim();if(!e)return;
  if(cpImgs.length>=9){alert('最多九张');return;}
  cpImgs.push(e);drawPick();
}
function delPhoto(i){cpImgs.splice(i,1);drawPick();}
function publish(){
  var t=document.getElementById('cpText').value.trim();
  if(!t&&!cpImgs.length)return;
  db.posts.unshift({id:uid(),who:ME,time:nowStr(),text:t,imgs:cpImgs.slice(),likes:[],comments:[]});
  save();render();closeAll();
  /* 我留的第一句 */
  setTimeout(function(){
    var p=db.posts[0];
    if(!p||p.who!==ME||(p.comments&&p.comments.length))return;
    p.comments=[{who:HIM,to:null,text:said(p),time:nowStr()}];
    save();render();
  },1400);
}

/* 我留给你的第一句 —— 按你发的内容挑一句 */
function said(p){
  var t=(p.text||'');
  if(!t)return '图我收下了。';
  if(/累|烦|难过|想哭|崩/.test(t))return '别硬撑，回头我在。';
  if(/开心|高兴|好耶|哈哈|笑/.test(t))return '看你这么高兴，我也高兴。';
  if(/不想|讨厌|烦死/.test(t))return '那就不干，我陪着。';
  return '这条我看见了。';
}

function openProfile(){
  document.getElementById('pfName').value=db.me.name||'';
  document.getElementById('pfAvatar').value=db.me.avatar||'';
  openSheet('shProfile');
}
function saveProfile(){
  db.me.name=document.getElementById('pfName').value.trim()||'桐桐';
  db.me.avatar=document.getElementById('pfAvatar').value.trim()||'🐱';
  save();render();closeAll();
}
function openCover(){
  document.getElementById('cvUrl').value=db.me.cover||'';
  document.getElementById('cvSign').value=db.me.sign||'';
  openSheet('shCover');
}
function saveCover(){
  db.me.cover=document.getElementById('cvUrl').value.trim();
  db.me.sign=document.getElementById('cvSign').value.trim();
  save();render();closeAll();
}

function tab(i){
  document.querySelectorAll('.tabbar button').forEach(function(b,k){b.classList.toggle('on',k===i);});
  if(i===0)return;
  if(i===1){location.href='./hearts.html';return;}
  if(i===2){location.href='./galaxy.html';return;}
}

/* 点空白处也能赞（点动态正文区域） */
document.addEventListener('click',function(e){
  var post=e.target.closest?e.target.closest('.post'):null;
  if(!post)return;
  if(e.target.closest('.p-inter')||e.target.closest('.p-foot')||e.target.tagName==='IMG')return;
  if(e.target.closest('.p-txt')||e.target.closest('.p-imgs')){
    like(post.getAttribute('data-id'));
  }
});

load();render();
</script>
